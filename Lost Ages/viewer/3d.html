  if (state === 1) {
    if (prev !== 1) { staggerHud.total = Math.max(1, st[1]); if (!document.hidden) screenFlash("rgba(140,190,255,.35)", 500); }
    staggerHud.left = st[1];
    el.style.display = "block";
    const urgent = st[1] < 3;
    title.textContent = `${(st[3] || "").toUpperCase()} — STAGGER HIM!`;
    title.style.color = urgent && Math.floor(performance.now() / 250) % 2 ? "#ff6a5a" : "#bfe6ff";
    fill.style.width = Math.round(st[0] * 100) + "%";
    fill.style.background = st[0] > 0.8 ? "linear-gradient(#ffe9a0,#e0a020)" : "linear-gradient(#bfe6ff,#3a8cff)";
    text.textContent = `${Math.round(st[0] * 100)}% — ${st[1].toFixed(1)}s`;
    return;
  }
  staggerHud.left = null;
  if (prev === 1 && (state === 2 || state === 3) && bossUnit && !document.hidden) {
    const p = bossUnit.root.position;
    if (state === 2) {   // STAGGERED — he crashes into the arena
      bossUnit.staggeredUntil = (lastT ?? 0) + 8;
      effects.play({ type: "strike", el: "storm", big: true }, bossUnit, bossUnit);
      effects.groundRing(0xbfe6ff, new THREE.Vector3(p.x, 0, p.z), 22, 0.8, { wall: 3 });
      effects.emit({ core: 0xf0e0b8, main: 0x9a7a4a, deep: 0x4a3418, light: null, smoke: 0x6a5a40, el: "earth" }, "burst", new THREE.Vector3(p.x, 0.5, p.z), 60, 3);
      shakeCamera(0.6, p);
      screenFlash("rgba(255,240,190,.45)", 700);
    } else {             // the storm breaks over everyone
      effects.play({ type: "nova", style: "storm", el: "storm", radius: 26, color: 0xbfe6ff }, bossUnit, null);
      effects.play({ type: "nova", el: "storm", radius: 60, color: 0xdff4ff }, bossUnit, null);
      shakeCamera(0.8, p);
      screenFlash("rgba(230,240,255,.95)", 1400);
    }
  }
  if (state === 2 || state === 3) {
    el.style.display = "block";
    title.textContent = state === 2 ? "STAGGERED!" : "THE STORM BREAKS";
    title.style.color = state === 2 ? "#ffe08a" : "#ff6a5a";
    fill.style.width = (state === 2 ? 100 : Math.round(st[0] * 100)) + "%";
    fill.style.background = state === 2 ? "linear-gradient(#ffe9a0,#e0a020)" : "linear-gradient(#ff8a7a,#a02010)";
    text.textContent = state === 2 ? "Stunned — he takes 50% more damage. Go all in!" : `Not enough damage (${Math.floor(st[0] * 100)}%)`;
    return;
  }
  el.style.display = "none";
}

// Line from the boss to whoever it's attacking
const targetLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.6 }));
targetLine.visible = false;
scene.add(targetLine);

// =====================================================================
//  FIGHT STATE
// =====================================================================
let data = null, players = [], enemies = [], pets = [], lastT = null, bossUnit = null, bossTarget = null, follow = null;

function resetFight(d) {
  players.forEach(u => u.dispose());
  enemies.forEach(u => u?.dispose());
  pets.forEach(u => u?.dispose());
  pets = [];
  effects.clear();
  syncZones([]);
  clearHolyGrounds();
  clearHazards();
  data = d; lastT = null; bossUnit = null; bossTarget = null; follow = null;
  players = d.players.map((p, i) => new Unit({ kind: "p", index: i, ...p }));
  enemies = [];
  particles.clear();
  const bossInfo = (d.enemies || []).find(e => e.boss);
  setTheme(bossInfo?.name || d.title);
  setWorld(d.world || null);
  hud.reset(d, players);
  renderModelsPanel();
  hud.status(d.title);
}

function enemyUnit(id) {
  if (!enemies[id]) {
    const info = data.enemies[id];
    if (!info) return null;
    enemies[id] = new Unit({ kind: "e", index: id, name: info.name, isBoss: info.boss, elite: info.elite });
    if (info.boss) bossUnit = enemies[id];
    renderModelsPanel();
  }
  return enemies[id];
}

// Necromancer's Corrupted Servants
function petUnit(id) {
  if (!pets[id]) pets[id] = new Unit({ kind: "m", index: id, name: "Corrupted Servant" });
  return pets[id];
}

function applyFrame(f) {
  const frameDt = lastT == null ? 0.1 : Math.max(0.05, f.t - lastT);
  lastT = f.t;
  f.p.forEach((r, i) => players[i]?.setFrame(r[0], r[1], r[2], !!r[3], !!r[4], r[5], r[6], r[7], frameDt, r[8], r[9], r[10], r[11]));
  const seen = new Set();
  for (const r of f.e) {
    const u = enemyUnit(r[0]);
    if (!u) continue;
    u.setFrame(r[1], r[2], r[3], !!r[4], !!r[6], r[5], r[6], r[7], frameDt);
    u.flying = !!r[8];
    u.ascending = r[8] === 2;   // high in the storm, charging a stagger check
    seen.add(r[0]);
  }
  enemies.forEach((u, id) => { if (u && !seen.has(id)) u.root.visible = false; });
  const seenPets = new Set();
  for (const [id, , x, y, fc] of f.pt || []) {
    const u = petUnit(id);
    const fresh = !u.placed;
    u.setFrame(x, y, 1, false, false, fc, 0, 0, frameDt);
    if (fresh) effects.play({ type: "poof", color: 0x7dff6a }, u, null);   // rising from the ground
    seenPets.add(id);
  }
  pets.forEach((u, id) => { if (u && !seenPets.has(id) && u.root.visible) { effects.play({ type: "poof", color: 0x333344 }, u, null); u.root.visible = false; } });
  syncZones(f.z);
  for (const a of f.a || []) playAction(a);

  bossTarget = f.tg != null ? players[f.tg] : null;
  updateStagger(f.st);
  hud.frame(f, { players, bossUnit, bossTarget, follow });
  hud.status(`${data.title}`);
}

function unitRef(kind, i) {
  return kind === "p" ? players[i] : kind === "e" ? enemyUnit(i) : kind === "m" ? pets[i] || null : null;
}
function playAction([ak, ai, key, tk, ti]) {
  const actor = unitRef(ak, ai);
  if (!actor || !actor.root.visible) return;
  const target = unitRef(tk, ti);
  const dist = target ? actor.root.position.distanceTo(target.root.position) : 0;
  const spec = key === "_swing" && actor === bossUnit && dist < 12
    ? { type: "slash", big: true, chop: Math.random() < 0.35, el: theme === "fire" ? "fire" : theme === "storm" ? "storm" : theme === "shadow" ? "shadow" : "physical",
        color: theme === "fire" ? 0xff7a1a : theme === "storm" ? 0x8fd8ff : theme === "shadow" ? 0x9b5cff : 0xe8e8e8 }   // the boss's own heavy swings
    : effectFor(key, dist);
  if (ak === "p" && key !== "_swing") hud.abilityUsed(ai, key, lastT ?? 0);
  actor.act(key, target, spec);
  if (!document.hidden) effects.play(spec, actor, target);   // (in a background tab nothing is drawn — don't pile effects up)
}

// ---------- The game interface (hud.js) ----------
const hud = createHUD({
  classColors: CLASS_COLORS,
  // Clicking a raid frame: while playing it picks your friendly target (heals, buffs, revives), otherwise it follows them
  onFollow: (u) => {
    if (playing) setAllyTarget(u);
    else follow = follow === u ? null : u;
  },
  onTake: (u) => takeControl(u ? u.name : null),
  onSlot: (key, shown) => { if (playing && shown?.u === myUnit()) sendInput({ cast: key }); },
});

// =====================================================================
//  PLAYING A CHARACTER YOURSELF
// =====================================================================
let playing = null;          // name of the raid member you control
let playable = false;        // only during a live fight
let enemyTarget = null, allyTarget = null;   // Units
const held = new Set();      // movement keys being held
const myUnit = () => (playing ? players.find(u => u.name === playing) : null);

function post(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(r => (r.status === 204 ? {} : r.json())).catch(() => ({ ok: false, reason: "Can't reach the simulation" }));
}
const sendInput = (msg) => post("/api/input", msg);

async function takeControl(name) {
  const res = await post("/api/control", { name });
  if (res && res.ok === false) hud.error(res.reason || "Can't take control right now");
}
function setControlled(name) {
  const was = playing;
  playing = name || null;
  held.clear();
  hud.setControl({ name: playing });
  if (playing) {
    const me = myUnit();
    follow = me;
    if (me && was !== playing) {   // swing the camera in a bit closer
      const off = camera.position.clone().sub(controls.target).setLength(22);
      camera.position.copy(controls.target).add(off);
    }
  } else { enemyTarget = allyTarget = null; }
  hud.setTargets("", "");
}
function setEnemyTarget(u) {
  enemyTarget = u;
  sendInput({ enemyTarget: u ? { kind: "e", id: u.index } : null });
}
function setAllyTarget(u) {
  allyTarget = allyTarget === u ? null : u;
  sendInput({ allyTarget: allyTarget ? { kind: "p", index: allyTarget.index } : null });
}
// Tab: next enemy, nearest first
function cycleTarget() {
  const me = myUnit();
  if (!me) return;
  const foes = enemies.filter(u => u && !u.dead && u.root.visible)
    .sort((a, b) => a.root.position.distanceTo(me.root.position) - b.root.position.distanceTo(me.root.position));
  if (!foes.length) return;
  const i = foes.indexOf(enemyTarget);
  setEnemyTarget(foes[(i + 1) % foes.length]);
}
// WASD → a direction on the ground, relative to where the camera is looking
function moveVector() {
  const f = controls.target.clone().sub(camera.position); f.y = 0; f.normalize();
  const r = new THREE.Vector3(-f.z, 0, f.x);
  const fw = (held.has("f") ? 1 : 0) - (held.has("b") ? 1 : 0);
  const rt = (held.has("r") ? 1 : 0) - (held.has("l") ? 1 : 0);
  const v = f.multiplyScalar(fw).add(r.multiplyScalar(rt));
  return { x: +v.x.toFixed(3), y: +v.z.toFixed(3) };
}
let lastMove = "", lastMoveSent = 0;
function pushMove(force = false) {
  const m = moveVector(), k = m.x + "," + m.y, now = performance.now();
  if (force || (k !== lastMove && now - lastMoveSent > 80)) { lastMove = k; lastMoveSent = now; sendInput({ move: m }); }
}
const MOVE_KEYS = { KeyW: "f", ArrowUp: "f", KeyS: "b", ArrowDown: "b", KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r" };
const ABILITY_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "="];
addEventListener("keydown", (e) => {
  if (!playing || e.target.tagName === "SELECT") return;
  if (MOVE_KEYS[e.code]) { e.preventDefault(); if (!e.repeat) { held.add(MOVE_KEYS[e.code]); pushMove(true); } return; }
  const n = ABILITY_KEYS.indexOf(e.key);
  if (n !== -1 && !e.repeat) {
    const me = data?.players.find(p => p.name === playing);
    const ab = me?.abilities?.[n];
    if (ab) sendInput({ cast: ab[0] });
    return;
  }
  if (e.key === "Tab") { e.preventDefault(); cycleTarget(); }
  if (e.key === "Escape") takeControl(null);
}, true);
addEventListener("keyup", (e) => { if (playing && MOVE_KEYS[e.code]) { held.delete(MOVE_KEYS[e.code]); pushMove(true); } });
addEventListener("blur", () => { if (playing && held.size) { held.clear(); pushMove(true); } });

// Click an enemy (or a raid member) in the 3D world to target them
const raycaster = new THREE.Raycaster();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!playing || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;   // that was a camera drag
  raycaster.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const roots = [...enemies, ...players].filter(u => u && u.root.visible).map(u => u.root);
  const hit = raycaster.intersectObjects(roots, true)[0];
  let o = hit?.object;
  while (o && !o.userData.unit) o = o.parent;
  const u = o?.userData.unit;
  if (!u) return;
  if (u.kind === "e" && !u.dead) setEnemyTarget(u);
  else if (u.kind === "p") setAllyTarget(u);
});

// Rings on the ground under your targets: red = enemy, green = friendly
const targetRing = (color) => {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.85, 1.05, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  scene.add(m);
  return m;
};
const enemyRing = targetRing(0xff3a2a), allyRing = targetRing(0x4cff6a);
function updateTargetRings(t) {
  const show = (ring, u) => {
    ring.visible = !!(playing && u && u.root.visible && !(u.kind === "e" && u.dead));
    if (!ring.visible) return;
    ring.position.set(u.root.position.x, 0.05, u.root.position.z);
    ring.scale.setScalar(u.size * (1.05 + Math.sin(t * 6) * 0.06));
  };
  const en = enemyTarget && !enemyTarget.dead ? enemyTarget : bossUnit;   // no target picked = the boss
  show(enemyRing, en);
  show(allyRing, allyTarget);
  if (playing && data) {
    hud.setTargets(en ? `${en.name} ${Math.round(en.hp * 100)}%` : "",
      allyTarget ? `${allyTarget.name} ${allyTarget.dead ? "(dead)" : Math.round(allyTarget.hp * 100) + "%"}` : "");
  }
}
const addLog = (t, text, cls) => hud.log(t, text, cls);
const showResult = (r) => hud.result(r);

// ---------- Models panel ----------
function renderModelsPanel() {
  if (!data) { hud.models(""); return; }
  const rows = new Map();   // one row per unit kind: the file it uses, or the names it would use
  for (const u of [...players, ...enemies.filter(Boolean), ...pets.filter(Boolean)]) {
    const found = modelFilesFor(u).find(f => availableModels.has(f));
    const key = found || modelFilesFor(u).join(" or ");
    rows.set(key, found ? `<div class="ok">✔ models/${found}</div>` : `<div class="no">○ ${modelFilesFor(u).join(" · ")}</div>`);
  }
  const anims = [...availableModels].filter(f => f.startsWith("animations/"));
  hud.models(`<div class="hud-title" style="font-size:13px;margin-bottom:6px">3D models for this fight</div>
    <p style="margin:0 0 8px;color:var(--dim)">Put <code>.glb</code> files in <code>viewer/models/</code> with any of these names (the first one found is used), then refresh the page.
    Animations go in <code>viewer/models/animations/</code> (idle, run, attack, cast, death). See <code>viewer/models/README.txt</code>.</p>` +
    [...rows.values()].join("") + (anims.length ? `<div style="margin-top:8px;color:var(--dim)">Animations: ${anims.map(a => a.slice(11)).join(", ")}</div>` : ""));
}

// =====================================================================
//  LIVE + REPLAY
// =====================================================================
let mode = "live", paused = false, speed = 1, source = null;
let replay = null, replayClock = 0, frameIdx = 0, eventIdx = 0;

function startLive() {
  mode = "live"; replay = null;
  hud.el("live").classList.add("on");
  hud.el("replays").value = "";
  source?.close();
  source = new EventSource("/live");
  hud.status("waiting for a fight… (run node scripts/simulate.js)");
  source.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    // Who you're playing (can arrive before the first fight starts)
    if (msg.type === "control") {
      if (msg.playable !== undefined) playable = msg.playable;
      hud.setControl({ playable });
      setControlled(msg.name);
      return;
    }
    if (msg.type === "start") {
      resetFight(msg.data);
      // New fight: new enemies, so old targets are gone. Keep playing the same character.
      enemyTarget = allyTarget = null;
      if (playing) { follow = myUnit(); sendInput({ enemyTarget: null, allyTarget: null }); hud.setControl({ name: playing }); }
      msg.data.events.slice(-40).forEach(([t, text]) => addLog(t, text));
      const last = msg.data.frames[msg.data.frames.length - 1];
      if (last) applyFrame({ ...last, a: [] });
      if (msg.data.result) showResult(msg.data.result);
    } else if (!data) {
      if (msg.type === "info") addLog(null, msg.text, "info");
    } else if (msg.type === "frame") {
      if (msg.enemies) data.enemies = msg.enemies;
      if (msg.zoneNames) data.zoneNames = msg.zoneNames;
      if (!paused) applyFrame(msg.frame);
    } else if (msg.type === "region") {
      showRegion(msg);
    } else if (msg.type === "door") {
      showDoor(msg);
    } else if (msg.type === "castResult") {
      if (!msg.ok && msg.reason) hud.error(msg.reason);
    } else if (msg.type === "event") addLog(msg.e[0], msg.e[1]);
    else if (msg.type === "end") showResult(msg.result);
    else if (msg.type === "info") addLog(null, msg.text, "info");
  };
  source.onerror = () => hud.status("not connected — is the simulation running?");
}

async function loadReplayList() {
  try {
    const list = await (await fetch("/api/replays")).json();
    hud.setReplays(list);
    return list;
  } catch { return []; }
}

async function startReplay(file) {
  source?.close(); source = null;
  mode = "replay";
  hud.el("live").classList.remove("on");
  playable = false;
  setControlled(null);
  hud.setControl({ playable: false });
  const d = await (await fetch("/replays/" + encodeURIComponent(file))).json();
  resetFight(d);
  replay = d; replayClock = 0; frameIdx = 0; eventIdx = 0; paused = false;
  hud.el("pause").textContent = "❚❚";
}

function tickReplay(dt) {
  if (!replay || paused) return;
  replayClock += dt * speed;
  while (frameIdx < replay.frames.length && replay.frames[frameIdx].t <= replayClock) applyFrame(replay.frames[frameIdx++]);
  while (eventIdx < replay.events.length && replay.events[eventIdx][0] <= replayClock) { const [t, text] = replay.events[eventIdx++]; addLog(t, text); }
  if (frameIdx >= replay.frames.length && replay.result && !replay.shownResult) { replay.shownResult = true; showResult(replay.result); }
}

// ---------- Controls ----------
hud.el("live").onclick = startLive;
hud.el("replays").onchange = (e) => e.target.value && startReplay(e.target.value);
hud.el("pause").onclick = () => { paused = !paused; hud.el("pause").textContent = paused ? "▶" : "❚❚"; };
hud.el("speed").onclick = () => { speed = speed >= 4 ? 1 : speed * 2; hud.el("speed").textContent = speed + "×"; };
hud.el("modelsbtn").onclick = () => hud.toggleModels();
const setFancy = (on) => { fancy = on; effects.fancy = on; hud.el("gfx").classList.toggle("on", on); if (!on) particles.clear(); };
hud.el("gfx").onclick = () => setFancy(!fancy);
hud.el("real").onclick = () => applyRealistic(!realistic);
setFancy(true);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); if (!playing) hud.el("pause").click(); }
  if ((e.key === "b" || e.key === "B") && !playing) follow = null;
  if (e.key === "n" || e.key === "N") document.body.classList.toggle("nonames");
  if (e.key === "m" || e.key === "M") hud.toggleModels();
  if (e.key === "g" || e.key === "G") setFancy(!fancy);
  if (e.key === "r" || e.key === "R") applyRealistic(!realistic);
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// =====================================================================
//  RENDER LOOP
// =====================================================================
const clock = new THREE.Clock();
let nextFlash = 0, flashUntil = 0;   // storm lightning
const followPoint = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (mode === "replay") tickReplay(dt);

  const animDt = paused ? 0 : dt * (mode === "replay" ? speed : 1);
  players.forEach(u => u.update(animDt, t));
  enemies.forEach(u => u?.update(animDt, t));
  pets.forEach(u => u?.update(animDt, t));
  effects.update(animDt);
  animateZones(t);
  animateHolyGrounds(animDt, t);
  animateHazards(animDt, t);
  if (fancy) {
    // Embers rise out of burning ground
    for (const g of zoneMeshes) {
      if (!g.visible || !g.userData.hostile || g.userData.age < g.userData.warn) continue;
      const r = g.scale.x, n = Math.min(12, r * r * animDt * 2.5 + (Math.random() < r * animDt * 2 ? 1 : 0));
      const col = g.userData.disc.material.color.getHex();
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * r;
        particles.one(g.position.x + Math.cos(a) * d, 0.1, g.position.z + Math.sin(a) * d,
          (Math.random() - 0.5) * 0.6, 1.2 + Math.random() * 2, (Math.random() - 0.5) * 0.6, Math.random() < 0.3 ? 0xffe0a0 : col, 0.8 + Math.random() * 0.9);
      }
    }
    // Floating motes around the camera: embers (fire), wisps (shadow) or dust
    if (animDt > 0 && Math.random() < 0.9) {
      const c = controls.target;
      for (let i = 0; i < 2; i++) {
        const a = Math.random() * Math.PI * 2, d = Math.random() * 40;
        const kind = theme === "fire" ? [0xff7a2a, 0.9] : theme === "shadow" ? [0x8a7cff, 0.35] : [0x8a8578, 0.25];
        particles.one(c.x + Math.cos(a) * d, Math.random() * 3, c.z + Math.sin(a) * d,
          (Math.random() - 0.5) * 0.4, kind[1] + Math.random() * 0.5, (Math.random() - 0.5) * 0.4, kind[0], 3 + Math.random() * 4, 0.1);
      }
    }
    // Storm arena: rain pouring down
    if (theme === "storm" && animDt > 0) {
      const c = controls.target;
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * 45;
        particles.one(c.x + Math.cos(a) * d, 18 + Math.random() * 6, c.z + Math.sin(a) * d, 1.5, -26 - Math.random() * 6, 0.5, 0x5f7fb0, 0.9, 0);
      }
    }
    particles.update(animDt);
  }
  // Storm arena: lightning flashes across the sky every few seconds
  if (theme === "storm") {
    if (t > (nextFlash || 0)) {
      nextFlash = t + 2.5 + Math.random() * 5;
      flashUntil = t + 0.12;
      const a = Math.random() * Math.PI * 2;
      const cx = worldMode ? controls.target.x : 0, cz = worldMode ? controls.target.z : 0, dd = worldMode ? 70 + Math.random() * 60 : 58;
      const spot = { root: { position: new THREE.Vector3(cx + Math.cos(a) * dd, 0, cz + Math.sin(a) * dd) }, height: 2, size: 1 };
      if (fancy) effects.play({ type: "strike", color: 0xdff4ff, el: "storm", big: true }, spot, spot);
    }
    hemi.intensity = t < flashUntil ? 3.2 : baseHemi;
  } else hemi.intensity = baseHemi;
  // Torches flicker
  torchLights.forEach((l, i) => { l.intensity = worldMode ? 0 : 26 + Math.sin(t * 9 + i * 2.1) * 4 + Math.random() * 3; });
  if (worldMode) animateWorld(dt, t);

  // Boss target line
  if (bossUnit && bossTarget && !bossUnit.dead && bossUnit.root.visible) {
    const a = bossUnit.root.position, b = bossTarget.root.position;
    targetLine.geometry.attributes.position.setXYZ(0, a.x, 0.1, a.z);
    targetLine.geometry.attributes.position.setXYZ(1, b.x, 0.1, b.z);
    targetLine.geometry.attributes.position.needsUpdate = true;
    targetLine.visible = true;
  } else targetLine.visible = false;

  // Fiery bosses light up the room
  if (bossUnit && /Azgaroth|Tyrant/i.test(bossUnit.name) && !bossUnit.dead) {
    bossLight.intensity = 60 + Math.sin(t * 7) * 10;
    bossLight.position.set(bossUnit.root.position.x, 6, bossUnit.root.position.z);
  } else bossLight.intensity = 0;

  // Playing: the camera stays on you, and turning the camera while walking changes direction
  if (playing) {
    const me = myUnit();
    if (me) follow = me;
    if (held.size) pushMove();
  }
  updateTargetRings(t);

  // Camera follows the boss (or whoever you clicked), keeping your chosen angle
  const focus = follow || bossUnit || enemies.find(u => u && !u.dead) || players[0];
  if (focus) {
    followPoint.set(focus.root.position.x, focus.root.position.y + focus.height * 0.4, focus.root.position.z);   // (a Valkyrie flies higher)
    // (a long way off — e.g. you just came out of a raid gate — jump straight there instead of gliding)
    const far = followPoint.distanceTo(controls.target) > 40;
    const delta = followPoint.clone().sub(controls.target).multiplyScalar(far ? 1 : Math.min(1, dt * 3));
    controls.target.add(delta);
    camera.position.add(delta);
  }
  sun.target.position.copy(controls.target);
  if (worldMode) sun.position.copy(controls.target).addScaledVector(worldSunDir, 70);   // the open world: the sun (or moon) moves across the sky
  else sun.position.set(controls.target.x + 30, 55, controls.target.z + 20);
  controls.update();

  const w = innerWidth, h = innerHeight;
  players.forEach(u => u.updatePlate(w, h));
  enemies.forEach(u => u?.updatePlate(w, h));
  pets.forEach(u => u?.updatePlate(w, h));

  // Minimap
  if (data) {
    const look = controls.target.clone().sub(camera.position);
    hud.drawMinimap({
      players, enemies, pets, zones: zoneState, theme, follow, world: worldMode ? data.world : null,
      zoneColor: (nameId, hostile) => zoneColor(data?.zoneNames?.[nameId] || "", hostile),
      camTarget: controls.target, camAngle: Math.atan2(look.z, look.x),
    });
  }

  bloom.enabled = fancy;
  gradePass.uniforms.uTime.value = t % 100;
  // Camera shake (big impacts): nudge the camera for this frame only
  const shook = camShake > 0.002;
  const shakeOff = new THREE.Vector3();
  if (shook) {
    shakeOff.set((Math.random() - 0.5), (Math.random() - 0.5) * 0.6, (Math.random() - 0.5)).multiplyScalar(camShake * 2);
    camera.position.add(shakeOff);
    camShake *= Math.exp(-dt * 7);
  } else camShake = 0;
  if (bokeh.enabled) bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target);
  if (fancy || realistic || gradePass.enabled || bokeh.enabled || gtao.enabled) composer.render();
  else renderer.render(scene, camera);
  if (shook) camera.position.sub(shakeOff);
}

// =====================================================================
//  OPEN WORLD — scenery built from the map the server sends (src/world/worldMap.js):
//  rolling ground that changes with each region, mountains around the edge, roads, the town
//  of Emberhold, graveyards in the Barrows, lava in the Ashen Wastes, crystals in Stormreach,
//  and a glowing gate at the end of each road that leads into a raid.
// =====================================================================
let worldMode = false, worldGroup = null, worldBuiltFor = null;
const worldAnim = { portals: [], fires: [], crystals: [], lavas: [], banners: [] };
const WORLD_PALETTE = {   // sky / fog colour, ambient sky + ground colour, sunlight colour and strength
  town:   { bg: 0x1b2537, hemi: 0xa8bce0, ground: 0x3a3020, sun: 0xffe0b0, sunI: 2.4, hemiI: 1.0 },
  shadow: { bg: 0x141628, hemi: 0x8a96e0, ground: 0x2a2236, sun: 0xc8d0ff, sunI: 2.1, hemiI: 1.15 },
  fire:   { bg: 0x2a0e08, hemi: 0xd88060, ground: 0x34140a, sun: 0xffa878, sunI: 2.3, hemiI: 1.05 },
  storm:  { bg: 0x142036, hemi: 0x7a98ff, ground: 0x1c2638, sun: 0xb8ccff, sunI: 2.0, hemiI: 1.1 },
};
let worldTheme = "town";
const tmpColor = new THREE.Color();

function setWorld(map) {
  worldMode = !!map;
  arenaProps.forEach(o => { o.visible = !worldMode; });
  scene.fog.near = worldMode ? 90 : 70;
  scene.fog.far = worldMode ? 680 : 160;   // in the world you can see the mountains far off
  camera.far = worldMode ? 1200 : 500; camera.updateProjectionMatrix();
  controls.maxDistance = worldMode ? 90 : 140;
  if (worldGroup) worldGroup.visible = worldMode;
  if (!worldMode) { $("worldDoor")?.remove(); return; }
  if (worldBuiltFor !== JSON.stringify(map.doors)) { buildWorldScene(map); worldBuiltFor = JSON.stringify(map.doors); }
  worldTheme = "town"; theme = "stone";
  applyWorldPalette(WORLD_PALETTE.town, 1);
}

function applyWorldPalette(p, k) {
  if (!scene.background?.isColor) scene.background = new THREE.Color();
  scene.background.lerp(tmpColor.setHex(p.bg), k);
  scene.fog.color.copy(scene.background);
  hemi.color.lerp(tmpColor.setHex(p.hemi), k);
  hemi.groundColor.lerp(tmpColor.setHex(p.ground), k);
  sun.color.lerp(tmpColor.setHex(p.sun), k);
  sun.intensity += (p.sunI - sun.intensity) * k;
  baseHemi += (p.hemiI - baseHemi) * k;
}

// Called every frame in the open world: fade between region moods; the scenery animates itself
// (sky, wind in the grass, fires, smoke, fog, lava, the gates)
const worldSunDir = new THREE.Vector3(0.46, 0.84, 0.31);
let lastTimeMode = null;
function animateWorld(dt, t) {
  if (!worldScene) { applyWorldPalette(WORLD_PALETTE[worldTheme] || WORLD_PALETTE.town, Math.min(1, dt * 1.5)); return; }
  const L = worldScene.animate(dt, t, worldTheme, camera, controls.target, fancy, gfx.time);
  // the region's mood, brightened or dimmed by the time of day (and by the sky reflections, which add light of their own)
  const p = WORLD_PALETTE[worldTheme] || WORLD_PALETTE.town;
  const sunHex = tmpColor.setHex(p.sun).lerp(L.sunColor, worldTheme === "town" ? 0.8 : 0.35).getHex();
  const snap = lastTimeMode !== gfx.time; lastTimeMode = gfx.time;
  applyWorldPalette({ ...p, sun: sunHex, sunI: p.sunI * L.sun, hemiI: p.hemiI * L.hemi * (worldReflections ? 0.7 : 1) }, snap ? 1 : Math.min(1, dt * 1.5));
  worldSunDir.copy(L.sunDir);
  scene.fog.color.copy(worldScene.skyHorizon()).multiplyScalar(0.8);   // the haze matches the sky at the horizon
}

// ----- Region banner + boss door prompt -----
function showRegion(msg) {
  worldTheme = msg.theme in WORLD_PALETTE ? msg.theme : "town";
  theme = worldTheme === "town" ? "stone" : worldTheme;   // ambient particles: embers, wisps, rain
  if (msg.quiet) return;   // just a reminder of where you are (no banner)
  let el = $("worldRegion");
  if (!el) {
    el = document.createElement("div");
    el.id = "worldRegion";
    el.style.cssText = "position:absolute;top:22%;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;transition:opacity 1.2s;font-family:Cinzel,serif;z-index:5";
    document.body.appendChild(el);
  }
  const COLORS = { shadow: "#c9b3ff", fire: "#ffb27a", storm: "#bfe6ff", town: "#f3dc9a" };
  el.innerHTML = `<div style="font-size:13px;letter-spacing:.5em;color:#9a93a8;text-transform:uppercase;text-shadow:0 2px 3px #000">${msg.key === "town" ? "Safe haven" : msg.key === "wilds" ? "" : "Now entering"}</div>
    <div style="font-size:46px;font-weight:700;letter-spacing:.08em;color:${COLORS[worldTheme]};text-shadow:0 3px 0 #000,0 0 22px rgba(0,0,0,.9)">${msg.name}</div>`;
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = 0; }, 3200);
}

let doorHere = null;
function showDoor(msg) {
  doorHere = msg.boss ? msg : null;
  let el = $("worldDoor");
  if (!doorHere) { el?.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "worldDoor";
    el.style.cssText = "position:absolute;bottom:200px;left:50%;transform:translateX(-50%);z-index:6;text-align:center;padding:12px 22px;border:1px solid #7a5b22;border-radius:8px;background:linear-gradient(180deg,rgba(35,38,51,.95),rgba(12,14,20,.95));box-shadow:0 0 0 1px #000,0 10px 24px rgba(0,0,0,.6);font-family:'Alegreya Sans',sans-serif;color:#ece6d6";
    document.body.appendChild(el);
  }
  el.innerHTML = `<div style="font-family:Cinzel,serif;font-weight:700;font-size:18px;color:#f3dc9a;letter-spacing:.06em">${msg.name}</div>
    <div style="margin-top:4px;font-size:14px">Press <b style="display:inline-block;padding:0 7px;border:1px solid #888;border-radius:3px;background:#1a1b22">E</b> to enter the raid with your 20-player group</div>`;
}
async function enterDoor() {
  if (!doorHere) return;
  const el = $("worldDoor");
  if (el) el.innerHTML = `<div style="font-family:Cinzel,serif;font-size:16px;color:#f3dc9a">Gathering the raid…</div>`;
  try {
    const res = await (await fetch("/api/world/enter", { method: "POST", body: JSON.stringify({ boss: doorHere.boss }) })).json();
    if (!res.ok) throw new Error(res.reason);
    location.href = withGfx(res.url);
  } catch (err) { hud.error(err.message || "Couldn't enter the raid"); showDoor(doorHere); }
}
addEventListener("keydown", (e) => { if (worldMode && (e.key === "e" || e.key === "E") && doorHere && !e.repeat) enterDoor(); });

// ----- Building the world (the scenery itself is in worldScene.js) -----
let worldScene = null;
function buildWorldScene(map) {
  worldScene?.dispose();
  worldScene = buildWorld(map, { scene, effects, taperTube, lavaTex, stoneTex, hideTex, metalEnv, renderer });
  worldGroup = worldScene.group;
  if (realistic) worldScene.setRealistic(realAssets);
  applyGraphics();
}

// =====================================================================
//  START
// =====================================================================
initCreatures({ mat, glowMat, hideTex, lavaTex, bandsTex, taperTube, buildWeapon, buildBatWing, metalEnv, effects });
buildGfxPanel();
applyGraphics();
await refreshModelList();
await loadRealisticAssets();
if (realAssets.found?.length) applyRealistic(true);   // you added textures/sky: show them
frame();
const params = new URLSearchParams(location.search);
if (params.has("showcase")) {
  startShowcase();
} else {
  const replays = await loadReplayList();
  if (params.has("world")) {   // the open world: make sure it's running (and pick up new gear after a raid)
    const res = await fetch("/api/world/resume", { method: "POST" }).then(r => r.json()).catch(() => ({ ok: false }));
    if (!res.ok) location.href = "/";
    else startLive();
  }
  else if (params.get("replay")) startReplay(params.get("replay"));
  else if (params.has("live")) startLive();
  else if (replays.length) { hud.el("replays").value = replays[0]; startReplay(replays[0]); }
  else startLive();
}

// Started from the main menu: a button to go back to it
if (params.get("menu")) {
  const b = document.createElement("button");
  const toWorld = /world=1/.test(params.get("menu"));
  b.className = "hbtn"; b.textContent = toWorld ? "⟵ Back to the world" : "⟵ Menu"; b.title = toWorld ? "Leave the raid and go back to the open world" : "Back to the main menu";
  b.onclick = () => { location.href = params.get("menu"); };
  document.getElementById("hud-controls")?.prepend(b);
}

// =====================================================================
//  SHOWCASE — the main menu shows one character (or boss) slowly turning,
//  showing off attacks and spells. The menu tells it who to show with postMessage.
// =====================================================================
function startShowcase() {
  document.body.classList.add("showcase", "nonames");
  const style = document.createElement("style");
  style.textContent = "body.showcase > :not(canvas) { display:none !important; }";
  document.head.appendChild(style);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;   // how fast the menu camera circles your character (higher = faster)
  addEventListener("message", (e) => { if (e.data?.showcase) showUnit(e.data.showcase); });
  showUnit({ className: params.get("class") || "Knight", name: params.get("name") || undefined, boss: params.get("boss") || undefined });
  setInterval(() => {   // show off now and then
    const u = players[0] || enemies[0];
    if (!u || u.oneShot) return;
    u.oneShot = { kind: Math.random() < 0.55 ? "attack" : "spell", t: 0, len: u.isDragon ? 0.9 : 0.5 };
    if (u.holyWings) { u.auraUp = true; setTimeout(() => { u.auraUp = false; }, 2500); }
  }, 3200);
  parent?.postMessage({ showcaseReady: true }, "*");
}

function showUnit(spec) {
  players.forEach(u => u.dispose());
  enemies.forEach(u => u?.dispose());
  players = []; enemies = []; bossUnit = null; follow = null;
  const ROLES = { Knight: "tank", Valkyrie: "tank", Healer: "healer" };
  const u = spec.boss
    ? new Unit({ kind: "e", index: 0, name: spec.boss, isBoss: true })
    : new Unit({ kind: "p", index: 0, name: spec.name || spec.className, className: spec.className, role: ROLES[spec.className] || "dps", body: spec.body });
  if (spec.boss) enemies = [u]; else players = [u];
  u.noRing = true;   // no role ring on the floor in the menu
  u.root.position.set(0, 0, 0); u.placed = true; u.tx = 0; u.tz = 0;
  u.facing = u.targetFacing = Math.PI / 2;   // facing the camera
  setTheme(spec.boss || spec.theme || "");
  const h = u.height;
  const dist = spec.boss ? (u.isDragon ? h * 2.6 : h * 2.3) : (u.pegasus ? 6.5 : 4.4);
  controls.target.set(0, h * 0.4, 0);
  camera.position.set(dist * 0.35, h * (spec.boss ? 0.55 : 0.6), dist);
  follow = u;
}
</script>
