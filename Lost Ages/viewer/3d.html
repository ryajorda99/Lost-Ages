<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Ages — 3D Fight Viewer</title>
<!--
  3d.html — watch Lost Ages fights in 3D (live or saved replays).

  Opened automatically by:   node scripts/simulate.js --boss ashenTyrant
  Or for saved replays:       node scripts/viewer.js
  (The old top-down view is still there: add --2d, or open /2d)

  The game interface on top (boss frame, raid frames, action bar, minimap, chat) is in hud.js.
  Spell visuals are in effects.js. Press G to turn glow + particles off on slower PCs.

  REALISTIC MODE (press R or the 🎥 button): ambient occlusion, camera colour grading, sharper shadows,
  and real textures / HDR sky lighting if you put them in viewer/assets/ (see viewer/assets/README.txt).

  CHARACTERS: until you add real 3D models, everyone is drawn as a simple low-poly
  figure built in code (armour, weapons and colours per class).
  To use real models, put .glb files in viewer/models/ — press M in the viewer to see
  which file names it looks for (e.g. models/knight.glb, models/the-hollow-king.glb).
  Animation clips are matched by name: Idle, Run/Walk, Attack/Slash, Cast/Spell, Death/Die.

  Uses Three.js (loaded from the internet, so you need a connection the first time).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* The game interface (boss frame, raid frames, action bar, minimap...) lives in hud.js */
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0d0f16; color:#ece6d6; font:13px/1.35 "Alegreya Sans", "Segoe UI", sans-serif; }
  canvas { display:block; }

  /* Name plates above everyone's head */
  #plates { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .plate { position:absolute; transform:translate(-50%,-100%); text-align:center; white-space:nowrap; }
  .plate .pn { font-size:11px; font-weight:700; text-shadow:0 1px 2px #000, 0 0 3px #000; }
  .plate .ph { width:46px; height:5px; margin:1px auto 0; background:rgba(0,0,0,.7); border:1px solid #000; border-radius:2px; overflow:hidden; }
  .plate .ph div { height:100%; background:linear-gradient(#6fe06a,#2a8a26); }
  .plate.enemy .pn { font-family:Cinzel, serif; }
  .plate.enemy .ph { width:74px; height:6px; } .plate.enemy .ph div { background:linear-gradient(#ff5a4a,#8c1612); }
  .plate.boss, .plate.pet { display:none; }
  .plate.dead { opacity:.35; } .plate.dead .ph { display:none; }
  body.nonames .plate:not(.enemy) .pn { display:none; }

  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9a93a8; font:16px Cinzel, serif; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

<body>
<div id="loading">Loading 3D viewer…</div>
<div id="plates"></div>



<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as cloneSkinned } from "three/addons/utils/SkeletonUtils.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectSystem, effectFor, castColor, paletteOf } from "./effects.js";
import { buildWorld } from "./worldScene.js";
import { initCreatures, creatureKind, buildCreature, animateCreature } from "./creatures.js";
import { createHUD } from "./hud.js";

const $ = (id) => document.getElementById(id);
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = (k) => Math.max(0, Math.min(1, k));

// =====================================================================
//  SCENE
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
$("loading").remove();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f16);
scene.fog = new THREE.Fog(0x0d0f16, 70, 160);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(-26, 24, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.45;
controls.minDistance = 5;
controls.maxDistance = 140;

const hemi = new THREE.HemisphereLight(0x8899cc, 0x221a14, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe8cc, 2.2);
sun.position.set(30, 55, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 160 });
scene.add(sun, sun.target);
const bossLight = new THREE.PointLight(0xff5522, 0, 40, 1.5);   // glow around fiery bosses
scene.add(bossLight);
// Cool light from behind: outlines characters against the dark floor
const rim = new THREE.DirectionalLight(0x6a7cff, 0.9);
rim.position.set(-40, 25, -50);
scene.add(rim);

// ---------- Glow (bloom): spells, torches, eyes and fire shine ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.35, 0.93);   // strength, spread, how bright before it glows
composer.addPass(bloom);
composer.addPass(new OutputPass());
let fancy = true;   // G toggles glow + particles

// ---------- Particles: embers rising from fire, sparks from spell hits, floating motes ----------
function dotTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, "rgba(255,255,255,1)"); grd.addColorStop(0.35, "rgba(255,255,255,.55)"); grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
class Particles {
  constructor(max = 2500) {
    this.max = max; this.next = 0;
    this.pos = new Float32Array(max * 3).fill(-9999);
    this.col = new Float32Array(max * 3);
    this.vel = new Float32Array(max * 3);
    this.base = new Float32Array(max * 3);
    this.life = new Float32Array(max);
    this.maxLife = new Float32Array(max);
    this.drag = new Float32Array(max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(this.col, 3));
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 0.32, map: dotTexture(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    this.points.frustumCulled = false;
    scene.add(this.points);
    this.tmp = new THREE.Color();
  }
  // Spawn one particle at (x,y,z) moving (vx,vy,vz), glowing `color`, living `life` seconds
  one(x, y, z, vx, vy, vz, color, life, drag = 0.6) {
    const i = this.next; this.next = (this.next + 1) % this.max;
    this.pos.set([x, y, z], i * 3); this.vel.set([vx, vy, vz], i * 3);
    this.tmp.setHex(color); this.base.set([this.tmp.r, this.tmp.g, this.tmp.b], i * 3);
    this.life[i] = this.maxLife[i] = life; this.drag[i] = drag;
  }
  // A burst of sparks flying out from a point
  burst(p, color, count, speed = 3) {
    for (let n = 0; n < count; n++) {
      const a = Math.random() * Math.PI * 2, up = Math.random();
      this.one(p.x, p.y, p.z, Math.cos(a) * speed * (0.3 + Math.random()), up * speed * 1.2, Math.sin(a) * speed * (0.3 + Math.random()), color, 0.4 + Math.random() * 0.5, 2.5);
    }
  }
  update(dt) {
    for (let i = 0; i < this.max; i++) {
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      const k = i * 3, d = Math.max(0, 1 - this.drag[i] * dt);
      this.vel[k] *= d; this.vel[k + 2] *= d;
      this.pos[k] += this.vel[k] * dt; this.pos[k + 1] += this.vel[k + 1] * dt; this.pos[k + 2] += this.vel[k + 2] * dt;
      const f = this.life[i] > 0 ? Math.min(1, this.life[i] / this.maxLife[i] * 1.5) : 0;
      this.col[k] = this.base[k] * f; this.col[k + 1] = this.base[k + 1] * f; this.col[k + 2] = this.base[k + 2] * f;
      if (this.life[i] <= 0) this.pos[k + 1] = -9999;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.geometry.attributes.color.needsUpdate = true;
  }
  clear() { this.life.fill(0); this.pos.fill(-9999); this.col.fill(0); }
}
const particles = new Particles();

// =====================================================================
//  REALISTIC MODE (R)
// =====================================================================
let realistic = false;
// Ambient occlusion: soft dark contact shadows where things meet (feet on the floor, pillars...)
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.enabled = false;
composer.insertPass(gtao, 1);
// Camera "look": contrast, saturation, a colour tint per boss, vignette and a touch of film grain
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 0.5 }, uGrain: { value: 0.03 },
    uContrast: { value: 1.08 }, uSaturation: { value: 1.06 }, uTint: { value: new THREE.Color(1, 1, 1) },
  },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uContrast, uSaturation; uniform vec3 uTint; varying vec2 vUv;
    float rand(vec2 co) { return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      col = (col - 0.5) * uContrast + 0.5;
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, uSaturation) * uTint;
      col *= 1.0 - uVignette * smoothstep(0.35, 0.9, distance(vUv, vec2(0.5)));
      col += (rand(vUv * 731.0 + uTime) - 0.5) * uGrain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`,
});
gradePass.enabled = false;
composer.addPass(gradePass);
const THEME_TINT = { fire: [1.06, 0.97, 0.9], shadow: [0.93, 0.95, 1.07], storm: [0.9, 0.97, 1.1], stone: [1, 1, 1] };
// Depth blur: whatever the camera looks at stays sharp, far-off things soften (Ultra, or switch it on in ⚙)
const bokeh = new BokehPass(scene, camera, { focus: 30, aperture: 0.00012, maxblur: 0.006 });
bokeh.enabled = false;
composer.insertPass(bokeh, 2);
// Glows, sparks and other see-through effects aren't solid: keep them out of the depth-based passes
// (otherwise ambient occlusion and depth blur draw them as dark squares)
const fxHidden = [];
const hideFx = () => scene.traverse(o => {
  const m = o.material;
  if (o.visible && (o.isSprite || o.isPoints || o.isLine || (m && !Array.isArray(m) && m.transparent && !m.depthWrite))) { o.visible = false; fxHidden.push(o); }
});
const showFx = () => { for (const o of fxHidden) o.visible = true; fxHidden.length = 0; };
{
  const ov = gtao.overrideVisibility.bind(gtao), rv = gtao.restoreVisibility.bind(gtao);
  gtao.overrideVisibility = () => { ov(); hideFx(); };
  gtao.restoreVisibility = () => { showFx(); rv(); };
  const br = bokeh.render.bind(bokeh);
  bokeh.render = (...args) => { hideFx(); br(...args); showFx(); };
}

// =====================================================================
//  GRAPHICS SETTINGS (the ⚙ button) — saved on this PC
//   quality  low / medium / high / ultra     time  cycle / day / dusk / night (the open world)
//   film     the camera look (contrast, colour, vignette)    blur  depth blur
// =====================================================================
const QUALITY = {
  low:    { pixel: 1,   shadow: 0,    bloom: false, particles: false, grass: false, reflections: false, ao: false, blur: false },
  medium: { pixel: 1,   shadow: 1024, bloom: true,  particles: true,  grass: true,  reflections: false, ao: false, blur: false },
  high:   { pixel: 1.5, shadow: 2048, bloom: true,  particles: true,  grass: true,  reflections: true,  ao: false, blur: false },
  ultra:  { pixel: 2,   shadow: 4096, bloom: true,  particles: true,  grass: true,  reflections: true,  ao: true,  blur: true },
};
const GFX_KEY = "lostAgesGraphics";
const gfx = (() => {
  const base = { quality: "high", time: "cycle", film: true, blur: null };
  try {
    const fromUrl = new URLSearchParams(location.search).get("gfx");   // (the raid runs on another port, so it's handed over in the address)
    const saved = JSON.parse(fromUrl || localStorage.getItem(GFX_KEY) || "{}");
    if (fromUrl) localStorage.setItem(GFX_KEY, fromUrl);
    return { ...base, ...saved };
  } catch { return base; }
})();
const saveGfx = () => { try { localStorage.setItem(GFX_KEY, JSON.stringify(gfx)); } catch { /* private window */ } };
const withGfx = (url) => url + (url.includes("?") ? "&" : "?") + "gfx=" + encodeURIComponent(JSON.stringify(gfx));
let worldReflections = false;
function applyGraphics() {
  const Q = QUALITY[gfx.quality] || QUALITY.high;
  const pr = Math.min(devicePixelRatio, Q.pixel);
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
  if (typeof effects !== "undefined") effects.pixelRatio = pr;
  const shadowsOn = Q.shadow > 0;
  if (renderer.shadowMap.enabled !== shadowsOn) {   // switching shadows needs every material rebuilt
    renderer.shadowMap.enabled = shadowsOn;
    scene.traverse(o => { const m = o.material; if (m) (Array.isArray(m) ? m : [m]).forEach(x => { x.needsUpdate = true; }); });
  }
  const size = Math.max(Q.shadow, realistic ? 4096 : 0) || 1024;
  if (sun.shadow.mapSize.x !== size) { sun.shadow.mapSize.set(size, size); sun.shadow.map?.dispose(); sun.shadow.map = null; }
  sun.shadow.radius = 3; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
  if (typeof setFancy === "function") setFancy(Q.bloom && Q.particles);
  gtao.enabled = realistic || Q.ao;
  gradePass.enabled = realistic || gfx.film;
  gradePass.uniforms.uTint.value.setRGB(...(THEME_TINT[theme] || THEME_TINT.stone));
  gradePass.uniforms.uGrain.value = realistic ? 0.03 : 0.015;
  gradePass.uniforms.uVignette.value = realistic ? 0.5 : 0.38;
  bokeh.enabled = gfx.blur ?? Q.blur;
  worldReflections = Q.reflections && !(realistic && realAssets.envMap);
  if (typeof worldScene !== "undefined" && worldScene) { worldScene.setGrass(Q.grass); worldScene.setReflections(worldMode && worldReflections); }
  updateGfxPanel?.();
}
let updateGfxPanel = null;
function buildGfxPanel() {
  const bar = document.getElementById("hud-controls");
  if (!bar || $("gfxBtn")) return;
  const btn = document.createElement("button");
  btn.id = "gfxBtn"; btn.className = "hbtn"; btn.textContent = "⚙"; btn.title = "Graphics settings";
  bar.appendChild(btn);
  const panel = document.createElement("div");
  panel.id = "gfxPanel";
  panel.style.cssText = "position:absolute;right:214px;top:254px;z-index:20;display:none;width:230px;padding:10px 12px;border:1px solid #7a5b22;border-radius:8px;background:linear-gradient(180deg,rgba(35,38,51,.97),rgba(12,14,20,.97));box-shadow:0 0 0 1px #000,0 10px 24px rgba(0,0,0,.6);font:13px 'Alegreya Sans',sans-serif;color:#ece6d6";
  const row = (label, html) => `<div style="margin:7px 0"><div style="color:#b8ac90;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px">${label}</div>${html}</div>`;
  const choice = (key, opts) => `<div style="display:flex;gap:3px;flex-wrap:wrap">${opts.map(([v, t]) => `<button class="hbtn" data-k="${key}" data-v="${v}" style="flex:1;padding:3px 4px;font-size:12px">${t}</button>`).join("")}</div>`;
  panel.innerHTML = `<div style="font-family:Cinzel,serif;font-weight:700;color:#f3dc9a;margin-bottom:4px">Graphics</div>`
    + row("Quality", choice("quality", [["low", "Low"], ["medium", "Medium"], ["high", "High"], ["ultra", "Ultra"]]))
    + row("Time of day (open world)", choice("time", [["cycle", "Cycle"], ["day", "Day"], ["dusk", "Dusk"], ["night", "Night"]]))
    + row("Camera", choice("film", [["true", "Film look"], ["false", "Plain"]]) + `<div style="height:4px"></div>` + choice("blur", [["auto", "Depth blur: auto"], ["true", "On"], ["false", "Off"]]))
    + `<div style="color:#8a8270;font-size:11px;margin-top:6px">Low/Medium for slower PCs. R = your own textures and sky (viewer/assets).</div>`;
  document.body.appendChild(panel);
  btn.onclick = () => { panel.style.display = panel.style.display === "none" ? "block" : "none"; };
  panel.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k, v = b.dataset.v;
    gfx[k] = k === "film" ? v === "true" : k === "blur" ? (v === "auto" ? null : v === "true") : v;
    saveGfx(); applyGraphics();
  });
  updateGfxPanel = () => panel.querySelectorAll("button[data-k]").forEach(b => {
    const k = b.dataset.k, cur = k === "blur" ? (gfx.blur == null ? "auto" : String(gfx.blur)) : String(gfx[k]);
    b.classList.toggle("on", cur === b.dataset.v);
  });
  updateGfxPanel();
}

// Files from viewer/assets/ — found automatically by their names (Poly Haven names work as-is):
//   any .hdr file          → sky + lighting
//   assets/floor/*         → floor textures (…diff… = colour, …nor… = normal, …rough… = roughness, …ao… = ambient occlusion)
//   assets/pillars/*       → pillar textures (same naming)
const realAssets = { hdr: null, envMap: null, sky: null, floor: {}, pillars: {}, ground: {}, rock: {}, dirt: {} };
function mapKind(file) {
  const f = file.toLowerCase();
  if (/nor(mal)?[_.-]?(gl)?|_nrm/.test(f) && !/nor_dx/.test(f)) return "normal";
  if (/nor_dx/.test(f)) return "normalDX";
  if (/rough/.test(f)) return "rough";
  if (/(^|[_.\-/])ao([_.-]|$)|ambient.?occlusion/.test(f)) return "ao";
  if (/diff|albedo|colou?r|basecolor|_col[_.]/.test(f)) return "color";
  return null;
}
async function loadRealisticAssets() {
  let files = [];
  try { files = await (await fetch("/api/assets")).json(); } catch { return; }
  const texLoader = new THREE.TextureLoader();
  const load = (file, isColor, repeat) => {
    const t = texLoader.load(file);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(...repeat);
    t.anisotropy = 8;
    if (isColor) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  for (const [folder, repeat] of [["floor", [40, 40]], ["pillars", [3, 5]], ["ground", [1, 1]], ["rock", [1, 1]], ["dirt", [1, 1]]]) {
    const set = {};
    for (const f of files.filter(f => f.startsWith(`assets/${folder}/`) && /\.(jpe?g|png|webp)$/i.test(f))) {
      const k = mapKind(f);
      if (k && !set[k]) set[k] = f;
    }
    if (!set.normal && set.normalDX) set.normal = set.normalDX;
    const out = realAssets[folder];
    if (set.color) out.map = load(set.color, true, repeat);
    if (set.normal) out.normalMap = load(set.normal, false, repeat);
    if (set.rough) out.roughnessMap = load(set.rough, false, repeat);
    if (set.ao) out.aoMap = load(set.ao, false, repeat);
  }
  const hdr = files.find(f => /\.hdr$/i.test(f));
  if (hdr) {
    try {
      const tex = await new RGBELoader().loadAsync(hdr);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      const pmrem = new THREE.PMREMGenerator(renderer);
      realAssets.envMap = pmrem.fromEquirectangular(tex).texture;
      realAssets.sky = tex;
      realAssets.hdr = hdr;
    } catch (err) { console.warn("Couldn't load", hdr, err); }
  }
  realAssets.found = files.filter(f => /\.(hdr|jpe?g|png|webp)$/i.test(f));
}

let baseHemi = 0.9;
function applyRealistic(on) {
  realistic = on;
  hud.el("real")?.classList.toggle("on", on);
  // HDR sky: lights the scene and shows (blurred, dimmed) behind the arena
  const env = on && realAssets.envMap;
  scene.environment = env ? realAssets.envMap : null;
  if (env) { scene.background = realAssets.sky; scene.backgroundBlurriness = 0.35; scene.backgroundIntensity = 0.3; }
  else if (scene.background?.isTexture) { scene.background = new THREE.Color(scene.fog.color); }
  baseHemi = env ? 0.35 : 0.9;   // the sky does most of the lighting now
  renderer.toneMappingExposure = env ? 0.85 : 1;
  sun.intensity = env ? 1.6 : 2.2;
  // Textures on the floor and pillars
  const swap = (material, set, fallbackMap) => {
    material.map = on && set.map ? set.map : fallbackMap;
    material.normalMap = on ? set.normalMap || null : null;
    material.roughnessMap = on ? set.roughnessMap || null : null;
    material.aoMap = on ? set.aoMap || null : null;
    material.roughness = on && set.roughnessMap ? 1 : 0.9;
    material.needsUpdate = true;
  };
  swap(floorMat, realAssets.floor, stoneTex);
  swap(pillarMat, realAssets.pillars, null);
  worldScene?.setRealistic(on ? realAssets : null);   // the open world: ground, rock and dirt textures
  applyGraphics();   // (ambient occlusion, the film look and sharper shadows come with it)
}

// Stone floor texture drawn in code (no image files needed)
function stoneTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;

// ---------------------------------------------------------------------
//  PROCEDURAL TEXTURES — drawn once on a hidden canvas, so no image files are needed.
//  They give the bosses scales, lava cracks, wing veins, engraved armour and torn cloth.
// ---------------------------------------------------------------------
const texCache = new Map();
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function canvasTex(key, size, draw, { color = false, repeat = [1, 1] } = {}) {
  const k = key + "@" + repeat.join("x");
  if (texCache.has(k)) return texCache.get(k);
  let base = texCache.get(key + "#canvas");
  if (!base) {
    base = document.createElement("canvas");
    base.width = base.height = size;
    draw(base.getContext("2d"), size);
    texCache.set(key + "#canvas", base);
  }
  const t = new THREE.CanvasTexture(base);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = 4;
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  texCache.set(k, t);
  return t;
}

// Overlapping reptile scales (grey: light centres, dark edges). Seamless.
const scalesTex = (rx = 1, ry = 1) => canvasTex("scales", 256, (g, S) => {
  g.fillStyle = "#5a5a5a"; g.fillRect(0, 0, S, S);
  const R = S / 8, dy = R * 0.8, rows = Math.round(S / dy);
  for (let row = -1; row <= rows + 1; row++) {
    const y = row * dy;
    for (let col = -1; col <= 4; col++) {
      const x = col * R * 2 + (((row % 2) + 2) % 2 ? R : 0);
      const r = rng(((row + rows) % rows) * 7 + ((col + 4) % 4) + 1)();
      const v = 165 + r * 60;
      const gr = g.createRadialGradient(x, y - R * 0.35, R * 0.1, x, y, R);
      gr.addColorStop(0, `rgb(${v},${v},${v})`);
      gr.addColorStop(0.7, `rgb(${v * 0.72},${v * 0.72},${v * 0.72})`);
      gr.addColorStop(1, "rgb(45,45,45)");
      g.fillStyle = gr;
      g.beginPath(); g.arc(x, y, R * 1.02, 0, Math.PI * 2); g.fill();
    }
  }
}, { repeat: [rx, ry] });

// Ridged belly plates (horizontal bands)
const bandsTex = (rx = 1, ry = 1) => canvasTex("bands", 128, (g, S) => {
  for (let y = 0; y < S; y++) {
    const k = (y % 16) / 16, v = 200 - Math.pow(k, 3) * 150;
    g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, y, S, 1);
  }
}, { repeat: [rx, ry] });

// Mottled skin / hide for ordinary monsters
const hideTex = (rx = 1, ry = 1) => canvasTex("hide", 256, (g, S) => {
  g.fillStyle = "#8a8a8a"; g.fillRect(0, 0, S, S);
  const r = rng(11);
  for (let i = 0; i < 900; i++) {
    const x = r() * S, y = r() * S, s = 2 + r() * 9, v = 100 + r() * 90;
    g.fillStyle = `rgba(${v},${v},${v},0.35)`;
    for (const [ox, oy] of [[0, 0], [S, 0], [-S, 0], [0, S], [0, -S]]) { g.beginPath(); g.arc(x + ox, y + oy, s, 0, Math.PI * 2); g.fill(); }
  }
}, { repeat: [rx, ry] });

// Molten rock: dark stone split by glowing cracks (Voronoi edges). Returns colour, glow and bump maps.
function lavaTex(rx = 1, ry = 1) {
  const pts = (() => { const r = rng(5), out = []; for (let i = 0; i < 26; i++) out.push([r() * 256, r() * 256]); return out; })();
  const edge = (() => {   // how close each pixel is to a crack (0 = on the crack)
    const S = 256, out = new Float32Array(S * S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      let d1 = 1e9, d2 = 1e9;
      for (const [px, py] of pts) {
        let dx = Math.abs(x - px), dy = Math.abs(y - py);
        dx = Math.min(dx, S - dx); dy = Math.min(dy, S - dy);
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
      }
      out[y * S + x] = d2 - d1;
    }
    return out;
  });
  let E = texCache.get("lava#edge");
  if (!E) { E = edge(); texCache.set("lava#edge", E); }
  const paint = (fn) => (g, S) => {
    const img = g.createImageData(S, S), noise = rng(9);
    for (let i = 0; i < S * S; i++) { const [r, gg, b] = fn(E[i], noise()); img.data.set([r, gg, b, 255], i * 4); }
    g.putImageData(img, 0, 0);
  };
  const crack = (e) => Math.max(0, 1 - e / 5);
  return {
    map: canvasTex("lava-c", 256, paint((e, n) => { const c = crack(e), s = 28 + n * 18 + Math.min(e, 30) * 0.8; return [s + c * 200, s * 0.75 + c * 90, s * 0.65]; }), { color: true, repeat: [rx, ry] }),
    glow: canvasTex("lava-e", 256, paint((e) => { const c = Math.pow(crack(e), 1.5); return [255 * c, 120 * c, 20 * c]; }), { color: true, repeat: [rx, ry] }),
    bump: canvasTex("lava-b", 256, paint((e, n) => { const v = Math.min(255, 40 + e * 9 + n * 20); return [v, v, v]; }), { repeat: [rx, ry] }),
  };
}

// Engraved, scratched armour (bump + roughness)
const engraveTex = (rx = 1, ry = 1) => canvasTex("engrave", 256, (g, S) => {
  g.fillStyle = "#808080"; g.fillRect(0, 0, S, S);
  const r = rng(3);
  g.lineCap = "round";
  for (let i = 0; i < 160; i++) {   // scratches
    const x = r() * S, y = r() * S, a = r() * Math.PI, l = 6 + r() * 30;
    g.strokeStyle = r() < 0.5 ? "rgba(40,40,40,0.5)" : "rgba(200,200,200,0.4)";
    g.lineWidth = 0.6 + r();
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.strokeStyle = "rgba(30,30,30,0.9)"; g.lineWidth = 2.5;   // filigree bands
  for (const y0 of [S * 0.2, S * 0.7]) {
    g.beginPath(); g.moveTo(0, y0);
    for (let x = 0; x <= S; x += 4) g.lineTo(x, y0 + Math.sin(x / S * Math.PI * 8) * 7);
    g.stroke();
    for (let x = 0; x < S; x += S / 8) { g.beginPath(); g.arc(x + S / 16, y0, 5, 0, Math.PI * 2); g.stroke(); }
  }
}, { repeat: [rx, ry] });

// Torn cloth: an alpha mask with a ragged bottom edge and moth holes
const tatteredTex = () => canvasTex("tattered", 128, (g, S) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, S, S);
  g.fillStyle = "#000";
  const r = rng(21);
  g.beginPath(); g.moveTo(0, S);
  for (let x = 0; x <= S; x += 6) g.lineTo(x, S - (6 + r() * 30));
  g.lineTo(S, S); g.fill();
  for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(r() * S, S * 0.35 + r() * S * 0.5, 2 + r() * 5, 3 + r() * 8, 0, 0, Math.PI * 2); g.fill(); }
});

// Bat-wing membrane: a dark-edged skin with veins fanning out from the wrist
function membraneTex(wristUV, tipUVs) {
  return canvasTex("membrane", 256, (g, S) => {
    const P = ([u, v]) => [u * S, (1 - v) * S];
    const gr = g.createLinearGradient(0, 0, S, S);
    gr.addColorStop(0, "#d8d8d8"); gr.addColorStop(1, "#9a9a9a");
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    const r = rng(4);
    const [wx, wy] = P(wristUV);
    g.lineCap = "round";
    const vein = (x0, y0, x1, y1, w, depth) => {
      g.strokeStyle = `rgba(60,40,40,${0.25 + depth * 0.15})`; g.lineWidth = w;
      const mx = (x0 + x1) / 2 + (r() - 0.5) * 25, my = (y0 + y1) / 2 + (r() - 0.5) * 25;
      g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(mx, my, x1, y1); g.stroke();
      if (depth > 0) for (let i = 0; i < 2; i++) {
        const t = 0.3 + r() * 0.5, bx = x0 + (x1 - x0) * t, by = y0 + (y1 - y0) * t;
        vein(bx, by, bx + (r() - 0.5) * 70, by + (r() - 0.3) * 70, w * 0.6, depth - 1);
      }
    };
    for (let i = 0; i < tipUVs.length; i++) {
      const a = P(tipUVs[i]), b = P(tipUVs[i + 1] || [0, 0.2]);
      vein(wx, wy, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 3, 2);
    }
  }, { color: true });
}

// A horn / tail / tendril: a tube that follows a curve and tapers to a point
function taperTube(points, radius, tipScale = 0.08, radial = 10, segs = 24) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, segs, radius, radial, false);
  const pos = geo.attributes.position, c = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, s = 1 - (1 - tipScale) * t;
    curve.getPointAt(t, c);
    for (let j = 0; j <= radial; j++) {
      const k = i * (radial + 1) + j;
      v.fromBufferAttribute(pos, k).sub(c).multiplyScalar(s).add(c);
      pos.setXYZ(k, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

// A tapered cylinder between two points (wing bones, claws)
function boneBetween(a, b, r1, r2, material) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const dir = B.clone().sub(A), len = dir.length();
  const m = mesh(new THREE.CylinderGeometry(r2, r1, len, 8), material);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

// A bat / dragon wing reaching out along +X in the XY plane (mirror with scale.x = -1).
// Arm bones along the top edge, four long fingers, and a veined membrane with scalloped edges.
function buildBatWing(span, membraneMat, boneMat, clawMat) {
  const s = span / 3, g = new THREE.Group();
  const V = (x, y) => new THREE.Vector2(x * s, y * s);
  const shoulder = V(0, 0.05), elbow = V(0.75, 0.55), wrist = V(1.35, 0.8);
  const tips = [V(3.0, 0.9), V(2.75, -0.15), V(2.05, -0.8), V(1.15, -1.0)];
  const rootPt = V(0.05, -0.55);
  const sh = new THREE.Shape();
  sh.moveTo(shoulder.x, shoulder.y);
  sh.lineTo(elbow.x, elbow.y); sh.lineTo(wrist.x, wrist.y); sh.lineTo(tips[0].x, tips[0].y);
  const scallop = (a, b, depth) => { const c = a.clone().add(b).multiplyScalar(0.5).lerp(wrist, depth); sh.quadraticCurveTo(c.x, c.y, b.x, b.y); };
  scallop(tips[0], tips[1], 0.32); scallop(tips[1], tips[2], 0.32); scallop(tips[2], tips[3], 0.32); scallop(tips[3], rootPt, 0.28);
  sh.lineTo(shoulder.x, shoulder.y);
  const geo = new THREE.ShapeGeometry(sh, 12);
  geo.computeBoundingBox();
  const bb = geo.boundingBox, pos = geo.attributes.position, uv = geo.attributes.uv;
  const U = (p) => [(p.x - bb.min.x) / (bb.max.x - bb.min.x), (p.y - bb.min.y) / (bb.max.y - bb.min.y)];
  for (let i = 0; i < pos.count; i++) {
    const [u, v] = U({ x: pos.getX(i), y: pos.getY(i) });
    uv.setXY(i, u, v);
    pos.setZ(i, -Math.sin(Math.PI * u) * Math.sin(Math.PI * Math.min(1, v * 1.2)) * 0.12 * s);   // the skin billows
  }
  geo.computeVertexNormals();
  const mem = membraneMat.clone();
  mem.map = membraneTex(U(wrist), tips.map(U));
  g.add(mesh(geo, mem));
  const P3 = (p, z = 0) => [p.x, p.y, z];
  g.add(boneBetween(P3(shoulder), P3(elbow), 0.07 * s, 0.055 * s, boneMat));
  g.add(boneBetween(P3(elbow), P3(wrist), 0.055 * s, 0.045 * s, boneMat));
  g.add(mesh(new THREE.SphereGeometry(0.07 * s, 10, 8), boneMat, wrist.x, wrist.y, 0));
  for (const tip of tips) g.add(boneBetween(P3(wrist), P3(tip), 0.04 * s, 0.012 * s, boneMat));
  const thumb = boneBetween(P3(wrist), [wrist.x + 0.12 * s, wrist.y + 0.2 * s, 0.05 * s], 0.035 * s, 0.004 * s, clawMat);
  g.add(thumb);
  return g;
}

// A feathered wing outline (points outward along +X, up along +Y). Mirror it with scale.x = -1.
function wingGeometry(len = 1.6, width = 0.7) {
  const sh = new THREE.Shape();
  sh.moveTo(0, 0);
  sh.quadraticCurveTo(len * 0.4, width * 1.15, len, width * 0.95);
  sh.lineTo(len * 0.93, width * 0.55); sh.lineTo(len * 0.82, width * 0.66);
  sh.lineTo(len * 0.74, width * 0.3); sh.lineTo(len * 0.6, width * 0.44);
  sh.lineTo(len * 0.52, width * 0.1); sh.lineTo(len * 0.37, width * 0.2);
  sh.quadraticCurveTo(len * 0.15, -width * 0.05, 0, 0);
  return new THREE.ShapeGeometry(sh);
}
const featherMat = () => mat(0xf6f8ff, { side: THREE.DoubleSide, emissive: 0x1a2233, emissiveIntensity: 0.6, roughness: 0.8, metalness: 0 });

// A pair of wings on a pivot. Returns { group, left, right } so they can flap.
function buildWings(len, width, material = featherMat) {
  const group = new THREE.Group();
  const make = (side) => {
    const pivot = new THREE.Group();
    const w = mesh(wingGeometry(len, width), material());
    w.scale.x = side;
    pivot.add(w);
    pivot.position.x = 0.12 * side;
    group.add(pivot);
    return pivot;
  };
  return { group, left: make(-1), right: make(1) };
}

// A dragon (faces +Z). Returns parts for animation: neck, head, jaw, tail segments, legs, wings.
// Smooth sculpted body with real scales, ridged belly plates, horns, teeth, clawed feet
// and veined bat wings.
function buildDragon(look) {
  const g = new THREE.Group();
  const parts = {};
  const trimC = look.trim ?? 0x7fd4ff;
  const scale = mat(look.body, {
    map: scalesTex(12, 8), bumpMap: scalesTex(12, 8), bumpScale: 2.5,
    roughness: 0.45, metalness: 0.3, envMap: metalEnv, envMapIntensity: 0.6,
    emissive: look.glow ?? 0x000000, emissiveIntensity: 0.35,
  });
  scale.color.multiplyScalar(1.5);   // the scale texture darkens, so start brighter
  const scaleSmall = scale.clone(); scaleSmall.map = scalesTex(5, 5); scaleSmall.bumpMap = scalesTex(5, 5);
  const belly = mat(look.belly ?? look.body, { map: bandsTex(1, 6), bumpMap: bandsTex(1, 6), bumpScale: 3, roughness: 0.6, metalness: 0.1 });
  belly.color.multiplyScalar(1.3);
  const horn = mat(0x2a2620, { roughness: 0.35, metalness: 0.2, envMap: metalEnv, envMapIntensity: 0.5 });
  const tooth = mat(0xe8e2d0, { roughness: 0.3, metalness: 0 });
  const glowLine = glowMat(trimC);
  const spike = (r, h, x, y, z, rx = -0.5) => { const m = mesh(new THREE.ConeGeometry(r, h, 6), horn, x, y, z); m.rotation.x = rx; return m; };

  // ---- Body: a lathe-turned barrel (deep chest, tapering to the tail) ----
  const prof = [[0.001, -1.25], [0.3, -1.2], [0.45, -0.8], [0.58, -0.3], [0.66, 0.2], [0.68, 0.55], [0.6, 0.95], [0.42, 1.2], [0.28, 1.32], [0.001, 1.36]];
  const bodyGeo = new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r, y)), 32);
  bodyGeo.rotateX(Math.PI / 2);
  bodyGeo.scale(0.9, 1.05, 1);
  g.add(mesh(bodyGeo, scale, 0, 1.38, -0.05));
  const bellyGeo = bodyGeo.clone(); bellyGeo.scale(0.82, 0.86, 0.94);
  g.add(mesh(bellyGeo, belly, 0, 1.24, -0.02));
  // Back ridge: a row of curved spikes with glowing storm cracks between them
  for (let i = 0; i < 9; i++) {
    const z = 1.05 - i * 0.27, h = 0.42 - Math.abs(i - 3) * 0.04;
    g.add(spike(0.07, h, 0, 1.38 + 0.66 - Math.abs(z) * 0.12, z, -0.55));
    if (i % 2 === 0) for (const side of [-1, 1]) {
      const crack = mesh(new THREE.BoxGeometry(0.03, 0.02, 0.3), glowLine, side * 0.5, 1.6, z - 0.1);
      crack.rotation.set(0, side * 0.45, side * 0.6);
      g.add(crack);
    }
  }

  // ---- Neck: one smooth tapering tube with throat plates and spines ----
  const neck = new THREE.Group();
  neck.position.set(0, 1.6, 1.05);
  neck.rotation.x = -0.75;
  g.add(neck);
  const neckPts = [[0, -0.1, 0], [0, 0.4, 0.06], [0, 0.9, 0.04], [0, 1.35, -0.04], [0, 1.6, 0]];
  neck.add(mesh(taperTube(neckPts, 0.38, 0.6, 16, 20), scaleSmall));
  neck.add(mesh(taperTube(neckPts.map(([x, y, z]) => [x, y, z - 0.08]), 0.3, 0.6, 12, 20), belly));
  for (let i = 0; i < 5; i++) neck.add(spike(0.045, 0.24, 0, 0.1 + i * 0.32, 0.3 - i * 0.025, 0.9));

  // ---- Head ----
  const head = new THREE.Group();
  head.position.set(0, 1.55, 0);
  head.rotation.x = 0.95;
  neck.add(head);
  const skull = mesh(new THREE.SphereGeometry(0.3, 24, 18), scaleSmall, 0, 0.02, 0.12);
  skull.scale.set(0.88, 0.72, 1.15);
  head.add(skull);
  const snoutGeo = new THREE.CylinderGeometry(0.12, 0.22, 0.62, 16);
  snoutGeo.rotateX(Math.PI / 2); snoutGeo.scale(1, 0.62, 1);
  head.add(mesh(snoutGeo, scaleSmall, 0, 0.0, 0.58));
  const noseTip = mesh(new THREE.SphereGeometry(0.12, 14, 10), scaleSmall, 0, 0.0, 0.88);
  noseTip.scale.set(1, 0.62, 0.7);
  head.add(noseTip);
  for (const side of [-1, 1]) {
    head.add(mesh(new THREE.SphereGeometry(0.022, 8, 6), mat(0x050505), 0.055 * side, 0.05, 0.94));   // nostril
    // Heavy brow ridge over each eye
    const brow = mesh(new THREE.SphereGeometry(0.09, 12, 8), scaleSmall, 0.15 * side, 0.15, 0.36);
    brow.scale.set(0.9, 0.45, 1.7); brow.rotation.y = -0.25 * side;
    head.add(brow);
    // Glowing eye with a slit pupil
    const eye = mesh(new THREE.SphereGeometry(0.05, 14, 10), glowMat(look.eyes ?? 0x9ff0ff), 0.17 * side, 0.09, 0.4);
    eye.scale.set(0.6, 0.8, 1);
    head.add(eye);
    head.add(mesh(new THREE.BoxGeometry(0.008, 0.06, 0.012), mat(0x000000), 0.198 * side, 0.09, 0.42));
    // Swept-back horns plus a smaller pair, and cheek spikes
    head.add(mesh(taperTube([[0.14 * side, 0.15, 0.1], [0.2 * side, 0.26, -0.15], [0.24 * side, 0.32, -0.45], [0.22 * side, 0.46, -0.72]], 0.075, 0.05), horn));
    head.add(mesh(taperTube([[0.2 * side, 0.05, 0.05], [0.3 * side, 0.08, -0.15], [0.36 * side, 0.15, -0.36]], 0.04, 0.05), horn));
    for (let k = 0; k < 3; k++) {
      const c = spike(0.025, 0.16, (0.22 + k * 0.02) * side, -0.05 - k * 0.05, -0.02 - k * 0.07, -1.9);
      c.rotation.z = 0.4 * side;
      head.add(c);
    }
    // Upper teeth along the snout
    for (let k = 0; k < 6; k++) {
      const t = mesh(new THREE.ConeGeometry(0.018, 0.08 + (k === 1 ? 0.05 : 0), 5), tooth, 0.115 * side - k * 0.006 * side, -0.08, 0.86 - k * 0.075);
      t.rotation.x = Math.PI;
      head.add(t);
    }
  }
  for (let k = 0; k < 4; k++) head.add(spike(0.035, 0.18, 0, 0.22 - k * 0.01, 0.1 - k * 0.14, -1.1));   // crest

  // Lower jaw with teeth
  const jaw = new THREE.Group();
  jaw.position.set(0, -0.12, 0.2);
  const jawGeo = new THREE.CylinderGeometry(0.09, 0.18, 0.75, 14);
  jawGeo.rotateX(Math.PI / 2); jawGeo.scale(1, 0.45, 1);
  jaw.add(mesh(jawGeo, belly, 0, -0.03, 0.36));
  for (const side of [-1, 1]) for (let k = 0; k < 5; k++)
    jaw.add(mesh(new THREE.ConeGeometry(0.016, 0.07, 5), tooth, (0.085 - k * 0.006) * side, 0.04, 0.68 - k * 0.08));
  jaw.add(mesh(new THREE.BoxGeometry(0.12, 0.02, 0.5), mat(0x5a1a22, { roughness: 0.4 }), 0, 0.005, 0.38));   // tongue
  head.add(jaw);
  const mouthGlow = mesh(new THREE.SphereGeometry(0.16, 10, 8), new THREE.MeshBasicMaterial({ color: trimC, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }), 0, -0.08, 0.7);
  head.add(mouthGlow);

  // ---- Tail: a chain of tapering segments that sways, ending in a glowing blade ----
  const tail = [];
  let parent = g;
  for (let i = 0; i < 7; i++) {
    const seg = new THREE.Group();
    seg.position.set(0, i === 0 ? 1.38 : 0, i === 0 ? -1.2 : -0.48);
    const r = 0.3 - i * 0.038, r2 = Math.max(0.03, r - 0.038);
    const geo = new THREE.CylinderGeometry(r2, r, 0.5, 14);
    geo.rotateX(-Math.PI / 2);
    seg.add(mesh(geo, scaleSmall, 0, 0, -0.24));
    seg.add(mesh(new THREE.SphereGeometry(r, 14, 10), scaleSmall));   // smooth joint
    seg.add(spike(0.03, 0.18 - i * 0.015, 0, r * 0.9, -0.2, -0.7));
    if (i === 6) {
      const blade = mesh(new THREE.ConeGeometry(0.2, 0.55, 4), glowLine, 0, 0, -0.75);
      blade.rotation.x = -Math.PI / 2; blade.scale.set(1, 1, 0.25);
      seg.add(blade);
    }
    parent.add(seg);
    tail.push(seg);
    parent = seg;
  }

  // ---- Legs: heavy thigh → shin → clawed foot ----
  const legs = [];
  for (const [x, zz, front] of [[-0.45, 0.78, 1], [0.45, 0.78, 1], [-0.48, -0.62, 0], [0.48, -0.62, 0]]) {
    const leg = new THREE.Group();
    leg.position.set(x, 1.1, zz);
    const r = front ? 0.2 : 0.27;
    leg.add(mesh(new THREE.SphereGeometry(r * 1.25, 16, 12), scaleSmall, 0, 0.02, 0));
    const knee = front ? [0, -0.5, -0.1] : [0, -0.45, 0.18];
    leg.add(boneBetween([0, 0, 0], knee, r, r * 0.75, scaleSmall));
    leg.add(mesh(new THREE.SphereGeometry(r * 0.75, 12, 10), scaleSmall, ...knee));
    const ankle = [0, -1.0, front ? 0.02 : -0.02];
    leg.add(boneBetween(knee, ankle, r * 0.7, r * 0.5, scaleSmall));
    const foot = mesh(new THREE.SphereGeometry(r * 0.75, 12, 8), scaleSmall, 0, -1.04, 0.1);
    foot.scale.set(1.1, 0.45, 1.4);
    leg.add(foot);
    for (let c = -1; c <= 1; c++) {   // three curved claws
      const claw = mesh(taperTube([[c * 0.08, -1.04, 0.2], [c * 0.11, -1.04, 0.3], [c * 0.12, -1.09, 0.36]], 0.035, 0.05, 6, 8), horn);
      leg.add(claw);
    }
    g.add(leg);
    legs.push(leg);
  }

  // ---- Wings: veined membrane stretched over long finger bones ----
  const wings = { group: new THREE.Group(), left: null, right: null };
  const membrane = mat(look.belly ?? look.body, { side: THREE.DoubleSide, emissive: look.glow ?? 0x000000, emissiveIntensity: 1.2, roughness: 0.7, metalness: 0 });
  membrane.color.multiplyScalar(1.2);
  for (const side of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(0.35 * side, 1.8, 0.45);
    const w = buildBatWing(3.2, membrane, horn, horn);
    w.scale.x = side;
    pivot.add(w);
    wings.group.add(pivot);
    if (side < 0) wings.left = pivot; else wings.right = pivot;
  }
  g.add(wings.group);

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  Object.assign(parts, { neck, head, jaw, tail, legs, wings, mouthGlow });
  return { body: g, parts, mats: [scale, scaleSmall, belly] };
}

// The Valkyrie's Pegasus (faces +Z like the rider)
function buildPegasus() {
  const g = new THREE.Group();
  const white = mat(0xf2f4fa, { roughness: 0.7, metalness: 0 });
  const hoof = mat(0x8a7a5a), gold = mat(0xd4af37, { metalness: 0.8, roughness: 0.3 }), mane = mat(0xcfe0ff, { emissive: 0x334466, emissiveIntensity: 0.5 });
  const body = mesh(new THREE.CapsuleGeometry(0.42, 1.25, 4, 10), white, 0, 1.25, 0);
  body.rotation.x = Math.PI / 2;
  g.add(body);
  const neck = mesh(new THREE.CylinderGeometry(0.17, 0.26, 0.85, 8), white, 0, 1.68, 0.78);
  neck.rotation.x = 0.65;
  g.add(neck);
  g.add(mesh(new THREE.BoxGeometry(0.26, 0.3, 0.6), white, 0, 2.02, 1.15));
  for (const side of [-1, 1]) g.add(mesh(new THREE.ConeGeometry(0.05, 0.16, 4), white, 0.08 * side, 2.22, 1.0));
  const maneMesh = mesh(new THREE.BoxGeometry(0.06, 0.18, 0.8), mane, 0, 1.85, 0.68);
  maneMesh.rotation.x = 0.65;
  g.add(maneMesh);
  g.add(mesh(new THREE.BoxGeometry(0.5, 0.08, 0.55), gold, 0, 1.66, -0.05));   // saddle
  const tail = mesh(new THREE.ConeGeometry(0.12, 0.8, 6), mane, 0, 1.15, -0.95);
  tail.rotation.x = -2.3;
  g.add(tail);
  const legs = [];
  for (const [x, z] of [[-0.22, 0.5], [0.22, 0.5], [-0.22, -0.5], [0.22, -0.5]]) {
    const leg = new THREE.Group();
    leg.position.set(x, 1.0, z);
    leg.add(mesh(new THREE.BoxGeometry(0.13, 0.85, 0.13), white, 0, -0.42, 0));
    leg.add(mesh(new THREE.BoxGeometry(0.15, 0.1, 0.17), hoof, 0, -0.86, 0.01));
    g.add(leg);
    legs.push(leg);
  }
  const wings = buildWings(2.4, 1.0);
  wings.group.position.set(0, 1.55, 0.2);
  g.add(wings.group);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { group: g, legs, wings };
}

// =====================================================================
//  WEAPONS — forged steel, wood grain and leather-wrapped grips
//  Blades are lofted with a real cross-section (sharpened bevels, a raised
//  centre or a fuller groove down the middle), so the light catches the edges
//  the way it does on real steel. Guards, pommels, sockets and rivets are
//  separate pieces. Everything is built pointing UP (+Y) from the hand; the
//  hand is rotated so they point forward. Shapes are shared between everyone
//  holding the same weapon, so a full raid costs almost nothing extra.
// =====================================================================

// Brushed steel: fine lengthwise polishing streaks (used as a roughness map)
const brushedTex = (rx = 1, ry = 1) => canvasTex("brushed", 128, (g, S) => {
  g.fillStyle = "#6a6a6a"; g.fillRect(0, 0, S, S);
  const r = rng(21);
  for (let i = 0; i < 520; i++) {
    const x = r() * S, v = 70 + r() * 90, l = 10 + r() * S;
    g.fillStyle = `rgba(${v},${v},${v},0.5)`;
    g.fillRect(x, r() * S, 0.6 + r() * 0.8, l);
  }
  for (let i = 0; i < 40; i++) {   // a few nicks and scratches
    const x = r() * S, y = r() * S, a = (r() - 0.5) * 1.2;
    g.strokeStyle = "rgba(200,200,200,0.55)"; g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.sin(a) * 9, y + Math.cos(a) * 9); g.stroke();
  }
}, { repeat: [rx, ry] });

// Wood grain running along the haft
const woodTex = (rx = 1, ry = 1) => canvasTex("woodgrain", 128, (g, S) => {
  g.fillStyle = "#8a6a4a"; g.fillRect(0, 0, S, S);
  const r = rng(33);
  for (let i = 0; i < 70; i++) {
    let x = r() * S; const w = 0.5 + r() * 2.2, v = 70 + r() * 70;
    g.strokeStyle = `rgba(${v * 0.85},${v * 0.6},${v * 0.4},0.55)`; g.lineWidth = w;
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y <= S; y += 8) { x += (r() - 0.5) * 1.6; g.lineTo(x, y); }
    g.stroke();
  }
  for (let i = 0; i < 3; i++) {   // knots
    const x = r() * S, y = r() * S;
    for (let k = 4; k > 0; k--) { g.strokeStyle = `rgba(60,38,22,${0.18 * k})`; g.lineWidth = 1; g.beginPath(); g.ellipse(x, y, k * 1.6, k * 4, 0, 0, Math.PI * 2); g.stroke(); }
  }
}, { color: true, repeat: [rx, ry] });

// Leather strip wound round a grip (diagonal bands with dark gaps between the turns)
const wrapTex = (rx = 1, ry = 1) => canvasTex("wrap", 64, (g, S) => {
  g.fillStyle = "#9a9a9a"; g.fillRect(0, 0, S, S);
  for (let k = -2; k < 4; k++) {
    const y0 = k * S / 2;
    const gr = g.createLinearGradient(0, y0, 0, y0 + S / 2);
    gr.addColorStop(0, "#3a3a3a"); gr.addColorStop(0.12, "#c8c8c8"); gr.addColorStop(0.75, "#9a9a9a"); gr.addColorStop(1, "#2a2a2a");
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(0, y0); g.lineTo(S, y0 + S / 4); g.lineTo(S, y0 + S / 4 + S / 2); g.lineTo(0, y0 + S / 2); g.closePath(); g.fill();
  }
}, { repeat: [rx, ry] });

// Rust and grime for old, neglected weapons (skeletons)
const rustTex = (rx = 1, ry = 1) => canvasTex("rust", 128, (g, S) => {
  g.fillStyle = "#8a8a8a"; g.fillRect(0, 0, S, S);
  const r = rng(44);
  for (let i = 0; i < 260; i++) {
    const x = r() * S, y = r() * S, s = 1 + r() * 7, v = 60 + r() * 140;
    g.fillStyle = `rgba(${v * 1.1},${v * 0.72},${v * 0.48},0.45)`;
    g.beginPath(); g.arc(x, y, s, 0, Math.PI * 2); g.fill();
  }
}, { color: true, repeat: [rx, ry] });

// Materials, shared by key
const wMats = new Map();
function wMat(key, make) { if (!wMats.has(key)) wMats.set(key, make()); return wMats.get(key); }
function weaponMats(look) {
  const worn = !!look.worn;
  const trimHex = look.trim ?? 0xaaaaaa;
  return {
    steel: worn
      ? wMat("rust", () => mat(0x8a6a54, { metalness: 0.55, roughness: 0.78, map: rustTex(1, 3), bumpMap: rustTex(1, 3), bumpScale: 2, envMap: metalEnv, envMapIntensity: 0.5 }))
      : wMat("steel", () => mat(0xe2e6ee, { metalness: 1, roughness: 0.62, roughnessMap: brushedTex(1, 4), envMap: metalEnv, envMapIntensity: 1.05 })),
    edge: worn
      ? wMat("rustEdge", () => mat(0xa09080, { metalness: 0.7, roughness: 0.55, envMap: metalEnv, envMapIntensity: 0.6 }))
      : wMat("edge", () => mat(0xf4f6fa, { metalness: 1, roughness: 0.22, envMap: metalEnv, envMapIntensity: 1.2 })),   // freshly honed edge
    dark: wMat("darkSteel" + (worn ? "w" : ""), () => mat(worn ? 0x4a3a30 : 0x50535a, { metalness: 0.9, roughness: worn ? 0.75 : 0.7, roughnessMap: brushedTex(1, 3), envMap: metalEnv, envMapIntensity: 0.85 })),
    trim: wMat("trim" + trimHex + (worn ? "w" : ""), () => mat(worn ? 0x5a4a3a : trimHex, { metalness: 0.9, roughness: worn ? 0.7 : 0.28, envMap: metalEnv, envMapIntensity: 1 })),
    wood: wMat("wood" + (worn ? "w" : ""), () => mat(worn ? 0x8a7a68 : 0xc8a888, { metalness: 0, roughness: 0.72, map: woodTex(1, 3), bumpMap: woodTex(1, 3), bumpScale: 1.2 })),
    leather: wMat("wrapLeather", () => mat(0x8a5a3a, { metalness: 0.05, roughness: 0.7, map: wrapTex(1, 5), bumpMap: wrapTex(1, 5), bumpScale: 3 })),
  };
}

// Shapes, shared by key
const wGeos = new Map();
function wGeo(key, make) { if (!wGeos.has(key)) wGeos.set(key, make()); return wGeos.get(key); }

/**
 * A blade lofted along +Y with a real cross-section.
 *   len       length from the guard to the point
 *   width(t)  half-width at t (0 = base, 1 = point)
 *   thick     half-thickness at the spine
 *   fuller    [from, to] — a groove down the middle over that stretch (or null for a raised midrib)
 *   single    one sharpened edge (+X); the other is a flat spine (scythes, knives)
 * Each face strip has its own vertices so the bevels stay crisp instead of being smoothed over.
 */
function bladeGeometry({ len, width, thick, fuller = null, single = false, rows = 28 }) {
  // cross-section across the blade (x = across, z = thickness), as fractions of width/thickness
  const ring = single
    ? [[1, 0], [0.45, 1], [-0.85, 1], [-1, 0.75], [-1, -0.75], [-0.85, -1], [0.45, -1]]
    : [[1, 0], [0.5, 1], [0.2, 1], [0, 1], [-0.2, 1], [-0.5, 1], [-1, 0], [-0.5, -1], [-0.2, -1], [0, -1], [0.2, -1], [0.5, -1]];
  const pos = [], uv = [], idx = [];
  let maxW = 0; for (let i = 0; i <= 40; i++) maxW = Math.max(maxW, width(i / 40));
  const point = (j, t) => {
    const [fx, fz] = ring[j % ring.length];
    const hw = width(t);
    const th = thick * Math.max(0.12, Math.pow(hw / maxW, 0.8)) * (1 - t * 0.35);
    let z = fz * th;
    if (fuller && !single && Math.abs(fx) < 0.05 && t > fuller[0] && t < fuller[1]) {
      const k = Math.sin(Math.PI * (t - fuller[0]) / (fuller[1] - fuller[0]));
      z *= 1 - 0.55 * Math.min(1, k * 3);   // the groove dips into the blade
    } else if (!fuller && !single && Math.abs(fx) < 0.05) z *= 1.25;   // raised midrib
    return [fx * hw, t * len, z];
  };
  for (let j = 0; j < ring.length; j++) {           // one strip per facet
    const base = pos.length / 3;
    for (let i = 0; i <= rows; i++) {
      const t = i / rows;
      for (const jj of [j, j + 1]) { pos.push(...point(jj, t)); uv.push(jj === j ? 0 : 1, t); }
      if (i < rows) { const a = base + i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  // facets that face the wrong way (winding) get flipped by making the material double sided
  return g;
}

// A shape spun on a lathe (pommels, grips, sockets, ferrules): [[radius, y], ...]
function latheGeo(key, pts, seg = 16) {
  return wGeo(key, () => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg));
}

// A curved bar tapering at both ends (crossguards): from -span to +span along X, tips swept toward +Y
function guardGeo(key, span, r, sweep = 0.03, drop = 0) {
  return wGeo(key, () => {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-span, sweep + drop, 0), new THREE.Vector3(-span * 0.5, drop * 0.3, 0),
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(span * 0.5, drop * 0.3, 0), new THREE.Vector3(span, sweep + drop, 0)]);
    const segs = 24, radial = 8, geo = new THREE.TubeGeometry(curve, segs, r, radial, false);
    const p = geo.attributes.position, c = new THREE.Vector3(), v = new THREE.Vector3();
    for (let i = 0; i <= segs; i++) {
      const t = i / segs, s = 0.55 + 0.45 * Math.sin(Math.PI * t);   // thick in the middle, finer at the tips
      curve.getPointAt(t, c);
      for (let j = 0; j <= radial; j++) { const k = i * (radial + 1) + j; v.fromBufferAttribute(p, k).sub(c); v.z *= 1.5; v.multiplyScalar(s).add(c); p.setXYZ(k, v.x, v.y, v.z); }
    }
    geo.computeVertexNormals();
    return geo;
  });
}

function addRivets(g, m, list, r = 0.008) {
  const geo = wGeo("rivet" + r, () => new THREE.SphereGeometry(r, 8, 6));
  for (const [x, y, z] of list) g.add(mesh(geo, m, x, y, z));
}

// A leather-wrapped grip from y0 to y1 with a slight swell in the middle
function gripMesh(m, r, y0, y1) {
  const L = y1 - y0;
  const geo = latheGeo(`grip${r}_${L}`, [[r * 0.9, 0], [r * 1.05, L * 0.3], [r * 1.08, L * 0.5], [r * 1.0, L * 0.75], [r * 0.92, L]], 14);
  const g = mesh(geo, m.leather, 0, y0, 0);
  return g;
}

function buildSword(m, look, big) {
  const g = new THREE.Group();
  const L = big ? 1.22 : 0.82, W = big ? 0.05 : 0.036;
  const blade = wGeo(`blade-sw${big}`, () => bladeGeometry({
    len: L, thick: big ? 0.008 : 0.0065, fuller: [0.04, big ? 0.62 : 0.7],
    width: (t) => t < 0.82 ? W * (1 - t * 0.28) : W * 0.77 * Math.sqrt(Math.max(0, 1 - (t - 0.82) / 0.18)),
  }));
  g.add(mesh(blade, m.steel, 0, 0.05));
  if (big) {   // ricasso: an unsharpened, squared section above the guard
    g.add(mesh(wGeo("ricasso", () => new THREE.BoxGeometry(W * 1.6, 0.12, 0.016)), m.steel, 0, 0.1));
    for (const s of [-1, 1]) g.add(mesh(wGeo("parry", () => new THREE.ConeGeometry(0.014, 0.06, 6)), m.trim, s * W * 1.2, 0.15));
  }
  if (look.engraved) {   // the Hollow King's blade: runes glowing in the fuller
    const runes = mesh(wGeo(`runes${big}`, () => new THREE.BoxGeometry(0.008, L * 0.5, 0.011)), glowMat(look.trim ?? 0x8a6aff), 0, 0.05 + L * 0.34);
    g.add(runes);
  }
  // crossguard with rounded finials
  const span = big ? 0.2 : 0.12;
  g.add(mesh(guardGeo(`guard${big}`, span, big ? 0.016 : 0.012, big ? 0.05 : 0.025), m.trim, 0, 0.035));
  const fin = wGeo("finial" + big, () => new THREE.SphereGeometry(big ? 0.02 : 0.015, 10, 8));
  for (const s of [-1, 1]) g.add(mesh(fin, m.trim, s * span, 0.035 + (big ? 0.05 : 0.025)));
  g.add(mesh(wGeo("guardBlock" + big, () => new THREE.BoxGeometry(big ? 0.06 : 0.045, 0.045, big ? 0.032 : 0.026)), m.trim, 0, 0.04));
  // grip and pommel
  const gripLen = big ? 0.3 : 0.17;
  g.add(gripMesh(m, big ? 0.019 : 0.016, 0.02 - gripLen, 0.02));
  g.add(mesh(latheGeo("pommel" + big, [[0, -0.04], [0.02, -0.035], [0.03, -0.012], [0.03, 0.008], [0.016, 0.022], [0.012, 0.03], [0, 0.03]].map(([r, y]) => [r * (big ? 1.25 : 1), y * (big ? 1.25 : 1)]), 14), m.trim, 0, 0.0 - gripLen - 0.01));
  g.rotation.x = Math.PI / 2;
  return g;
}

function buildDagger(m, look) {
  const g = new THREE.Group();

  }));
