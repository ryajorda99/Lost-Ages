<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Ages — 3D Fight Viewer</title>
<!--
  3d.html — watch Lost Ages fights in 3D (live or saved replays).

  Opened automatically by:   node scripts/simulate.js --boss ashenTyrant
  Or for saved replays:       node scripts/viewer.js
  (The old top-down view is still there: add --2d, or open /2d)

  The game interface on top (boss frame, raid frames, action bar, minimap, chat) is in hud.js.
  Spell visuals are in effects.js. Press G to turn glow + particles off on slower PCs.

  REALISTIC MODE (press R or the 🎥 button): ambient occlusion, camera colour grading, sharper shadows,
  and real textures / HDR sky lighting if you put them in viewer/assets/ (see viewer/assets/README.txt).

  CHARACTERS: until you add real 3D models, everyone is drawn as a simple low-poly
  figure built in code (armour, weapons and colours per class).
  To use real models, put .glb files in viewer/models/ — press M in the viewer to see
  which file names it looks for (e.g. models/knight.glb, models/the-hollow-king.glb).
  Animation clips are matched by name: Idle, Run/Walk, Attack/Slash, Cast/Spell, Death/Die.

  Uses Three.js (loaded from the internet, so you need a connection the first time).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* The game interface (boss frame, raid frames, action bar, minimap...) lives in hud.js */
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0d0f16; color:#ece6d6; font:13px/1.35 "Alegreya Sans", "Segoe UI", sans-serif; }
  canvas { display:block; }

  /* Name plates above everyone's head */
  #plates { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .plate { position:absolute; transform:translate(-50%,-100%); text-align:center; white-space:nowrap; }
  .plate .pn { font-size:11px; font-weight:700; text-shadow:0 1px 2px #000, 0 0 3px #000; }
  .plate .ph { width:46px; height:5px; margin:1px auto 0; background:rgba(0,0,0,.7); border:1px solid #000; border-radius:2px; overflow:hidden; }
  .plate .ph div { height:100%; background:linear-gradient(#6fe06a,#2a8a26); }
  .plate.enemy .pn { font-family:Cinzel, serif; }
  .plate.enemy .ph { width:74px; height:6px; } .plate.enemy .ph div { background:linear-gradient(#ff5a4a,#8c1612); }
  .plate.boss, .plate.pet { display:none; }
  .plate.dead { opacity:.35; } .plate.dead .ph { display:none; }
  body.nonames .plate:not(.enemy) .pn { display:none; }

  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9a93a8; font:16px Cinzel, serif; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading 3D viewer…</div>
<div id="plates"></div>



<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone as cloneSkinned } from "three/addons/utils/SkeletonUtils.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectSystem, effectFor, castColor } from "./effects.js";
import { createHUD } from "./hud.js";

const $ = (id) => document.getElementById(id);
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = (k) => Math.max(0, Math.min(1, k));

// =====================================================================
//  SCENE
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
$("loading").remove();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f16);
scene.fog = new THREE.Fog(0x0d0f16, 70, 160);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(-26, 24, 30);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.45;
controls.minDistance = 5;
controls.maxDistance = 140;

const hemi = new THREE.HemisphereLight(0x8899cc, 0x221a14, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe8cc, 2.2);
sun.position.set(30, 55, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 160 });
scene.add(sun, sun.target);
const bossLight = new THREE.PointLight(0xff5522, 0, 40, 1.5);   // glow around fiery bosses
scene.add(bossLight);
// Cool light from behind: outlines characters against the dark floor
const rim = new THREE.DirectionalLight(0x6a7cff, 0.9);
rim.position.set(-40, 25, -50);
scene.add(rim);

// ---------- Glow (bloom): spells, torches, eyes and fire shine ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.35, 0.93);   // strength, spread, how bright before it glows
composer.addPass(bloom);
composer.addPass(new OutputPass());
let fancy = true;   // G toggles glow + particles

// ---------- Particles: embers rising from fire, sparks from spell hits, floating motes ----------
function dotTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, "rgba(255,255,255,1)"); grd.addColorStop(0.35, "rgba(255,255,255,.55)"); grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
class Particles {
  constructor(max = 2500) {
    this.max = max; this.next = 0;
    this.pos = new Float32Array(max * 3).fill(-9999);
    this.col = new Float32Array(max * 3);
    this.vel = new Float32Array(max * 3);
    this.base = new Float32Array(max * 3);
    this.life = new Float32Array(max);
    this.maxLife = new Float32Array(max);
    this.drag = new Float32Array(max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(this.col, 3));
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 0.32, map: dotTexture(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    this.points.frustumCulled = false;
    scene.add(this.points);
    this.tmp = new THREE.Color();
  }
  // Spawn one particle at (x,y,z) moving (vx,vy,vz), glowing `color`, living `life` seconds
  one(x, y, z, vx, vy, vz, color, life, drag = 0.6) {
    const i = this.next; this.next = (this.next + 1) % this.max;
    this.pos.set([x, y, z], i * 3); this.vel.set([vx, vy, vz], i * 3);
    this.tmp.setHex(color); this.base.set([this.tmp.r, this.tmp.g, this.tmp.b], i * 3);
    this.life[i] = this.maxLife[i] = life; this.drag[i] = drag;
  }
  // A burst of sparks flying out from a point
  burst(p, color, count, speed = 3) {
    for (let n = 0; n < count; n++) {
      const a = Math.random() * Math.PI * 2, up = Math.random();
      this.one(p.x, p.y, p.z, Math.cos(a) * speed * (0.3 + Math.random()), up * speed * 1.2, Math.sin(a) * speed * (0.3 + Math.random()), color, 0.4 + Math.random() * 0.5, 2.5);
    }
  }
  update(dt) {
    for (let i = 0; i < this.max; i++) {
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      const k = i * 3, d = Math.max(0, 1 - this.drag[i] * dt);
      this.vel[k] *= d; this.vel[k + 2] *= d;
      this.pos[k] += this.vel[k] * dt; this.pos[k + 1] += this.vel[k + 1] * dt; this.pos[k + 2] += this.vel[k + 2] * dt;
      const f = this.life[i] > 0 ? Math.min(1, this.life[i] / this.maxLife[i] * 1.5) : 0;
      this.col[k] = this.base[k] * f; this.col[k + 1] = this.base[k + 1] * f; this.col[k + 2] = this.base[k + 2] * f;
      if (this.life[i] <= 0) this.pos[k + 1] = -9999;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.geometry.attributes.color.needsUpdate = true;
  }
  clear() { this.life.fill(0); this.pos.fill(-9999); this.col.fill(0); }
}
const particles = new Particles();

// =====================================================================
//  REALISTIC MODE (R)
// =====================================================================
let realistic = false;
// Ambient occlusion: soft dark contact shadows where things meet (feet on the floor, pillars...)
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.enabled = false;
composer.insertPass(gtao, 1);
// Camera "look": contrast, saturation, a colour tint per boss, vignette and a touch of film grain
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uVignette: { value: 0.5 }, uGrain: { value: 0.03 },
    uContrast: { value: 1.08 }, uSaturation: { value: 1.06 }, uTint: { value: new THREE.Color(1, 1, 1) },
  },
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uContrast, uSaturation; uniform vec3 uTint; varying vec2 vUv;
    float rand(vec2 co) { return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      col = (col - 0.5) * uContrast + 0.5;
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, uSaturation) * uTint;
      col *= 1.0 - uVignette * smoothstep(0.35, 0.9, distance(vUv, vec2(0.5)));
      col += (rand(vUv * 731.0 + uTime) - 0.5) * uGrain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`,
});
gradePass.enabled = false;
composer.addPass(gradePass);
const THEME_TINT = { fire: [1.06, 0.97, 0.9], shadow: [0.93, 0.95, 1.07], storm: [0.9, 0.97, 1.1], stone: [1, 1, 1] };

// Files from viewer/assets/ — found automatically by their names (Poly Haven names work as-is):
//   any .hdr file          → sky + lighting
//   assets/floor/*         → floor textures (…diff… = colour, …nor… = normal, …rough… = roughness, …ao… = ambient occlusion)
//   assets/pillars/*       → pillar textures (same naming)
const realAssets = { hdr: null, envMap: null, sky: null, floor: {}, pillars: {} };
function mapKind(file) {
  const f = file.toLowerCase();
  if (/nor(mal)?[_.-]?(gl)?|_nrm/.test(f) && !/nor_dx/.test(f)) return "normal";
  if (/nor_dx/.test(f)) return "normalDX";
  if (/rough/.test(f)) return "rough";
  if (/(^|[_.\-/])ao([_.-]|$)|ambient.?occlusion/.test(f)) return "ao";
  if (/diff|albedo|colou?r|basecolor|_col[_.]/.test(f)) return "color";
  return null;
}
async function loadRealisticAssets() {
  let files = [];
  try { files = await (await fetch("/api/assets")).json(); } catch { return; }
  const texLoader = new THREE.TextureLoader();
  const load = (file, isColor, repeat) => {
    const t = texLoader.load(file);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(...repeat);
    t.anisotropy = 8;
    if (isColor) t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  for (const [folder, repeat] of [["floor", [40, 40]], ["pillars", [3, 5]]]) {
    const set = {};
    for (const f of files.filter(f => f.startsWith(`assets/${folder}/`) && /\.(jpe?g|png|webp)$/i.test(f))) {
      const k = mapKind(f);
      if (k && !set[k]) set[k] = f;
    }
    if (!set.normal && set.normalDX) set.normal = set.normalDX;
    const out = realAssets[folder];
    if (set.color) out.map = load(set.color, true, repeat);
    if (set.normal) out.normalMap = load(set.normal, false, repeat);
    if (set.rough) out.roughnessMap = load(set.rough, false, repeat);
    if (set.ao) out.aoMap = load(set.ao, false, repeat);
  }
  const hdr = files.find(f => /\.hdr$/i.test(f));
  if (hdr) {
    try {
      const tex = await new RGBELoader().loadAsync(hdr);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      const pmrem = new THREE.PMREMGenerator(renderer);
      realAssets.envMap = pmrem.fromEquirectangular(tex).texture;
      realAssets.sky = tex;
      realAssets.hdr = hdr;
    } catch (err) { console.warn("Couldn't load", hdr, err); }
  }
  realAssets.found = files.filter(f => /\.(hdr|jpe?g|png|webp)$/i.test(f));
}

let baseHemi = 0.9;
function applyRealistic(on) {
  realistic = on;
  hud.el("real")?.classList.toggle("on", on);
  gtao.enabled = on;
  gradePass.enabled = on;
  gradePass.uniforms.uTint.value.setRGB(...(THEME_TINT[theme] || THEME_TINT.stone));
  // HDR sky: lights the scene and shows (blurred, dimmed) behind the arena
  const env = on && realAssets.envMap;
  scene.environment = env ? realAssets.envMap : null;
  if (env) { scene.background = realAssets.sky; scene.backgroundBlurriness = 0.35; scene.backgroundIntensity = 0.3; }
  else if (scene.background?.isTexture) { scene.background = new THREE.Color(scene.fog.color); }
  baseHemi = env ? 0.35 : 0.9;   // the sky does most of the lighting now
  renderer.toneMappingExposure = env ? 0.85 : 1;
  sun.intensity = env ? 1.6 : 2.2;
  // Textures on the floor and pillars
  const swap = (material, set, fallbackMap) => {
    material.map = on && set.map ? set.map : fallbackMap;
    material.normalMap = on ? set.normalMap || null : null;
    material.roughnessMap = on ? set.roughnessMap || null : null;
    material.aoMap = on ? set.aoMap || null : null;
    material.roughness = on && set.roughnessMap ? 1 : 0.9;
    material.needsUpdate = true;
  };
  swap(floorMat, realAssets.floor, stoneTex);
  swap(pillarMat, realAssets.pillars, null);
  // Sharper shadows
  sun.shadow.mapSize.set(on ? 4096 : 2048, on ? 4096 : 2048);
  sun.shadow.map?.dispose(); sun.shadow.map = null;
}

// Stone floor texture drawn in code (no image files needed)
function stoneTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = "#3a3a40"; g.fillRect(0, 0, 512, 512);
  const n = 8, s = 512 / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const v = 50 + Math.floor(Math.random() * 22);
    g.fillStyle = `rgb(${v},${v},${v + 6})`;
    const off = (y % 2) * s / 2;
    g.fillRect(x * s + off + 2, y * s + 2, s - 4, s - 4);
    for (let i = 0; i < 30; i++) {
      g.fillStyle = `rgba(0,0,0,${Math.random() * 0.12})`;
      g.fillRect(x * s + off + Math.random() * s, y * s + Math.random() * s, 3, 3);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(16, 16);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const stoneTex = stoneTexture();   // the built-in floor (used when realistic textures aren't there)
const floorMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.95, color: 0xffffff });
const floor = new THREE.Mesh(new THREE.CircleGeometry(95, 64), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Pillars with torches around the arena (hidden in the open world)
const arenaProps = [floor];
const torchMat = new THREE.MeshStandardMaterial({ color: 0x331100, emissive: 0xff8833, emissiveIntensity: 3 });
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x55555e, roughness: 0.9, flatShading: true });
for (let i = 0; i < 18; i++) {
  const a = (i / 18) * Math.PI * 2, r = 62;
  const p = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 14, 8), pillarMat);
  p.position.set(Math.cos(a) * r, 7, Math.sin(a) * r);
  p.castShadow = p.receiveShadow = true;
  const t = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 6), torchMat);
  t.position.set(Math.cos(a) * (r - 1.9), 9, Math.sin(a) * (r - 1.9));
  scene.add(p, t);
  arenaProps.push(p, t);
}

// A few torches cast real flickering light (more would slow things down)
const torchLights = [];
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2 + 0.17;
  const l = new THREE.PointLight(0xff8a3a, 30, 32, 1.6);
  l.position.set(Math.cos(a) * 58, 9, Math.sin(a) * 58);
  scene.add(l);
  torchLights.push(l);
}

// Each boss gets its own mood
let theme = "stone";
function setTheme(bossName = "") {
  if (!scene.background?.isColor) scene.background = new THREE.Color();   // realistic mode may have put the HDR sky there
  theme = /Azgaroth|Ashen|Tyrant|Forge/i.test(bossName) ? "fire" : /Hollow|Crypt/i.test(bossName) ? "shadow"
    : /Vorathyx|Storm|Spire|Tempest|Gale|Thunder/i.test(bossName) ? "storm" : "stone";
  if (theme === "storm") {   // dark storm clouds, rain and lightning
    scene.background.set(0x0a0f1c); scene.fog.color.set(0x0a0f1c);
    floorMat.color.set(0x8c9ab8); hemi.color.set(0x6a8cff); sun.color.set(0xa8c0ff);
  } else if (/Azgaroth|Ashen|Tyrant|Forge/i.test(bossName)) {
    scene.background.set(0x160806); scene.fog.color.set(0x160806);
    floorMat.color.set(0xd09080); hemi.color.set(0xcc7755); sun.color.set(0xffb080);
  } else if (/Hollow|Crypt/i.test(bossName)) {
    scene.background.set(0x0a0b16); scene.fog.color.set(0x0a0b16);
    floorMat.color.set(0x9aa0c8); hemi.color.set(0x7788dd); sun.color.set(0xc8d0ff);
  } else {
    scene.background.set(0x0d0f16); scene.fog.color.set(0x0d0f16);
    floorMat.color.set(0xffffff); hemi.color.set(0x8899cc); sun.color.set(0xffe8cc);
  }
  try { if (realistic) applyRealistic(true); } catch { /* not ready yet */ }
}

const effects = new EffectSystem(scene);
effects.onBurst = (pos, color, size) => { if (fancy && size >= 0.6) particles.burst(pos, color, Math.round(4 + size * 4), 2 + size * 1.5); };

// =====================================================================
//  CHARACTER LOOKS (placeholder figures until you add .glb models)
// =====================================================================
const CLASS_COLORS = { Knight: "#f58cba", Warrior: "#c79c6e", Rogue: "#fff569", Mage: "#69ccf0", Healer: "#ffffff", Druid: "#ff8c1a", Necromancer: "#b06cff", Valkyrie: "#9fe7ff" };
const ROLE_RING = { tank: 0x4a8cff, healer: 0x44dd66, dps: 0xff5555, enemy: 0xff8800, pet: 0x6fbf3a };

// human: real person (skin, face, hair) · armor: plate (shiny metal), leather or cloth
// helm: true = full helm (face hidden), "open" = open-face helm
const CLASS_LOOK = {
  Knight:  { human: true, armor: "plate", body: 0xc4c8d2, trim: 0xd4af37, weapon: "sword", offhand: "shield", helm: true, holyWings: true },
  Warrior: { human: true, armor: "plate", body: 0x7a6a5a, armorColor: 0x8a8f99, trim: 0x9a2a2a, weapon: "axe", helm: "open", cape: 0x6a1a1a },
  Rogue:   { human: true, armor: "leather", body: 0x2e2838, trim: 0x6a2a8a, weapon: "dagger", offhand: "dagger", hood: true },
  Mage:    { human: true, armor: "cloth", body: 0x2a4aa8, trim: 0x9ad0ff, weapon: "staff", orb: 0x7fd4ff, robe: true, hat: true },
  Healer:  { human: true, armor: "cloth", body: 0xf4f6fb, trim: 0xd4af37, weapon: "staff", orb: 0xffd966, robe: true, halo: true },
  Druid:   { human: true, armor: "leather", body: 0x5a4a2a, trim: 0x6aa84f, cape: 0x2f5a2a, weapon: "staff", orb: 0x8fe36a, antlers: true },
  Necromancer: { human: true, armor: "cloth", body: 0x1e1a24, trim: 0x8a4dff, weapon: "scythe", robe: true, hood: true, eyes: 0x9bff6a },
  Valkyrie: { human: true, armor: "plate", body: 0xdfe6f0, trim: 0xd4af37, cape: 0x2a5aa8, weapon: "spear", offhand: "shield", helm: "open", helmWings: true },
};

function enemyLook(name, isBoss, elite) {
  if (/Vorathyx|Storm Sovereign/i.test(name)) return { dragon: true, body: 0x1c2a4c, belly: 0x3a5a8a, trim: 0x7fd4ff, glow: 0x0c2a55, eyes: 0x9ff0ff, size: 3.0 };
  if (/Storm Drake/i.test(name)) return { dragon: true, body: 0x2a3a5c, belly: 0x5a7aa0, trim: 0x7fd4ff, glow: 0x0a1a33, eyes: 0x9ff0ff, size: 1.5 };
  if (/Thunderhawk/i.test(name)) return { dragon: true, body: 0x6a5a3a, belly: 0xc8b07a, trim: 0xffe08a, eyes: 0xffee88, size: 0.75 };

  if (/Spire Stormguard/i.test(name)) return { armor: "plate", body: 0x3a4a6a, trim: 0x7fd4ff, weapon: "sword", offhand: "shield", helm: true, size: 1.2, eyes: 0x9ff0ff };

  if (/Hollow King/i.test(name)) return { armor: "plate", undead: true, engraved: true, body: 0x3a3844, trim: 0x8a6aff, weapon: "greatsword", crown: true, eyes: 0xb07cff, size: 2.6, cape: 0x1a1030, tattered: true, wisps: 0x8a6aff };
  if (/Azgaroth|Tyrant/i.test(name)) return { demon: true, bulk: 1.3, body: 0x2a1410, trim: 0xff5a1a, glow: 0x661800, wingColor: 0x2a120c, weapon: "axe", eyes: 0xffaa33, size: 3.0, batWings: true, tail: true, shoulderSpikes: true, embers: 0xff7a2a };
  if (/Elemental/i.test(name)) return { body: 0x442211, glow: 0xff6a1a, robe: true, eyes: 0xffee88, size: 1.3, noWeapon: true };
  if (/Skeleton|Bone/i.test(name)) return { body: 0xd8d2c0, trim: 0x777066, weapon: /Archer/i.test(name) ? "bow" : "sword", eyes: 0x88aaff, thin: true };
  if (/Ghoul/i.test(name)) return { body: 0x5a7a4a, trim: 0x334422, noWeapon: true, hunch: true, eyes: 0xccff66 };
  if (/Deathguard/i.test(name)) return { armor: "plate", body: 0x2a2a33, trim: 0x8a6aff, weapon: "greatsword", helm: true, eyes: 0xb07cff, size: 1.5 };
  if (/Giant/i.test(name)) return { body: 0x3a1a10, glow: 0x551500, trim: 0xff5a1a, noWeapon: true, size: 2.2, eyes: 0xffaa33 };
  if (/Imp/i.test(name)) return { body: 0xaa2211, trim: 0x331100, horns: true, noWeapon: true, size: 0.75, eyes: 0xffee00 };
  if (/Hound/i.test(name)) return { body: 0x552211, glow: 0x441100, noWeapon: true, hunch: true, size: 1.1, eyes: 0xffaa33 };
