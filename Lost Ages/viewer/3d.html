}

function buildAxe(m, look) {   // a double-bitted great-axe with crescent blades
  const g = new THREE.Group();
  // haft: tapered ash with a leather grip at the bottom and steel langets at the head
  g.add(mesh(latheGeo("axeHaft", [[0.03, -0.25], [0.034, 0.2], [0.032, 0.7], [0.028, 1.12]], 12), m.wood, 0, 0));
  g.add(gripMesh(m, 0.036, -0.18, 0.18));
  g.add(mesh(latheGeo("axeButt", [[0, -0.33], [0.022, -0.31], [0.04, -0.27], [0.04, -0.24], [0.034, -0.23]], 12), m.dark, 0, 0));
  for (const s of [-1, 1]) g.add(mesh(wGeo("langet", () => new THREE.BoxGeometry(0.012, 0.3, 0.03)), m.dark, s * 0.032, 0.84));
  g.add(mesh(latheGeo("axeCollar", [[0.044, -0.09], [0.05, -0.07], [0.05, 0.07], [0.044, 0.09]], 12), m.trim, 0, 1.0));
  g.add(mesh(wGeo("axeTop", () => new THREE.ConeGeometry(0.032, 0.16, 8)), m.dark, 0, 1.17));
  // blades: a crescent with a sharpened bevel along the curved edge
  const bladeGeo = wGeo("axeBlade", () => {
    const s = new THREE.Shape();
    s.moveTo(0, -0.07); s.lineTo(0.12, -0.1);
    s.quadraticCurveTo(0.3, -0.2, 0.36, -0.32);
    s.quadraticCurveTo(0.5, 0, 0.36, 0.32);
    s.quadraticCurveTo(0.3, 0.2, 0.12, 0.1);
    s.lineTo(0, 0.07); s.lineTo(0, -0.07);
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.018, bevelSegments: 3, curveSegments: 16 });
    geo.translate(0, 0, -0.006);
    return geo;
  });
  const edgeGeo = wGeo("axeEdge", () => {   // the honed strip along the cutting edge
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0.36, -0.32, 0), new THREE.Vector3(0.5, 0, 0), new THREE.Vector3(0.36, 0.32, 0));
    const tube = new THREE.TubeGeometry(curve, 20, 0.008, 4, false);
    tube.scale(1, 1, 0.6);
    return tube;
  });
  for (const side of [-1, 1]) {
    const b = new THREE.Group();
    b.position.y = 1.0;
    b.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;   // blades sweep forward and back
    b.add(mesh(bladeGeo, m.dark));
    b.add(mesh(edgeGeo, m.edge, 0.012, 0, 0));
    addRivets(b, m.trim, [[0.07, 0.04, 0.02], [0.07, -0.04, 0.02], [0.07, 0.04, -0.02], [0.07, -0.04, -0.02]], 0.01);
    if (look.glow) {   // a glowing molten edge along each blade
      const edge = mesh(new THREE.TorusGeometry(0.78, 0.016, 6, 20, 0.79), glowMat(look.trim ?? 0xff5a1a), -0.34, 0, 0);
      edge.rotation.z = -0.395;
      b.add(edge);
    }
    g.add(b);
  }
  g.rotation.x = Math.PI / 2;
  return g;
}

function buildSpear(m, look) {
  const g = new THREE.Group();
  g.add(mesh(latheGeo("spearShaft", [[0.024, -0.4], [0.027, 0.3], [0.025, 1.2], [0.022, 1.74]], 10), m.wood, 0, 0));
  g.add(gripMesh(m, 0.028, -0.1, 0.22));
  g.add(mesh(latheGeo("spearButt", [[0, -0.55], [0.012, -0.5], [0.026, -0.4], [0.029, -0.37], [0.026, -0.36]], 10), m.trim, 0, 0));
  // socket with binding rings, then a pair of lugs (a winged spear) and the leaf-shaped head
  g.add(mesh(latheGeo("spearSocket", [[0.026, 0], [0.032, 0.02], [0.028, 0.06], [0.022, 0.16], [0.017, 0.2]], 10), m.trim, 0, 1.72));
  for (const y of [1.73, 1.77]) { const r = mesh(wGeo("bind", () => new THREE.TorusGeometry(0.03, 0.005, 6, 14)), m.dark, 0, y); r.rotation.x = Math.PI / 2; g.add(r); }
  g.add(mesh(guardGeo("spearLugs", 0.075, 0.009, -0.025), m.trim, 0, 1.86));
  g.add(mesh(wGeo("blade-spear", () => bladeGeometry({
    len: 0.38, thick: 0.009, fuller: null,
    width: (t) => 0.048 * (t < 0.3 ? 0.55 + t * 1.5 : Math.max(0, Math.cos((t - 0.3) / 0.7 * Math.PI / 2)) * 1.0),
  })), m.steel, 0, 1.9));
  g.rotation.x = Math.PI / 2;
  return g;
}

function buildScythe(m, look) {
  const g = new THREE.Group();
  // the snath: a long, gently bent shaft with two hand grips (nibs)
  g.add(mesh(wGeo("snath", () => taperTube([[0, -0.42, 0], [0.01, 0.3, 0.03], [0, 0.9, 0.02], [0, 1.42, -0.02]], 0.03, 0.85, 10, 20)), m.wood));
  g.add(gripMesh(m, 0.033, -0.3, -0.02));
  for (const [y, len] of [[0.35, 0.16], [0.95, 0.13]]) {
    const nib = mesh(wGeo("nib" + len, () => taperTube([[0, 0, 0], [0, 0.02, len * 0.6], [0, 0.04, len]], 0.017, 0.8, 8, 8)), m.wood, 0, y, 0);
    g.add(nib);
    const ring = mesh(wGeo("nibRing", () => new THREE.TorusGeometry(0.033, 0.006, 6, 14)), m.dark, 0, y, 0);
    ring.rotation.x = Math.PI / 2; g.add(ring);
  }
  g.add(mesh(latheGeo("snathCap", [[0.034, -0.04], [0.04, -0.02], [0.04, 0.05], [0.03, 0.08]], 12), m.dark, 0, 1.38, -0.02));
  // the blade: one long curved edge, thick spine on top, sweeping back from the top of the shaft
  const bladeGeo = wGeo("scytheBlade", () => {
    const s = new THREE.Shape();
    s.moveTo(0, 0.03);
    s.quadraticCurveTo(0.45, 0.14, 0.92, -0.12);   // spine
    s.quadraticCurveTo(0.5, -0.02, 0.06, -0.09);   // sharpened inner edge
    s.lineTo(0, -0.06); s.lineTo(0, 0.03);
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.004, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.012, bevelSegments: 2, curveSegments: 24 });
    geo.translate(0, 0, -0.002);
    geo.rotateY(Math.PI / 2);   // sweep toward -Z
    return geo;
  });
  g.add(mesh(bladeGeo, m.dark, 0, 1.4, -0.03));
  const edgeGeo = wGeo("scytheEdge", () => {
    const c = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0.9, -0.12, 0), new THREE.Vector3(0.5, -0.02, 0), new THREE.Vector3(0.06, -0.09, 0));
    const t = new THREE.TubeGeometry(c, 24, 0.006, 4, false); t.scale(1, 1, 0.5); t.rotateY(Math.PI / 2); return t;
  });
  g.add(mesh(edgeGeo, m.edge, 0, 1.4 - 0.004, -0.03));
  g.add(mesh(wGeo("scytheTang", () => new THREE.BoxGeometry(0.05, 0.1, 0.07)), m.trim, 0, 1.4, -0.03));
  addRivets(g, m.trim, [[0.028, 1.42, -0.04], [-0.028, 1.42, -0.04], [0.028, 1.38, -0.04], [-0.028, 1.38, -0.04]], 0.008);
  if (look.eyes) {   // a necromancer's blade: a faint sickly glow along the spine
    g.add(mesh(wGeo("scytheGlow", () => {
      const c = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0.06, 0.04, 0), new THREE.Vector3(0.45, 0.13, 0), new THREE.Vector3(0.88, -0.1, 0));
      const t = new THREE.TubeGeometry(c, 20, 0.004, 4, false); t.rotateY(Math.PI / 2); return t;
    }), glowMat(look.trim ?? 0x8a4dff), 0, 1.4, -0.03));
  }
  g.rotation.x = Math.PI / 2.4;
  return g;
}

function buildStaff(m, look) {
  const g = new THREE.Group();
  const natural = !!look.antlers;   // a druid's staff is a living branch
  // a gnarled shaft, slightly twisted
  g.add(mesh(wGeo("staffShaft", () => taperTube([[0, -0.52, 0], [0.012, -0.1, 0.008], [-0.01, 0.4, -0.006], [0.008, 0.85, 0.01], [0, 1.08, 0]], 0.03, 0.85, 10, 28)), m.wood));
  g.add(gripMesh(m, 0.034, -0.05, 0.3));
  g.add(mesh(latheGeo("ferrule", [[0, -0.6], [0.018, -0.57], [0.03, -0.52], [0.032, -0.48], [0.028, -0.46]], 10), natural ? m.wood : m.trim, 0, 0));
  if (!natural) {
    g.add(mesh(latheGeo("staffCollar", [[0.03, 0], [0.04, 0.02], [0.036, 0.06], [0.044, 0.09], [0.034, 0.12]], 12), m.trim, 0, 1.03));
    for (const y of [0.42, 0.72]) { const r = mesh(wGeo("staffBand", () => new THREE.TorusGeometry(0.031, 0.006, 6, 14)), m.trim, 0, y); r.rotation.x = Math.PI / 2; g.add(r); }
  }
  // prongs curling up around the orb (metal claws, or twisted roots for a druid)
  const prong = wGeo("prong" + natural, () => taperTube([[0, 0, 0], [0.06, 0.06, 0], [0.11, 0.16, 0], [0.07, 0.27, 0], [0.02, 0.31, 0]], natural ? 0.016 : 0.012, 0.25, 8, 16));
  for (let k = 0; k < 4; k++) {
    const p = mesh(prong, natural ? m.wood : m.trim, 0, 1.1, 0);
    p.rotation.y = k * Math.PI / 2 + 0.4;
    g.add(p);
  }
  if (natural) for (let k = 0; k < 5; k++) {   // a few leaves sprouting from the head
    const leaf = mesh(wGeo("leaf", () => { const s = new THREE.Shape(); s.moveTo(0, 0); s.quadraticCurveTo(0.03, 0.04, 0, 0.09); s.quadraticCurveTo(-0.03, 0.04, 0, 0); const geo = new THREE.ShapeGeometry(s, 6); return geo; }),
      wMat("leafMat", () => mat(0x5a8a3a, { roughness: 0.6, side: THREE.DoubleSide })), Math.cos(k * 1.3) * 0.05, 1.05 + k * 0.02, Math.sin(k * 1.3) * 0.05);
    leaf.rotation.set(0.6, k * 1.3, 0.4);
    g.add(leaf);
  }
  const orb = mesh(wGeo("staffOrb", () => new THREE.IcosahedronGeometry(0.085, 3)), glowMat(look.orb ?? 0x88ccff), 0, 1.3);
  g.add(orb);
  g.userData.orb = orb;
  return g;
}

function buildBow(m, look) {
  const g = new THREE.Group();
  // recurve limbs: they bend back toward the archer, then the tips curl forward again
  const limb = wGeo("bowLimb", () => taperTube([[-0.11, 0.06, 0], [-0.09, 0.2, 0], [-0.045, 0.36, 0], [-0.03, 0.46, 0], [-0.075, 0.54, 0]], 0.022, 0.35, 8, 24));
  for (const s of [1, -1]) { const l = mesh(limb, m.wood, 0, 0, 0.05); l.scale.y = s; g.add(l); }
  g.add(mesh(latheGeo("bowGrip", [[0.024, -0.09], [0.03, -0.06], [0.032, 0], [0.03, 0.06], [0.024, 0.09]], 10), m.leather, -0.11, 0, 0.05));
  for (const s of [1, -1]) g.add(mesh(wGeo("nock", () => new THREE.SphereGeometry(0.012, 8, 6)), m.trim, -0.035, 0.465 * s, 0.05));
  const string = mesh(wGeo("bowString", () => new THREE.CylinderGeometry(0.0025, 0.0025, 0.93, 4)), wMat("string", () => mat(0xe8dcc0, { roughness: 0.9, metalness: 0 })), -0.034, 0, 0.05);
  g.add(string);
  return g;
}

function buildShield(m, look) {
  const g = new THREE.Group();
  // A heater shield: straight top, sides curving to a point; bent so it wraps around the arm.
  // Built facing +X (out from the back of the hand), long side along the forearm (Y).
  const outline = (s) => { s.moveTo(-0.24, 0.3); s.lineTo(0.24, 0.3); s.quadraticCurveTo(0.25, -0.05, 0, -0.34); s.quadraticCurveTo(-0.25, -0.05, -0.24, 0.3); return s; };
  const bend = (geo) => { const p = geo.attributes.position; for (let i = 0; i < p.count; i++) { const z = p.getZ(i); p.setX(i, p.getX(i) - 0.7 * z * z); } geo.computeVertexNormals(); return geo; };
  const faceGeo = wGeo("shieldFace", () => {
    const geo = new THREE.ExtrudeGeometry(outline(new THREE.Shape()), { depth: 0.022, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, curveSegments: 18 });
    geo.rotateY(Math.PI / 2);   // shape plane → YZ, thickness → +X
    return bend(geo);
  });
  const paint = wMat("shieldPaint" + (look.cape ?? 0x2a4a9a), () => mat(look.cape ?? 0x2a4a9a, { roughness: 0.62, metalness: 0.05, bumpMap: hideTex(3, 3), bumpScale: 0.8, roughnessMap: hideTex(3, 3) }));
  g.add(mesh(faceGeo, [paint, m.wood], 0.02, 0, 0));
  // steel rim following the outline
  const rimGeo = wGeo("shieldRim", () => {
    const pts = outline(new THREE.Shape()).getSpacedPoints(80).map(p => new THREE.Vector3(0, p.y, -p.x));
    const curve = new THREE.CatmullRomCurve3(pts, true);
    const geo = new THREE.TubeGeometry(curve, 120, 0.012, 6, true);
    return bend(geo);
  });
  g.add(mesh(rimGeo, m.trim, 0.052, 0, 0));
  // boss in the middle, rivets round the edge
  const boss = mesh(wGeo("shieldBoss", () => new THREE.SphereGeometry(0.06, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2)), m.trim, 0.054, 0.04, 0);
  boss.rotation.z = -Math.PI / 2; g.add(boss);
  if (look.holyWings) {   // a Knight's shield: a raised cross
    g.add(mesh(wGeo("crossV", () => new THREE.BoxGeometry(0.012, 0.5, 0.05)), m.trim, 0.058, -0.02, 0));
    g.add(mesh(wGeo("crossH", () => new THREE.BoxGeometry(0.012, 0.05, 0.36)), m.trim, 0.056, 0.15, 0));
  } else if (look.helmWings) {   // a Valkyrie's: a gold chevron like spread wings
    for (const s of [-1, 1]) { const c = mesh(wGeo("chev", () => new THREE.BoxGeometry(0.012, 0.045, 0.27)), m.trim, 0.05, -0.04, s * 0.1); c.rotation.x = s * 0.55; g.add(c); }
  }
  const rv = [];
  for (let k = 0; k < 10; k++) { const t = k / 10, p = outline(new THREE.Shape()).getPointAt(t); rv.push([0.044 - 0.7 * (p.x * 0.86) ** 2, p.y * 0.86 + 0.0, -p.x * 0.86]); }
  addRivets(g, m.trim, rv, 0.009);
  // the strap you hold it by
  g.add(mesh(wGeo("shieldStrap", () => new THREE.BoxGeometry(0.02, 0.3, 0.05)), m.leather, -0.005, 0, 0));
  return g;
}

function buildWeapon(kind, look) {
  const m = weaponMats(look);
  let g;
  if (kind === "sword" || kind === "greatsword") g = buildSword(m, look, kind === "greatsword");
  else if (kind === "axe") g = buildAxe(m, look);
  else if (kind === "spear") g = buildSpear(m, look);
  else if (kind === "scythe") g = buildScythe(m, look);
  else if (kind === "dagger") g = buildDagger(m, look);
  else if (kind === "staff") g = buildStaff(m, look);
  else if (kind === "bow") g = buildBow(m, look);
  else if (kind === "shield") g = buildShield(m, look);
  else g = new THREE.Group();
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  return g;
}

// ---------------------------------------------------------------------
//  REALISTIC HUMANS
//  Real proportions (about 1.85 m), a face (eyes, brows, nose, mouth, ears), hair styles,
//  beards, a range of skin tones, and real joints (knees, elbows) for natural movement.
//  Every player looks a little different — their look is picked from their name, so
//  Courtney always looks like Courtney.
// ---------------------------------------------------------------------
const SKIN_TONES = [0xf3cfb3, 0xe8b894, 0xd8a47e, 0xbd8560, 0x9a6644, 0x744b31, 0x55372a];
const HAIR_COLORS = [0x15110e, 0x2a1b12, 0x45291a, 0x6a4024, 0x93633a, 0xc49a5c, 0xe3cf9c, 0x7d7a78, 0x8c3018];
const hashName = (str = "") => { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const pickBy = (arr, h, shift) => arr[(h >>> shift) % arr.length];

// A shaped torso (wide chest, narrower waist) turned on a lathe, slightly flattened front-to-back
// female: narrower shoulders and waist, a little wider at the hips
function torsoGeometry(w = 1, extra = 1, female = false) {
  const pts = (female
    ? [[0.001, 0], [0.158, 0], [0.168, 0.06], [0.145, 0.16], [0.128, 0.25], [0.15, 0.34], [0.166, 0.41], [0.162, 0.47], [0.118, 0.54], [0.062, 0.578], [0.001, 0.588]]
    : [[0.001, 0], [0.15, 0], [0.163, 0.06], [0.148, 0.17], [0.153, 0.26], [0.182, 0.36], [0.198, 0.44], [0.19, 0.5], [0.13, 0.555], [0.07, 0.585], [0.001, 0.59]])
    .map(([x, y]) => new THREE.Vector2(x * w * extra, y));
  const g = new THREE.LatheGeometry(pts, 28);
  g.scale(1, 1, 0.66);
  return g;
}

/**
 * A humanoid facing +Z (the same way .glb models usually face).
 *   root (moves + turns) → pose (falls over when dead) → body (bobs) → legs + spine → torso / head / arms
 * Players (look.human) get skin, a face and hair; monsters use their body colour all over.
 */
function buildFigure(look, seed = 0, bodyType = "male") {
  const parts = {};
  const body = new THREE.Group();
  const w = look.thin ? 0.72 : look.bulk || 1;
  const human = !!look.human;
  // Body type (players): female figures are a little shorter and slimmer, with narrower shoulders
  const fem = human && bodyType === "female";
  const lw = w * (fem ? 0.88 : 1);          // arm and leg thickness
  if (fem) body.scale.set(0.97, 0.95, 0.97);
  const armor = look.armor || "creature";

  // ---- Materials ----
  // Bosses get engraved, scratched armour; the Tyrant gets molten-rock skin; monsters get a mottled hide
  const engraved = look.engraved ? { bumpMap: engraveTex(2, 2), bumpScale: 2, roughnessMap: engraveTex(2, 2) } : {};
  const metal = (c, r = 0.3) => mat(c, { metalness: 0.8, roughness: look.engraved ? 0.6 : r, envMap: metalEnv, envMapIntensity: 0.7, ...engraved });
  const cloth = (c) => mat(c, { metalness: 0, roughness: 0.92 });
  const leather = (c) => mat(c, { metalness: 0.05, roughness: 0.62 });
  let creature;
  if (look.demon) {
    const lava = lavaTex(2, 2);
    creature = mat(look.body, { map: lava.map, emissiveMap: lava.glow, emissive: 0xffffff, emissiveIntensity: 1.4, bumpMap: lava.bump, bumpScale: 4, roughness: 0.85, metalness: 0 });
    creature.color.setHex(0xffffff);   // the colour comes from the rock texture
  } else {
    creature = mat(look.body, { roughness: 0.65, metalness: 0.15, map: hideTex(2, 2), bumpMap: hideTex(2, 2), bumpScale: 1.5, ...(look.glow ? { emissive: look.glow, emissiveIntensity: 0.8 } : {}) });
    creature.color.multiplyScalar(1.4);
  }
  const bone = mat(0xd9d0b8, { roughness: 0.7, metalness: 0, map: hideTex(1, 1), bumpMap: hideTex(1, 1), bumpScale: 1 });
  const skinTone = human ? pickBy(SKIN_TONES, seed, 0) : look.body;
  const skin = human ? mat(skinTone, { roughness: 0.55, metalness: 0 }) : look.undead ? bone : creature;
  const hairColor = pickBy(HAIR_COLORS, seed, 5);
  const hairMat = mat(hairColor, { roughness: 0.8, metalness: 0 });
  const trimMat = metal(look.trim ?? 0x888888, 0.25);
  const pants = cloth(0x26272c), boots = leather(0x3a2a1c);
  const M = {
    plate:    { torso: metal(look.body), sleeve: metal(0x7a7d85, 0.45), forearm: metal(look.body), hand: metal(look.body), thigh: pants, knee: metal(look.body), shin: metal(look.body), foot: metal(look.body) },
    leather:  { torso: leather(look.body), sleeve: leather(look.body), forearm: boots, hand: skin, thigh: pants, knee: pants, shin: boots, foot: boots },
    cloth:    { torso: cloth(look.body), sleeve: cloth(look.body), forearm: cloth(look.body), hand: skin, thigh: pants, knee: pants, shin: pants, foot: boots },
    creature: { torso: creature, sleeve: creature, forearm: creature, hand: creature, thigh: creature, knee: creature, shin: creature, foot: creature },
  }[armor] || null;

  // ---- Legs: hip → thigh → knee → shin → foot ----
  for (const side of [-1, 1]) {
    const hip = new THREE.Group();
    hip.position.set((fem ? 0.1 : 0.095) * side * w, 0.95, 0);
    hip.add(mesh(new THREE.SphereGeometry(0.075 * lw, 14, 10), M.thigh, 0, -0.02, 0));
    hip.add(mesh(new THREE.CylinderGeometry(0.075 * lw, 0.058 * lw, 0.45, 14), M.thigh, 0, -0.235, 0));
    const knee = new THREE.Group();
    knee.position.y = -0.46;
    hip.add(knee);
    knee.add(mesh(new THREE.SphereGeometry(0.059 * lw, 12, 8), M.knee));
    knee.add(mesh(new THREE.CylinderGeometry(0.056 * lw, 0.042 * lw, 0.42, 14), M.shin, 0, -0.21, 0));
    if (armor === "plate") knee.add(mesh(new THREE.CylinderGeometry(0.064 * lw, 0.05 * lw, 0.36, 14), M.shin, 0, -0.2, 0.004));   // greave
    knee.add(mesh(new THREE.BoxGeometry(0.095 * lw, 0.075, 0.25), M.foot, 0, -0.455, 0.05));
    body.add(hip);
    parts[side < 0 ? "legL" : "legR"] = hip;
    parts[side < 0 ? "kneeL" : "kneeR"] = knee;
  }

  // ---- Robe (cloth classes): hangs from the hips to the ankles ----
  if (look.robe) {
    const robe = mesh(new THREE.CylinderGeometry(0.175 * w, 0.36, 0.9, 24, 1, true), cloth(look.body), 0, 0.5, 0);
    robe.material.side = THREE.DoubleSide;
    body.add(robe);
    const hem = mesh(new THREE.TorusGeometry(0.355, 0.018, 6, 28), trimMat, 0, 0.06, 0);
    hem.rotation.x = Math.PI / 2;
    body.add(hem);
  }

  // ---- Spine (hips) → torso, neck, head, arms ----
  const spine = new THREE.Group();
  spine.position.y = 0.95;
  if (look.hunch) spine.rotation.x = 0.45;
  body.add(spine);
  parts.spine = spine;
  spine.add(mesh(torsoGeometry(w, 1, fem), M.torso));
  const belt = mesh(new THREE.TorusGeometry(0.152 * w, 0.022, 8, 24), armor === "creature" ? trimMat : leather(0x2a1d14), 0, 0.12, 0);
  belt.rotation.x = Math.PI / 2; belt.scale.y = 0.68;
  spine.add(belt);
  spine.add(mesh(new THREE.BoxGeometry(0.06, 0.05, 0.02), trimMat, 0, 0.12, 0.105));   // buckle
  if (armor === "plate") {
    const faulds = mesh(new THREE.CylinderGeometry(0.16 * w, 0.2 * w, 0.2, 20, 1, true), M.torso, 0, 0.02, 0);
    faulds.scale.z = 0.72; faulds.material = metal(look.body); faulds.material.side = THREE.DoubleSide;
    spine.add(faulds);
    const trimLine = mesh(new THREE.TorusGeometry(0.19 * w, 0.012, 6, 24), trimMat, 0, 0.44, 0);
    trimLine.rotation.x = Math.PI / 2; trimLine.scale.y = 0.66;
    spine.add(trimLine);
    spine.add(mesh(new THREE.CylinderGeometry(0.075, 0.1, 0.06, 16), metal(look.body), 0, 0.57, 0));   // gorget
  }
  if (armor === "leather") {   // a strap across the chest
    const strap = mesh(new THREE.BoxGeometry(0.05, 0.5, 0.012), leather(0x2a1d14), 0, 0.33, 0.125);
    strap.rotation.z = 0.6;
    spine.add(strap);
  }
  spine.add(mesh(new THREE.CylinderGeometry(fem ? 0.04 : 0.048, fem ? 0.046 : 0.055, 0.12, 12), skin, 0, 0.62, 0));   // neck

  // ---- Head ----
  const head = new THREE.Group();
  head.position.y = 0.78;
  spine.add(head);
  parts.head = head;
  const skull = mesh(new THREE.SphereGeometry(0.11, 28, 20), skin);
  skull.scale.set(0.9, 1.08, 1.0);
  head.add(skull);
  const hidesFace = look.helm === true;   // a full helm covers the face
  if (fem) skull.scale.set(0.86, 1.05, 0.97);
  if (human && !hidesFace) {
    const jaw = mesh(new THREE.SphereGeometry(0.082, 20, 14), skin, 0, -0.052, 0.018);
    jaw.scale.set(fem ? 0.88 : 1, fem ? 0.74 : 0.8, fem ? 0.94 : 1);   // softer, narrower jaw
    head.add(jaw);
    for (const side of [-1, 1]) {
      head.add(mesh(new THREE.SphereGeometry(0.022, 10, 8), skin, 0.1 * side, -0.005, -0.005)).children.at(-1).scale.set(0.5, 1, 0.8);   // ear
      if (look.eyes) head.add(mesh(new THREE.SphereGeometry(0.014, 10, 8), glowMat(look.eyes), 0.036 * side, 0.012, 0.094));
      else {
        head.add(mesh(new THREE.SphereGeometry(0.016, 12, 10), mat(0xf4f1ea, { roughness: 0.3, metalness: 0 }), 0.036 * side, 0.012, 0.09));   // eye
        head.add(mesh(new THREE.SphereGeometry(0.0085, 10, 8), mat(0x2a1d14, { roughness: 0.2, metalness: 0 }), 0.036 * side, 0.012, 0.104)); // iris
      }
      const brow = mesh(new THREE.BoxGeometry(0.036, fem ? 0.005 : 0.008, 0.012), hairMat, 0.036 * side, 0.04, 0.098);
      brow.rotation.z = (fem ? -0.25 : -0.15) * side;
      head.add(brow);
      if (fem && !look.eyes) {   // lashes
        const lash = mesh(new THREE.BoxGeometry(0.03, 0.004, 0.006), mat(0x14100e, { roughness: 0.6, metalness: 0 }), 0.036 * side, 0.026, 0.104);
        lash.rotation.z = -0.12 * side;
        head.add(lash);
      }
    }
    const nose = mesh(new THREE.ConeGeometry(fem ? 0.012 : 0.015, fem ? 0.032 : 0.04, 10), skin, 0, -0.008, 0.112);
    nose.rotation.x = Math.PI / 2.2;
    head.add(nose);
    head.add(mesh(new THREE.BoxGeometry(fem ? 0.032 : 0.036, fem ? 0.009 : 0.007, 0.008), mat(fem ? 0xa85454 : 0x8a4a42, { roughness: 0.45, metalness: 0 }), 0, -0.048, 0.1));   // mouth
    // Hair: short, long, ponytail, bun or shaved — and some get a beard
    if (!look.helm && !look.hood) {
      // 0 short · 1 long · 2 ponytail · 3 bun · 4 shaved · 5 long and flowing
      const style = fem ? [1, 2, 3, 5, 1, 2][(seed >>> 9) % 6] : [0, 0, 4, 2, 1][(seed >>> 9) % 5];
      if (style !== 4) {
        const cap = mesh(new THREE.SphereGeometry(0.118, 26, 14, 0, Math.PI * 2, 0, Math.PI * 0.52), hairMat, 0, 0.012, -0.006);
        cap.scale.set(0.95, 1.08, 1.06);
        head.add(cap);
      }
      if (style === 1) {   // long hair down the back
        const back = mesh(new THREE.CylinderGeometry(0.1, 0.115, 0.26, 18, 1, true, Math.PI * 0.6, Math.PI * 1.8), hairMat, 0, -0.1, -0.012);
        back.material = hairMat.clone(); back.material.side = THREE.DoubleSide;
        head.add(back);
      } else if (style === 2) {   // ponytail
        head.add(mesh(new THREE.SphereGeometry(0.035, 12, 10), hairMat, 0, 0.0, -0.12));
        head.add(mesh(new THREE.CylinderGeometry(0.03, 0.012, 0.2, 10), hairMat, 0, -0.1, -0.135));
      } else if (style === 3) {   // bun
        head.add(mesh(new THREE.SphereGeometry(0.045, 14, 10), hairMat, 0, 0.09, -0.07));
      } else if (style === 5) {   // long and flowing, past the shoulders
        const back = mesh(new THREE.CylinderGeometry(0.105, 0.14, 0.42, 20, 1, true, Math.PI * 0.62, Math.PI * 1.76), hairMat.clone(), 0, -0.17, -0.015);
        back.material.side = THREE.DoubleSide;
        head.add(back);
        for (const side of [-1, 1]) head.add(mesh(new THREE.CylinderGeometry(0.022, 0.03, 0.22, 8), hairMat, 0.1 * side, -0.1, 0.03));   // strands framing the face
      }
      if (fem && style === 1) head.children.at(-1).scale.set(1.05, 1.5, 1.05);   // longer hair
    }
    if (!fem && !look.hood && (seed >>> 13) % 3 === 0) {   // beard
      const beard = mesh(new THREE.SphereGeometry(0.086, 18, 12, 0, Math.PI * 2, Math.PI * 0.45, Math.PI * 0.5), hairMat, 0, -0.035, 0.016);
      beard.scale.set(0.98, 1.05, 1.0);
      head.add(beard);
    }
  } else if (look.undead) {
    // A skull: deep dark eye sockets with burning eyes, a nasal hole, cheekbones and a row of teeth
    skull.scale.set(0.88, 1.0, 1.02);
    const socket = mat(0x050307, { roughness: 1, metalness: 0 });
    for (const side of [-1, 1]) {
      head.add(mesh(new THREE.SphereGeometry(0.028, 12, 10), socket, 0.038 * side, 0.012, 0.088)).children.at(-1).scale.set(1, 0.9, 0.6);
      head.add(mesh(new THREE.SphereGeometry(0.011, 8, 6), glowMat(look.eyes ?? 0xb07cff), 0.038 * side, 0.012, 0.1));
      head.add(mesh(new THREE.SphereGeometry(0.03, 10, 8), bone, 0.065 * side, -0.03, 0.07)).children.at(-1).scale.set(0.8, 0.6, 0.8);   // cheekbone
    }
    head.add(mesh(new THREE.ConeGeometry(0.012, 0.03, 3), socket, 0, -0.025, 0.105)).children.at(-1).rotation.x = Math.PI;   // nose hole
    const jawB = mesh(new THREE.SphereGeometry(0.07, 16, 10, 0, Math.PI * 2, Math.PI * 0.4, Math.PI * 0.6), bone, 0, -0.045, 0.02);
    jawB.scale.set(0.95, 1, 1.15);
    head.add(jawB);
    for (let k = -3; k <= 3; k++) head.add(mesh(new THREE.BoxGeometry(0.011, 0.018, 0.008), mat(0xeee6cf, { roughness: 0.4, metalness: 0 }), k * 0.0125, -0.058, 0.096 - Math.abs(k) * 0.004));
  } else if (look.demon) {
    // A horned demon head: heavy brow, long jaw lined with fangs, burning eyes and a glowing throat
    skull.scale.set(0.95, 1.0, 1.1);
    const brow = mesh(new THREE.BoxGeometry(0.17, 0.035, 0.06), creature, 0, 0.035, 0.085);
    brow.rotation.x = 0.3;
    head.add(brow);
    const jawD = mesh(new THREE.SphereGeometry(0.085, 16, 10), creature, 0, -0.07, 0.04);
    jawD.scale.set(0.95, 0.75, 1.25);
    head.add(jawD);
    head.add(mesh(new THREE.BoxGeometry(0.1, 0.018, 0.04), glowMat(look.trim ?? 0xff5a1a), 0, -0.06, 0.13));   // glowing maw
    const fang = mat(0xeee6cf, { roughness: 0.35, metalness: 0 });
    for (const side of [-1, 1]) {
      head.add(mesh(new THREE.SphereGeometry(0.017, 10, 8), glowMat(look.eyes ?? 0xffaa33), 0.042 * side, 0.012, 0.1)).children.at(-1).scale.set(1.3, 0.6, 0.6);
      for (let k = 0; k < 3; k++) {
        const f = mesh(new THREE.ConeGeometry(0.008, 0.035 - k * 0.008, 5), fang, (0.02 + k * 0.016) * side, -0.045, 0.128 - k * 0.012);
        f.rotation.x = Math.PI;
        head.add(f);
      }
      // Big ram horns curling back and around
      head.add(mesh(taperTube([[0.07 * side, 0.08, 0.02], [0.13 * side, 0.17, -0.02], [0.2 * side, 0.2, -0.12], [0.25 * side, 0.12, -0.2], [0.24 * side, 0.02, -0.14], [0.21 * side, 0.0, -0.05]], 0.035, 0.12, 10, 30), mat(0x1c1612, { roughness: 0.4, metalness: 0.1, map: bandsTex(1, 8), bumpMap: bandsTex(1, 8), bumpScale: 3 })));
    }
  } else if (!human && look.eyes) {
    for (const side of [-1, 1]) head.add(mesh(new THREE.SphereGeometry(0.02, 8, 6), glowMat(look.eyes), 0.04 * side, 0.015, 0.095));
  }

  // ---- Headgear ----
  if (look.helm) {
    const open = look.helm === "open";   // open-face helm shows the face
    const helm = mesh(open
      ? new THREE.SphereGeometry(0.13, 26, 16, Math.PI / 2 + 0.75, Math.PI * 2 - 1.5, 0, Math.PI * 0.62)
      : new THREE.SphereGeometry(0.13, 26, 16), metal(look.armorColor ?? 0xb8bcc8, 0.28), 0, 0.012, -0.004);
    helm.scale.set(0.95, 1.08, 1.04);
    if (open) { helm.material.side = THREE.DoubleSide; }
    head.add(helm);
    if (!open) {
      head.add(mesh(new THREE.BoxGeometry(0.15, 0.014, 0.03), mat(0x0a0a0c), 0, 0.012, 0.126));   // visor slit
      head.add(mesh(new THREE.BoxGeometry(0.012, 0.09, 0.03), mat(0x0a0a0c), 0, -0.04, 0.128));
    }
    head.add(mesh(new THREE.BoxGeometry(0.02, 0.05, 0.2), trimMat, 0, 0.14, -0.01));   // crest
  }
  if (look.hood) {
    const hood = mesh(new THREE.SphereGeometry(0.15, 24, 16, Math.PI / 2 + 0.85, Math.PI * 2 - 1.7, 0, Math.PI * 0.74),
      cloth(look.body), 0, 0.015, -0.015);
    hood.material.side = THREE.DoubleSide;
    hood.scale.set(1, 1.08, 1.05);
    head.add(hood);
    const tip = mesh(new THREE.ConeGeometry(0.07, 0.2, 10), cloth(look.body), 0, 0.06, -0.15);
    tip.rotation.x = -1.15;
    head.add(tip);
  }
  if (look.hat) {
    head.add(mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.014, 28), cloth(look.body), 0, 0.085, 0));
    const tip = mesh(new THREE.ConeGeometry(0.115, 0.42, 20), cloth(look.body), 0, 0.29, -0.03);
    tip.rotation.x = -0.22;
    head.add(tip);
    head.add(mesh(new THREE.TorusGeometry(0.118, 0.012, 6, 24), trimMat, 0, 0.1, 0)).children.at(-1).rotation.x = Math.PI / 2;
  }
  if (look.halo) {
    const halo = mesh(new THREE.TorusGeometry(0.13, 0.014, 8, 32), glowMat(0xffd966), 0, 0.22, 0);
    halo.rotation.x = Math.PI / 2;
    head.add(halo);
  }
  if (look.crown) {   // a tarnished iron-and-gold crown: a band, tall points, and glowing gems
    const gold = mat(0x9a7a3a, { metalness: 0.9, roughness: 0.35, envMap: metalEnv, envMapIntensity: 0.8 });
    const band = mesh(new THREE.CylinderGeometry(0.108, 0.1, 0.04, 28, 1, true), gold, 0, 0.1, 0);
    band.material.side = THREE.DoubleSide;
    head.add(band);
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + Math.PI / 2;
      const pt = mesh(new THREE.ConeGeometry(0.018, 0.1 + (i === 0 ? 0.04 : 0), 4), gold, Math.cos(a) * 0.104, 0.16 + (i === 0 ? 0.02 : 0), Math.sin(a) * 0.104);
      pt.rotation.set(Math.sin(a) * 0.15, 0, -Math.cos(a) * 0.15);
      head.add(pt);
      head.add(mesh(new THREE.SphereGeometry(0.009, 8, 6), glowMat(look.trim), Math.cos(a) * 0.11, 0.1, Math.sin(a) * 0.11));
    }
  }
  if (look.horns) {
    for (const side of [-1, 1]) {
      const h = mesh(new THREE.ConeGeometry(0.035, 0.22, 10), mat(0x1a1410), 0.09 * side, 0.11, 0);
      h.rotation.z = -0.6 * side;
      head.add(h);
    }
  }
  if (look.helmWings) {
    for (const side of [-1, 1]) {
      const wg = mesh(wingGeometry(0.2, 0.12), mat(0xf4f6ff, { side: THREE.DoubleSide }), 0.12 * side, 0.05, -0.01);
      wg.scale.x = side;
      wg.rotation.set(0, side * 0.4, 0.5 * side);
      head.add(wg);
    }
  }
  if (look.antlers) {
    for (const side of [-1, 1]) {
      const main = mesh(new THREE.CylinderGeometry(0.009, 0.015, 0.25, 8), mat(0x8a6a44), 0.07 * side, 0.17, -0.01);
      main.rotation.z = -0.5 * side;
      head.add(main);
      const tine = mesh(new THREE.CylinderGeometry(0.006, 0.011, 0.12, 8), mat(0x8a6a44), 0.12 * side, 0.23, 0.025);
      tine.rotation.set(0.5, 0, 0.3 * side);
      head.add(tine);
    }
  }

  // ---- Cape and (monster) wings ----
  if (look.cape) {
    const capeGeo = new THREE.PlaneGeometry(0.42, 1.05, 6, 10);
    const pos = capeGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setZ(i, -Math.pow(pos.getX(i) / 0.21, 2) * 0.05);   // curved around the back
    capeGeo.computeVertexNormals();
    const cape = mesh(capeGeo, cloth(look.cape), 0, 0.0, -0.13);
    cape.material.side = THREE.DoubleSide;
    if (look.tattered) { cape.material.alphaMap = tatteredTex(); cape.material.alphaTest = 0.5; cape.scale.set(1.25, 1.25, 1); }
    cape.rotation.x = 0.08;
    const capePivot = new THREE.Group();
    capePivot.position.set(0, 0.54, -0.02);
    cape.position.y = -0.52;
    capePivot.add(cape);
    spine.add(capePivot);
    parts.cape = capePivot;
  }
  if (look.batWings) {   // huge leathery wings that beat slowly
    const wingMat = mat(look.wingColor ?? 0x3a1810, { side: THREE.DoubleSide, roughness: 0.8, metalness: 0, emissive: look.glow ?? 0x000000, emissiveIntensity: 0.4 });
    const horn = mat(0x1c1612, { roughness: 0.45, metalness: 0.1 });
    const bw = { left: null, right: null };
    for (const side of [-1, 1]) {
      const pivot = new THREE.Group();
      pivot.position.set(0.07 * side, 0.46, -0.12);
      const wg = buildBatWing(1.5, wingMat, horn, horn);
      wg.scale.x = side;
      pivot.add(wg);
      spine.add(pivot);
      bw[side < 0 ? "left" : "right"] = pivot;
    }
    parts.batWings = bw;
  }
  if (look.tail) {   // a long whip tail ending in a spade
    const tailG = new THREE.Group();
    tailG.position.set(0, 0.9, -0.1);
    tailG.add(mesh(taperTube([[0, 0, 0], [0, -0.15, -0.25], [0.08, -0.45, -0.5], [0.2, -0.75, -0.6], [0.32, -0.88, -0.45]], 0.045, 0.3, 8, 28), creature));
    const spade = mesh(new THREE.ConeGeometry(0.06, 0.14, 4), creature, 0.34, -0.9, -0.4);
    spade.rotation.set(0.6, 0, -1.4); spade.scale.set(1, 1, 0.3);
    tailG.add(spade);
    body.add(tailG);
    parts.tail = tailG;
  }
  if (look.demon) {   // muscle: chest and stomach
    for (const side of [-1, 1]) {
      const pec = mesh(new THREE.SphereGeometry(0.085 * w, 16, 12), creature, 0.07 * side * w, 0.4, 0.075 * w);
      pec.scale.set(1.1, 0.75, 0.6);
      spine.add(pec);
      for (let k = 0; k < 3; k++) spine.add(mesh(new THREE.SphereGeometry(0.035 * w, 10, 8), creature, 0.035 * side * w, 0.29 - k * 0.065, 0.085 * w)).children.at(-1).scale.set(1, 0.8, 0.5);
    }
  }
  if (look.shoulderSpikes) for (const side of [-1, 1]) for (let k = 0; k < 3; k++) {
    const sp = mesh(new THREE.ConeGeometry(0.022, 0.13 - k * 0.025, 6), mat(0x1c1612, { roughness: 0.4 }), (0.2 + k * 0.03) * side * w, 0.56, -0.02 - k * 0.04);
    sp.rotation.set(-0.3, 0, -0.5 * side);
    spine.add(sp);
  }
  if (look.wings) {
    for (const side of [-1, 1]) {
      const wing = mesh(new THREE.ConeGeometry(0.3, 0.9, 3), mat(0x1a0c08, { emissive: 0x330800, side: THREE.DoubleSide }), 0.32 * side, 0.45, -0.18);
      wing.rotation.set(0.3, 0, -1.1 * side);
      spine.add(wing);
    }
  }

  // ---- Arms: shoulder → upper arm → elbow → forearm → hand ----
  // rotation.x = -π/2 points an arm forward, -π overhead; elbow rotation.x < 0 bends the forearm forward
  for (const side of [-1, 1]) {
    const shoulder = new THREE.Group();
    shoulder.position.set((fem ? 0.19 : 0.215) * side * w, 0.5, 0);
    shoulder.add(mesh(new THREE.SphereGeometry(0.062 * lw, 14, 10), M.sleeve));
    shoulder.add(mesh(new THREE.CylinderGeometry(0.058 * lw, 0.047 * lw, 0.29, 14), M.sleeve, 0, -0.15, 0));
    if (armor === "plate") {   // pauldron
      const p = mesh(new THREE.SphereGeometry(0.1, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), metal(look.body), 0.012 * side, 0.025, 0);
      p.scale.set(1.12, 0.95, 1.1);
      shoulder.add(p);
      shoulder.add(mesh(new THREE.TorusGeometry(0.098, 0.009, 6, 24), trimMat, 0.012 * side, 0.012, 0)).children.at(-1).rotation.x = Math.PI / 2;
    }
    const elbow = new THREE.Group();
    elbow.position.y = -0.3;
    shoulder.add(elbow);
    elbow.add(mesh(new THREE.SphereGeometry(0.047 * lw, 12, 8), M.sleeve));
    if (look.robe) {   // wide flowing sleeve
      const sl = mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.27, 16, 1, true), cloth(look.body), 0, -0.13, 0);
      sl.material.side = THREE.DoubleSide;
      elbow.add(sl);
      elbow.add(mesh(new THREE.CylinderGeometry(0.036, 0.03, 0.24, 12), skin, 0, -0.13, 0));
    } else {
      elbow.add(mesh(new THREE.CylinderGeometry(0.046 * lw, 0.036 * lw, 0.26, 14), M.forearm, 0, -0.13, 0));
    }
    const hand = new THREE.Group();
    hand.position.y = -0.3;
    elbow.add(hand);
    const palm = mesh(new THREE.BoxGeometry(0.055, 0.085, 0.035), M.hand, 0, -0.015, 0);
    hand.add(palm);
    hand.add(mesh(new THREE.CylinderGeometry(0.012, 0.011, 0.05, 8), M.hand, -0.03 * side, -0.005, 0.02)).children.at(-1).rotation.z = 0.6 * side;   // thumb
    spine.add(shoulder);
    parts[side < 0 ? "armL" : "armR"] = shoulder;
    parts[side < 0 ? "elbowL" : "elbowR"] = elbow;
    parts[side < 0 ? "handL" : "handR"] = hand;
  }
  if (!look.noWeapon) {
    const main = buildWeapon(look.weapon || "sword", look);
    parts.handR.add(main);
    parts.orb = main.userData.orb;
    if (look.weapon === "bow") { parts.handR.remove(main); parts.handL.add(main); }
  }
  if (look.offhand) parts.handL.add(buildWeapon(look.offhand, look));

  body.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { body, parts, mats: [M.torso, skin, M.sleeve, M.shin, creature] };
}

// =====================================================================
//  3D MODELS (.glb) — optional, replace the placeholder figures
// =====================================================================
const loader = new GLTFLoader();
const modelCache = new Map();
let availableModels = new Set();

const slug = (name) => name.toLowerCase().replace(/\s+\d+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
// Which model file a character uses — the FIRST of these that's in viewer/models/:
//   players:  ryan.glb (just that character) → knight-female.glb (class + body) → knight.glb (class) → female.glb (anyone with that body)
//   enemies:  their name with dashes, e.g. the-hollow-king.glb, crypt-ghoul.glb
const modelFilesFor = (u) => u.kind === "p"
  ? [slug(u.name), `${u.className.toLowerCase()}-${u.body || "male"}`, u.className.toLowerCase(), u.body || "male"].map(f => f + ".glb")
  : [slug(u.name) + ".glb"];
const modelFileFor = (u) => modelFilesFor(u).find(f => availableModels.has(f)) || modelFilesFor(u)[0];

const realModelName = new Map();   // "knight.glb" -> "Knight.glb" (capital letters in file names are fine)
async function refreshModelList() {
  let files = [];
  try { files = await (await fetch("/api/models")).json(); } catch { /* no models */ }
  realModelName.clear();
  for (const f of files) realModelName.set(f.toLowerCase(), f);
  availableModels = new Set(realModelName.keys());
}
function loadModel(file) {
  if (!availableModels.has(file)) return Promise.resolve(null);
  if (!modelCache.has(file)) {
    const real = realModelName.get(file) || file;
    modelCache.set(file, loader.loadAsync("models/" + real.split("/").map(encodeURIComponent).join("/")).catch(err => { console.warn("Could not load", real, err); return null; }));
  }
  return modelCache.get(file);
}

// Which animation clip to use for each state — matched by words in the clip's name
const CLIP_WORDS = {
  idle: ["idle", "stand"], run: ["run", "walk", "jog"], attack: ["attack", "slash", "swing", "strike", "melee", "punch"],
  cast: ["cast", "spell", "magic", "shoot"], death: ["death", "die", "dead"], hit: ["hit", "damage", "hurt"],
};
function pickClips(animations, mixer, extra = {}) {
  const out = {};
  for (const [state, words] of Object.entries(CLIP_WORDS)) {
    const clip = animations.find(c => words.some(w => c.name.toLowerCase().includes(w))) || extra[state];
    if (clip) out[state] = mixer.clipAction(clip);
  }
  return out;
}

// Animations from viewer/models/animations/ — one animation per file, named after what it is
// (Mixamo gives you one animation per download). For a Knight, "knight-attack.glb" wins over "attack.glb".
//   idle.glb  run.glb  attack.glb  cast.glb  death.glb  hit.glb
// Animation FILES are matched by words in their names too, so Mixamo's own names work as they are:
// "sword-and-shield-idle.glb" is an idle, "running.glb" a run, "standing-1h-magic-attack-01.glb" a cast.
const ANIM_FILE_WORDS = { idle: ["idle"], run: ["run", "jog", "sprint"], attack: ["slash", "attack", "strike", "swing", "punch", "stab"], cast: ["magic", "spell", "cast"], death: ["death", "dying", "die"], hit: ["hit", "impact", "react"] };
function animationFilesFor(state, cls) {
  const all = [...availableModels].filter(f => f.startsWith("animations/")).sort();
  const name = (f) => f.slice(11);
  const fits = (f) => ANIM_FILE_WORDS[state].some(w => name(f).includes(w)) && (state === "cast" || !/magic|spell/.test(name(f)));
  return [
    `animations/${cls}-${state}.glb`, `animations/${state}.glb`,                     // exact names first
    ...all.filter(f => name(f).startsWith(cls + "-") && fits(f)),                    // knight-sword-slash.glb (Knights only)
    ...all.filter(f => fits(f) && !Object.keys(CLASS_LOOK).some(c => name(f).startsWith(c.toLowerCase() + "-"))),   // everyone
  ];
}
async function sharedClips(u, modelScene) {
  const out = {};
  const cls = u.kind === "p" ? u.className.toLowerCase() : slug(u.name);
  for (const state of Object.keys(CLIP_WORDS)) {
    for (const file of animationFilesFor(state, cls)) {
      const gltf = await loadModel(file);
      if (!gltf?.animations?.length) continue;
      const words = CLIP_WORDS[state];
      const clip = gltf.animations.find(c => words.some(w => c.name.toLowerCase().includes(w))) || gltf.animations[0];
      out[state] = retargetClip(clip, gltf.scene, modelScene);
      break;
    }
  }
  return out;
}

// RETARGETING: an animation made for one skeleton, played on another.
// Skeletons exported by different tools can sit in different starting orientations (one "lying down",
// one standing), so each bone's rotation is corrected by the difference between the two rest poses.
// Bone names are matched loosely ("mixamorig:Hips", "mixamorig1:Hips", "Hips" are the same bone).
// Only the hips keep their movement (bobbing); other bones keep the model's own bone lengths.
const retargetCache = new WeakMap();
function retargetClip(clip, srcRoot, dstRoot) {
  if (!dstRoot) return clip;
  let perModel = retargetCache.get(dstRoot);
  if (!perModel) { perModel = new Map(); retargetCache.set(dstRoot, perModel); }
  if (perModel.has(clip)) return perModel.get(clip);
  const key = (n) => n.replace(/^.*mixamorig\d*[:_]?/i, "").replace(/[^a-z0-9]/gi, "").toLowerCase();
  const src = new Map(), dst = new Map();
  srcRoot.traverse(o => { if (o.name) src.set(o.name, o); });
  dstRoot.traverse(o => { if (o.name && (o.isBone || /hips|spine|arm|leg|hand|foot|head|neck|shoulder/i.test(o.name))) { const k = key(o.name); if (!dst.has(k) || o.isBone) dst.set(k, o); } });
  // For each bone: target = A × source × B, where (all in the rest pose, in world space)
  //   A = (target parent)⁻¹ × (source parent)     B = (source bone)⁻¹ × (target bone)
  // so the bone turns the same way in the world on both skeletons, whatever their axes are.
  srcRoot.updateMatrixWorld(true); dstRoot.updateMatrixWorld(true);
  const worldQ = (o) => o ? o.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion();
  const tracks = [], q = new THREE.Quaternion();
  for (const t of clip.tracks) {
    const dot = t.name.lastIndexOf(".");
    const node = t.name.slice(0, dot), prop = t.name.slice(dot + 1);
    const s = src.get(node), d = dst.get(key(node));
    if (!d) continue;
    const A = worldQ(d.parent).invert().multiply(worldQ(s?.parent));
    const B = worldQ(s).invert().multiply(worldQ(d));
    const aligned = Math.abs(A.w) > 0.999;
    if (prop === "quaternion") {
      const values = t.values.slice();
      for (let i = 0; i < values.length; i += 4) { q.fromArray(values, i).premultiply(A).multiply(B).normalize().toArray(values, i); }
      tracks.push(new THREE.QuaternionKeyframeTrack(`${d.name}.quaternion`, t.times, values));
    } else if (prop === "position" && /hips/i.test(node) && aligned && s) {
      // Skeletons can be in different units (centimetres vs metres): scale the hip movement by
      // how high the hips sit at rest on each skeleton, so the body doesn't fly off (or sink)
      const ratio = s.position.length() > 1e-6 ? d.position.length() / s.position.length() : 1;
      const values = t.values.slice();
      for (let i = 0; i < values.length; i++) values[i] *= ratio;
      tracks.push(new THREE.VectorKeyframeTrack(`${d.name}.position`, t.times, values));
    }
  }
  const out = new THREE.AnimationClip(clip.name, clip.duration, tracks);
  perModel.set(clip, out);
  return out;
}

// IN PLACE: take the forward/sideways travel out of an animation (like Mixamo's "In Place" box),
// keeping the up-and-down bounce. Works on the hips, whichever way the skeleton is turned.
const inPlaceCache = new WeakMap();
function makeInPlace(clip, root) {
  let perRoot = inPlaceCache.get(root);
  if (!perRoot) { perRoot = new Map(); inPlaceCache.set(root, perRoot); }
  if (perRoot.has(clip)) return perRoot.get(clip);
  let out = clip;
  const track = clip.tracks.find(t => /hips\.position$/i.test(t.name));
  if (track) {
    let hips = null;
    const nodeName = track.name.slice(0, track.name.lastIndexOf("."));
    root.traverse(o => { if (!hips && o.name === nodeName) hips = o; });
    root.updateMatrixWorld(true);
    const q = hips?.parent ? hips.parent.getWorldQuaternion(new THREE.Quaternion()) : new THREE.Quaternion();
    const qi = q.clone().invert();
    const v = track.values.slice(), v0 = new THREE.Vector3(v[0], v[1], v[2]), d = new THREE.Vector3();
    let moved = 0;
    for (let i = 0; i < v.length; i += 3) {
      d.set(v[i], v[i + 1], v[i + 2]).sub(v0).applyQuaternion(q);   // this frame's travel, in world directions
      moved = Math.max(moved, Math.hypot(d.x, d.z));
      d.x = 0; d.z = 0;                                              // keep only the bounce
      d.applyQuaternion(qi).add(v0);
      v[i] = d.x; v[i + 1] = d.y; v[i + 2] = d.z;
    }
    if (moved > 1e-6) {
      out = clip.clone();
      const i = out.tracks.findIndex(t => t.name === track.name);
      out.tracks[i] = new THREE.VectorKeyframeTrack(track.name, track.times, v);
    }
  }
  perRoot.set(clip, out);
  return out;
}

// The right-hand bone of a rigged model (Mixamo: "mixamorigRightHand")
const findBone = (model, re) => { let hit = null; model.traverse(o => { if (!hit && o.isBone && re.test(o.name)) hit = o; }); return hit; };

// How a hand is built, in the hand bone's own space (the model must be in its rest pose, e.g. T-pose):
//   fingers  wrist → middle knuckle          blade  the thumb side, square to the fingers (a sword sticks out here)
//   back     the back of the hand            forearm  elbow → wrist
//   palm     the middle of the palm (where a grip sits)
function handGrip(model, hand, side) {
  const bone = (re) => findBone(model, re);
  const middle = bone(new RegExp(`${side}HandMiddle1$|${side}_?middle_?0?1$`, "i")) || bone(new RegExp(`${side}HandIndex1$`, "i"));
  const thumb = bone(new RegExp(`${side}HandThumb1$|${side}_?thumb_?0?1$`, "i"));
  const fore = bone(new RegExp(`${side}ForeArm$|${side}_?forearm$|lower_?arm_?${side[0]}$`, "i"));
  if (!middle || !thumb || !fore) return null;
  model.updateMatrixWorld(true);
  const w = (o) => o.getWorldPosition(new THREE.Vector3());
  const hw = w(hand), mw = w(middle), tw = w(thumb), fw = w(fore);
  const toLocal = (p) => hand.worldToLocal(p.clone());
  const dirLocal = (from, to) => toLocal(to).sub(toLocal(from)).normalize();
  const fingers = dirLocal(hw, mw);
  const thumbDir = dirLocal(hw, tw);
  const blade = thumbDir.clone().addScaledVector(fingers, -thumbDir.dot(fingers)).normalize();
  // back of the hand: square to fingers and thumb; in a T-pose it points up
  let back = new THREE.Vector3().crossVectors(fingers, blade).normalize();
  const upLocal = dirLocal(hw, hw.clone().add(new THREE.Vector3(0, 1, 0)));
  if (back.dot(upLocal) < 0) back.negate();
  const forearm = dirLocal(fw, hw);
  const palm = toLocal(hw.clone().lerp(mw, 0.55));
  return { fingers, blade, back, forearm, palm };
}

// Abilities that play the weapon SWING animation (auto-attacks always do). Every other ability plays
// the SPELL animation. Add or remove ability names here to change it — they're the keys from the class files.
const SWING_ABILITIES = new Set([
  "righteousStrike",                                                        // Knight
  "heroicStrike", "mortalStrike", "whirlwind", "execute", "pummel",         // Warrior

// ---- Settings for .glb models (change these if a model's weapon sits wrong) ----
const MODEL_SETTINGS = {

  weaponOffset: [0, 0.08, 0.02],   // metres from the hand bone

  shieldOffset: [0.06, -0.12, 0],
};
{ const q = new URLSearchParams(location.search), wr = q.get("weaponRot"), sr = q.get("shieldRot");
  if (wr) MODEL_SETTINGS.weaponRotation = wr.split(",").map(Number);

// =====================================================================
//  UNITS — one per player / enemy
// =====================================================================
const plates = $("plates");

class Unit {
  constructor(o) {
    Object.assign(this, o);            // kind ("p"/"e"), index, name, className, role, isBoss, elite
    this.look = o.kind === "p" ? CLASS_LOOK[o.className] || CLASS_LOOK.Warrior : enemyLook(o.name, o.isBoss, o.elite);
    this.size = this.look.size || 1;
    this.height = 1.85 * this.size;
    this.hp = 1; this.dead = false; this.facing = 0; this.targetFacing = 0;
    this.tx = 0; this.tz = 0; this.speed = 0; this.runBlend = 0; this.placed = false;
    this.deathK = 0; this.flash = 0; this.phase = Math.random() * 10;
    this.oneShot = null; this.casting = null;

    this.root = new THREE.Group();
    this.root.userData.unit = this;   // lets a mouse click find which unit was hit
    this.root.scale.setScalar(this.size);
    this.pose = new THREE.Group();
    this.root.add(this.pose);
    if (this.look.dragon) this.height = 3.0 * this.size;   // dragons are long and tall
    // Monsters with their own bodies (creatures.js): skeletons, ghouls, imps, the giant, hounds, hawks, wisps
    const ck = o.kind !== "p" && !this.look.dragon ? creatureKind(o.name) : null;
    const fig = this.look.dragon ? buildDragon(this.look) : ck ? buildCreature(ck, this.look, hashName(this.name)) : buildFigure(this.look, hashName(this.name), o.body);
    if (ck) { this.creature = fig.rig; this.height = fig.height * this.size; }
    this.isDragon = !!this.look.dragon;
    this.figure = fig.body; this.parts = fig.parts; this.mats = fig.mats;
    this.pose.add(this.figure);

    // Knight: radiant holy wings, and the golden Sanctified Aura circle on the ground
    if (this.look.holyWings) {
      this.wingMats = [];
      const radiant = () => { const m = mat(0xfff6dc, { side: THREE.DoubleSide, emissive: 0xffc845, emissiveIntensity: 0.9, roughness: 0.6, metalness: 0 }); this.wingMats.push(m); return m; };
      this.holyWings = buildWings(1.7, 0.85, radiant);
      this.holyWings.group.position.set(0, 0.42, -0.14);
      this.parts.spine.add(this.holyWings.group);
      const aura = new THREE.Group();
      const add = (geo, color, opacity) => {
        const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
        m.rotation.x = -Math.PI / 2;
        m.userData.max = opacity;
        aura.add(m);
        return m;
      };
      const R = 10 / this.size;   // the aura's radius (10 m)
      add(new THREE.CircleGeometry(R, 48), 0xffd966, 0.13).position.y = 0.04;
      add(new THREE.RingGeometry(R * 0.96, R, 64), 0xffe9a0, 0.9).position.y = 0.05;
      add(new THREE.RingGeometry(R * 0.55, R * 0.58, 48), 0xffd966, 0.5).position.y = 0.05;
      this.auraRunes = new THREE.Group();
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const rune = add(new THREE.PlaneGeometry(0.5, 0.18), 0xfff2c0, 0.85);
        rune.position.set(Math.cos(a) * R * 0.78, 0.06, Math.sin(a) * R * 0.78);
        rune.rotation.z = -a;
        aura.remove(rune);
        this.auraRunes.add(rune);
      }
      aura.add(this.auraRunes);
      this.auraGroup = aura;
      this.auraAlpha = 0;
      this.root.add(aura);
    }

    // Valkyrie: Pegasus (life 1) and her own wings (life 2)
    if (o.className === "Valkyrie") {
      this.mounted = true;
      this.baseHeight = this.height;
      this.pegasus = buildPegasus();
      this.root.add(this.pegasus.group);
      this.backWings = buildWings(1.5, 0.75);
      this.backWings.group.position.set(0, 0.42, -0.14);
      this.backWings.group.scale.setScalar(0.001);   // folded away until the Pegasus falls
      this.parts.spine.add(this.backWings.group);
      this.wingsOpen = 0;
    }

    // Coloured ring on the ground: blue tank, green healer, red dps, orange enemy
    const ringColor = ROLE_RING[o.kind === "p" ? o.role : o.kind === "m" ? "pet" : "enemy"] ?? 0xffffff;
    this.ring = new THREE.Mesh(new THREE.RingGeometry(0.55, 0.68, 28),
      new THREE.MeshBasicMaterial({ color: ringColor, transparent: true, opacity: 0.7, depthWrite: false }));
    this.ring.rotation.x = -Math.PI / 2;
    this.ring.position.y = 0.03;
    this.root.add(this.ring);

    // Glowing orb in front of the chest while casting
    this.castGlow = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.castGlow.position.set(0, this.isDragon ? 2.6 : 1.25, this.isDragon ? 2.4 : 0.55);
    this.castGlow.visible = false;
    this.root.add(this.castGlow);
    scene.add(this.root);

    // Nameplate
    this.plate = document.createElement("div");
    this.plate.className = "plate" + (o.kind === "e" ? " enemy" : "") + (o.kind === "m" ? " pet" : "") + (o.isBoss ? " boss" : "");
    const color = o.kind === "p" ? CLASS_COLORS[o.className] || "#fff" : "#ff9a7a";
    this.plate.innerHTML = `<div class="pn" style="color:${color}">${o.name}</div><div class="ph"><div></div></div>`;
    this.plateFill = this.plate.querySelector(".ph div");
    plates.appendChild(this.plate);

    this.tryModel();
  }

  async tryModel() {
    const gltf = await loadModel(modelFileFor(this));
    if (!gltf || this.disposed) return;
    const model = cloneSkinned(gltf.scene);
    model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
    // Size: players are 1.85 m tall (a little less for female bodies); monsters keep their own size setting.
    // Measure the posed skin (Mixamo models are built in centimetres inside a scaled skeleton).
    model.updateMatrixWorld(true);
    model.traverse(o => { if (o.isSkinnedMesh) { o.skeleton.update(); o.computeBoundingBox?.(); } });
    const box = new THREE.Box3().setFromObject(model);
    const h = box.max.y - box.min.y || 1;
    const s = (this.body === "female" ? 1.76 : 1.85) / h;
    model.scale.setScalar(s);
    model.position.y = -box.min.y * s;
    const extraClips = await sharedClips(this, gltf.scene);   // (loads the animations/ folder first, so nothing plays half-set-up)
    if (this.disposed) return;
    const mixer = new THREE.AnimationMixer(model);
    // Animations play IN PLACE (the game moves the character itself) — except deaths, which can fall away
    const inPlaceExtra = Object.fromEntries(Object.entries(extraClips).map(([st, c]) => [st, st === "death" ? c : makeInPlace(c, gltf.scene)]));
    const ownClips = gltf.animations.map(c => /death|die|dying|dead/i.test(c.name) ? c : makeInPlace(c, gltf.scene));
    this.clips = pickClips(ownClips, mixer, inPlaceExtra);
    this.current = null;
    this.mixer = mixer;
    this.figure.visible = false;
    this.pose.add(model);
    this.model = model;
    model.updateMatrixWorld(true);
    // The class weapon in the right hand and the off-hand item (shield, second dagger) in the left —
    // unless the model already carries its own (a mesh named sword / shield / ...)
    const rightHand = findBone(model, /right_?hand$|hand_?r$|r_?hand$|hand\.r$/i);
    const leftHand = findBone(model, /left_?hand$|hand_?l$|l_?hand$|hand\.l$/i);
    const has = (re) => { let w = false; model.traverse(o => { if (o.isMesh && re.test(o.name)) w = true; }); return w; };
    const ownWeapon = has(/sword|axe|staff|spear|scythe|dagger|weapon|mace|hammer|bow/i), ownShield = has(/shield/i);
    const unitScale = this.root.scale.x || 1;
    const putInHand = (bone, kind, left) => {
      const holder = new THREE.Group();
      const ws = new THREE.Vector3(); bone.getWorldScale(ws);
      const k = unitScale / (ws.x || 1);                       // undo the bone's scale so the item is life size
      const item = buildWeapon(kind, this.look);
      if (kind !== "shield") item.rotation.set(0, 0, 0);        // built pointing up (+Y) from the grip
      holder.add(item);
      const grip = handGrip(model, bone, left ? "Left" : "Right");
      if (grip) {
        // Worked out from the hand itself (fingers, thumb, back of the hand) — works whatever way
        // the model's bones are turned. Sword: blade comes out of the fist on the thumb side.
        // Shield: face out from the back of the hand, long side along the forearm.
        const basis = new THREE.Matrix4();
        if (kind === "shield") {
          const y = grip.forearm.clone(), x = grip.back.clone();
          const z = new THREE.Vector3().crossVectors(x, y).normalize(); y.crossVectors(z, x).normalize();
          basis.makeBasis(x, y, z);
          holder.position.copy(grip.palm).addScaledVector(grip.back, 0.05 * k / unitScale).addScaledVector(grip.forearm, -0.1 * k / unitScale);
        } else {
          const y = grip.blade.clone(), z = grip.fingers.clone();
          const x = new THREE.Vector3().crossVectors(y, z).normalize(); z.crossVectors(x, y).normalize();
          basis.makeBasis(x, y, z);
          holder.position.copy(grip.palm).addScaledVector(grip.back, -0.015 * k / unitScale);
        }
        holder.quaternion.setFromRotationMatrix(basis);
        holder.scale.setScalar(k);
      } else {   // no finger bones: fall back to the fixed settings
        holder.scale.setScalar(k);
        holder.rotation.set(...(kind === "shield" ? MODEL_SETTINGS.shieldRotation : MODEL_SETTINGS.weaponRotation));
        holder.position.set(...(kind === "shield" ? MODEL_SETTINGS.shieldOffset : MODEL_SETTINGS.weaponOffset).map(v => v * k));
        if (left) holder.scale.x *= -1;
      }
      bone.add(holder);
      return item;
    };
    if (MODEL_SETTINGS.addWeapon && this.kind === "p" && !this.look.noWeapon) {
      const mainKind = this.look.weapon || "sword";
      const mainHand = mainKind === "bow" ? leftHand : rightHand;
      if (mainHand && !ownWeapon) this.parts.orb = putInHand(mainHand, mainKind, mainKind === "bow").userData.orb || this.parts.orb;
      if (this.look.offhand && leftHand && !(this.look.offhand === "shield" ? ownShield : ownWeapon)) putInHand(leftHand, this.look.offhand, true);
    }
    // Knight and Valkyrie wings move from the built-in figure onto the model's back
    for (const w of [this.holyWings, this.backWings]) {
      if (!w) continue;
      const scale = w.group.scale.x;
      this.pose.add(w.group);
      w.group.position.set(0, (this.body === "female" ? 1.26 : 1.33), -0.16);
      w.group.scale.setScalar(scale);
    }
  }

  // New data from the simulation (10 times a second)
  setFrame(x, z, hp, dead, casting, facing, castKey, castProg, frameDt, resourcePct, mounted, auraUp, blessed) {
    this.auraUp = !!auraUp;
    this.blessed = !!blessed;
    if (resourcePct != null) this.resourcePct = resourcePct;
    if (this.pegasus && mounted != null && this.mounted && !mounted) this.pegasusFalls();
    if (this.pegasus && mounted != null) this.mounted = !!mounted;
    const moved = Math.hypot(x - this.tx, z - this.tz);
    if (!this.placed) { this.root.position.set(x, 0, z); this.placed = true; }
    else this.speed = moved / frameDt;
    if (this.speed > 1.5 && moved > 0.05 && !casting) this.targetFacing = Math.atan2(z - this.tz, x - this.tx);   // face where you run
    else if (facing != null) this.targetFacing = facing;
    this.tx = x; this.tz = z;
    if (hp < this.hp - 0.04) this.flash = 0.15;   // big hit: flash red
    this.hp = hp;
    if (dead && !this.dead) { this.dead = true; this.deathK = 0; this.oneShot = null; }
    else if (!dead && this.dead) { this.dead = false; this.reviving = true; }   // brought back by a revive!
    this.casting = casting ? (castKey || "_cast") : null;
    this.castProg = castProg || 0;
    this.root.visible = true;
    this.gone = false;
  }

  // Played when the unit uses an ability or swings its weapon
  act(key, target, spec) {
    if (this.dead) return;
    if (target && target !== this) this.targetFacing = Math.atan2(target.root.position.z - this.root.position.z, target.root.position.x - this.root.position.x);
    // Swing or cast? Players: auto-attacks and the abilities in SWING_ABILITIES swing their weapon,
    // everything else plays the spell animation. Monsters go by the ability's effect.
    const melee = key === "_swing" || (this.kind === "p" ? SWING_ABILITIES.has(key) : spec.type === "slash" || spec.type === "cone");
    this.oneShot = { kind: melee ? "attack" : "spell", t: 0, len: melee ? 0.45 : 0.4 };
  }

  update(dt, t) {
    // Glide toward the latest position from the simulation
    const k = Math.min(1, dt * 10);
    this.root.position.x = lerp(this.root.position.x, this.tx, k);
    this.root.position.z = lerp(this.root.position.z, this.tz, k);
    let d = this.targetFacing - this.facing;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    this.facing += d * Math.min(1, dt * 12);
    this.root.rotation.y = Math.PI / 2 - this.facing;   // sim angle → model facing +Z
    this.running = !this.dead && this.speed > 0.8;

    // Dying / getting back up
    if (this.dead) this.deathK = Math.min(1, this.deathK + dt / 0.6);
    else if (this.reviving) { this.deathK = Math.max(0, this.deathK - dt / 0.8); if (!this.deathK) this.reviving = false; }
    const hasDeathClip = this.mixer && this.clips.death;
    const fall = hasDeathClip ? 0 : 1 - Math.pow(1 - this.deathK, 3);
    this.pose.rotation.x = -Math.PI / 2 * fall * 0.95;
    this.pose.position.y = 0.15 * fall;
    this.ring.visible = !this.dead && !this.noRing;

    if (this.pegasus) this.animateValkyrie(dt, t, fall);
    if (this.holyWings) this.animateKnight(dt, t);
    // Standing in a Knight's aura: a golden glint now and then
    if (this.blessed && fancy && !this.dead && Math.random() < dt * 2.5) {
      const p = this.root.position;
      particles.one(p.x + (Math.random() - 0.5), p.y + this.height * (0.3 + Math.random() * 0.6), p.z + (Math.random() - 0.5), 0, 1.2, 0, 0xffe08a, 0.8, 0);
    }
    // Bosses give off embers (the Tyrant) or ghostly wisps (the Hollow King)
    const fx = this.look.embers ?? this.look.wisps;
    if (fx && fancy && !this.dead && Math.random() < dt * 14) {
      const p = this.root.position, s = this.size, a = Math.random() * Math.PI * 2, r = Math.random() * 0.35 * s;
      const up = this.look.embers ? 1.5 + Math.random() * 2 : 0.4 + Math.random() * 0.6;
      particles.one(p.x + Math.cos(a) * r, p.y + this.height * (0.15 + Math.random() * 0.7), p.z + Math.sin(a) * r,
        (Math.random() - 0.5) * 0.6, up, (Math.random() - 0.5) * 0.6, Math.random() < 0.3 ? 0xffffff : fx, 1 + Math.random() * 1.2, 0.3);
    }
    if (this.oneShot) { this.oneShot.t += dt; if (this.oneShot.t >= this.oneShot.len) this.oneShot = null; }

    if (this.mixer) this.animateModel(dt);
    else if (this.isDragon) this.animateDragon(dt, t);
    else if (this.creature && this.creature !== "figure") animateCreature(this, dt, t, fancy);
    else this.animateFigure(dt, t);

    // Casting orb
    this.castGlow.visible = !!this.casting && !this.dead;
    if (this.castGlow.visible) {
      this.castGlow.material.color.setHex(castColor(this.casting));
      this.castGlow.scale.setScalar(0.8 + this.castProg * 1.4 + Math.sin(t * 20) * 0.15);
    }

    // Hit flash
    this.flash = Math.max(0, this.flash - dt);
    for (const m of this.mats) {
      if (m.userData.baseEmissive == null) m.userData.baseEmissive = m.emissive.getHex(), m.userData.baseI = m.emissiveIntensity;
      if (this.flash > 0) { m.emissive.setHex(0xff2222); m.emissiveIntensity = this.flash * 8; }
      else { m.emissive.setHex(m.userData.baseEmissive); m.emissiveIntensity = m.userData.baseI; }
    }
  }

  // Animation for the built-in figures (done with maths, no animation files):
  // walking/running with bending knees and swinging arms, sword swings, spell casting, breathing
  animateFigure(dt, t) {
    const P = this.parts;
    this.runBlend = lerp(this.runBlend, this.running ? 1 : 0, Math.min(1, dt * 8));
    const rb = this.runBlend, cyc = t * 10 + this.phase;
    const sw = Math.sin(cyc);
    // Arms swing opposite the legs when running; elbows bend like a real runner
    let aR = -0.08 - sw * 0.55 * rb, aL = -0.08 + sw * 0.55 * rb;
    let eR = -0.18 - 0.9 * rb, eL = -0.18 - 0.9 * rb;
    const legs = sw * 0.75 * rb;
    let kL = 0.04 + Math.max(0, Math.sin(cyc + 0.7)) * 1.15 * rb;
    let kR = 0.04 + Math.max(0, Math.sin(cyc + 0.7 + Math.PI)) * 1.15 * rb;
    let lean = (this.look.hunch ? 0.45 : 0) + 0.14 * rb;
    let twist = 0;
    const breathe = Math.sin(t * 1.8 + this.phase);
    const bob = Math.abs(sw) * 0.06 * rb + breathe * 0.006;

    if (this.casting) {   // both hands forward, gathering energy
      aR = -1.15 + Math.sin(t * 7) * 0.06; aL = -1.15 - Math.sin(t * 7) * 0.06;
      eR = -0.55; eL = -0.55;
    }
    if (this.oneShot) {
      const k = this.oneShot.t / this.oneShot.len;
      if (this.oneShot.kind === "attack") {   // wind up overhead with a bent elbow, then swing down and follow through
        const wind = -2.6, hit = -0.25;
        aR = k < 0.35 ? lerp(aR, wind, k / 0.35) : k < 0.6 ? lerp(wind, hit, (k - 0.35) / 0.25) : lerp(hit, -0.1, (k - 0.6) / 0.4);
        eR = k < 0.35 ? lerp(eR, -1.3, k / 0.35) : k < 0.6 ? lerp(-1.3, -0.05, (k - 0.35) / 0.25) : lerp(-0.05, -0.18, (k - 0.6) / 0.4);
        twist = k < 0.35 ? -0.35 * (k / 0.35) : k < 0.6 ? lerp(-0.35, 0.3, (k - 0.35) / 0.25) : lerp(0.3, 0, (k - 0.6) / 0.4);
        if (this.look.offhand === "dagger") { aL = k < 0.5 ? lerp(-0.1, -1.5, k * 2) : lerp(-1.5, -0.1, (k - 0.5) * 2); eL = -0.4; }
        lean += k > 0.35 && k < 0.7 ? 0.18 : 0;
      } else {   // spell: thrust both hands forward
        const e = Math.sin(Math.PI * k);
        aR = lerp(aR, -1.65, e); aL = lerp(aL, -1.65, e);
        eR = lerp(eR, -0.1, e); eL = lerp(eL, -0.1, e);
      }
    }
    if (this.dead) { aR = -0.25; aL = -0.25; eR = -0.3; eL = -0.3; kL = kR = 0.2; }
    P.armR.rotation.x = aR; P.armL.rotation.x = aL;
    P.armR.rotation.z = 0.06; P.armL.rotation.z = -0.06;   // arms hang slightly away from the body
    if (P.elbowR) { P.elbowR.rotation.x = eR; P.elbowL.rotation.x = eL; }
    // Riding the Pegasus: legs forward and apart, knees bent
    if (this.pegasus && this.mounted) {
      P.legL.rotation.set(-1.25, 0, -0.32); P.legR.rotation.set(-1.25, 0, 0.32);
      P.kneeL.rotation.x = 1.35; P.kneeR.rotation.x = 1.35;
    } else {
      P.legL.rotation.set(legs, 0, 0); P.legR.rotation.set(-legs, 0, 0);
      if (P.kneeL) { P.kneeL.rotation.x = kL; P.kneeR.rotation.x = kR; }
    }
    P.spine.rotation.x = lean;
    P.spine.rotation.y = twist;
    P.spine.scale.set(1 + breathe * 0.008, 1, 1 + breathe * 0.012);   // breathing
    if (P.head) P.head.rotation.x = -lean * 0.5;                      // keep looking ahead
    if (P.cape) P.cape.rotation.x = 0.06 + rb * 0.5 + Math.sin(t * 2.3 + this.phase) * 0.04;   // the cape flows back when running
    if (P.batWings) {   // slow, heavy wing beats; they flare open on big attacks and spells
      const flare = (this.casting ? 1 : 0) + (this.oneShot ? Math.sin(Math.PI * this.oneShot.t / this.oneShot.len) : 0);
      const beat = Math.sin(t * (1.3 + rb * 2) + this.phase) * (0.12 + rb * 0.15);
      const open = 0.35 + Math.min(1, flare) * 0.45;
      P.batWings.left.rotation.set(0.15, -0.75 + open * 0.5, -0.2 - open * 0.35 - beat);
      P.batWings.right.rotation.set(0.15, 0.75 - open * 0.5, 0.2 + open * 0.35 + beat);
    }
    if (P.tail) P.tail.rotation.y = Math.sin(t * 1.4 + this.phase) * 0.35;
    this.figure.position.y = bob;
    if (P.orb) P.orb.material.emissiveIntensity = this.casting ? 4 + Math.sin(t * 14) * 1.5 : 1.8;
  }

  // Animation for a real .glb model: cross-fade between its clips
  animateModel(dt) {
    const c = this.clips;
    let want = this.dead ? "death"
      : this.oneShot ? (this.oneShot.kind === "attack" ? "attack" : "cast")
      : this.casting ? "cast" : this.running ? "run" : "idle";
    const base = this.running && c.run ? "run" : "idle";
    if (!c[want]) want = want === "cast" ? (c.attack ? "attack" : base) : want === "attack" ? (c.cast ? "cast" : base) : base;
    if (want === "death" && !c.death) want = "idle";
    const next = c[want];
    // A new swing/spell restarts the animation even if the last one was the same kind
    const freshShot = this.oneShot && this.oneShot !== this.playingShot && (want === "attack" || want === "cast");
    if (next && (want !== this.current || freshShot)) {
      const once = want === "death" || (this.oneShot && (want === "attack" || want === "cast"));
      next.reset();
      next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity);
      next.clampWhenFinished = want === "death";
      next.timeScale = 1;
      if (once && want !== "death") {
        // Play the WHOLE swing (Mixamo swings are ~1.5 s) — sped up to about a second so it keeps up with combat
        const dur = next.getClip().duration;
        next.timeScale = Math.max(1, dur / 1.1);
        this.oneShot.len = Math.max(this.oneShot.len, dur / next.timeScale - 0.12);
        this.playingShot = this.oneShot;
      }
      if (want !== this.current) {
        next.fadeIn(0.12).play();
        if (this.current && c[this.current]) c[this.current].fadeOut(0.12);
      } else next.play();
      this.current = want;
    }
    if (c.run) c.run.timeScale = Math.max(0.6, Math.min(1.8, this.speed / 5));
    this.mixer.update(dt);
  }

  // Knight: holy wings beat slowly and blaze when the Sanctified Aura flares; the aura circle glows on the ground
  animateKnight(dt, t) {
    const on = this.auraUp && !this.dead;
    this.auraAlpha = lerp(this.auraAlpha, on ? 1 : 0, Math.min(1, dt * (on ? 6 : 2.5)));
    const a = this.auraAlpha;
    const W = this.holyWings;
    W.group.visible = !this.dead || this.deathK < 0.9;
    const beat = Math.sin(t * (this.running ? 6 : 1.8) + this.phase);
    const open = 0.5 + a * 0.5;   // spread wide when the aura is up
    W.left.rotation.set(0, -0.9 + open * 0.5, -0.25 - open * 0.45 - beat * 0.2);
    W.right.rotation.set(0, 0.9 - open * 0.5, 0.25 + open * 0.45 + beat * 0.2);
    W.group.scale.setScalar(0.9 + a * 0.25);
    for (const m of this.wingMats) m.emissiveIntensity = 0.9 + a * 2.6 + Math.sin(t * 4) * 0.2 * a;
    // Aura circle
    this.auraGroup.visible = a > 0.01;
    if (this.auraGroup.visible) {
      const pulse = 0.85 + Math.sin(t * 5) * 0.15;
      this.auraGroup.children.forEach(m => { if (m.material) m.material.opacity = m.userData.max * a * pulse; });
      this.auraRunes.children.forEach(m => { m.material.opacity = m.userData.max * a; });
      this.auraRunes.rotation.y = t * 0.6;
      if (fancy && on && Math.random() < dt * 30) {   // golden motes rising inside the aura
        const ang = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * 10, p = this.root.position;
        particles.one(p.x + Math.cos(ang) * d, 0.1, p.z + Math.sin(ang) * d, 0, 1 + Math.random() * 1.5, 0, Math.random() < 0.5 ? 0xffd966 : 0xfff2c0, 1.2 + Math.random(), 0);
      }
    }
  }

  // Dragon: breathing, swaying tail, wing beats, bites, breath attacks and taking to the sky
  animateDragon(dt, t) {
    const P = this.parts;
    this.runBlend = lerp(this.runBlend, this.running ? 1 : 0, Math.min(1, dt * 6));
    const breathe = Math.sin(t * 1.6 + this.phase);
    // Flying (Skyborne): rise up high with big wing beats
    const stunnedDown = this.staggeredUntil != null && lastT != null && lastT < this.staggeredUntil;   // fight time, so pause/2× speed stay in sync
    const wantAlt = this.dead || stunnedDown ? 0 : this.ascending ? 11 : this.flying ? 6 : 0;
    this.altitude = lerp(this.altitude || 0, wantAlt, Math.min(1, dt * (stunnedDown ? 6 : 1.5)));   // (a stagger slams him down fast)
    this.root.position.y = this.altitude + (this.altitude > 0.5 ? Math.sin(t * 2) * 0.4 : 0);
    this.ring.position.y = 0.03 - this.root.position.y / this.size;
    const airborne = this.altitude > 0.5;
    const beat = Math.sin(t * (airborne ? 6 : this.running ? 5 : 1.4) + this.phase);
    const spread = airborne || this.running ? 1 : 0.35;
    P.wings.left.rotation.set(0, -0.3, -(0.25 + spread * 0.5) - beat * (airborne ? 0.8 : 0.2));
    P.wings.right.rotation.set(0, 0.3, (0.25 + spread * 0.5) + beat * (airborne ? 0.8 : 0.2));
    P.tail.forEach((seg, i) => { seg.rotation.y = Math.sin(t * 1.3 + i * 0.6 + this.phase) * 0.12; seg.rotation.x = 0.06; });
    P.legs.forEach((l, i) => { l.rotation.x = airborne ? 0.6 : Math.sin(t * 8 + i * Math.PI / 2) * 0.5 * this.runBlend; });
    let neckX = -0.75 + breathe * 0.04, headX = 0.95, jaw = 0.05, glowOp = 0;
    if (this.casting) {   // rearing back, mouth glowing — something big is coming
      neckX = -1.05; headX = 1.15; jaw = 0.35 + this.castProg * 0.25; glowOp = 0.4 + this.castProg * 0.6;
    }
    if (this.oneShot) {
      const k = this.oneShot.t / this.oneShot.len, e = Math.sin(Math.PI * k);
      if (this.oneShot.kind === "attack") { neckX = lerp(neckX, -0.25, e); headX = lerp(headX, 0.6, e); jaw = 0.5 * e; }   // bite / claw lunge

      P.wings.left.rotation.set(0.2, -0.1, 0.35); P.wings.right.rotation.set(0.2, 0.1, -0.35);

  // Sovereign's Wrath: a growing ball of lightning in front of his maw while he charges, bolts lashing the ground
  animateStormOrb(dt, t) {

      const from = O.g.position.clone().add(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
      const v = O.g.position.clone().sub(from).multiplyScalar(1.6);

  // Valkyrie: flying on the Pegasus, or on foot with her wings out
  animateValkyrie(dt, t, fall) {
    const P = this.pegasus;
    if (this.mounted && P.group.parent === this.root) {
      const alt = 2.0 + Math.sin(t * 1.6 + this.phase) * 0.25;               // hovering above the fight
      this.root.position.y = alt;
      this.pose.position.y = 0.8 + 0.15 * fall;                                // rider sits in the saddle
      const flap = Math.sin(t * (this.running ? 9 : 5) + this.phase);
      P.wings.left.rotation.set(0, -0.35, -0.25 - flap * 0.7);
      P.wings.right.rotation.set(0, 0.35, 0.25 + flap * 0.7);
      P.legs.forEach((l, i) => { l.rotation.x = (i < 2 ? -0.7 : 0.6) + Math.sin(t * 3 + i) * 0.15; });   // legs tucked while flying
      P.group.rotation.x = this.running ? 0.12 : Math.sin(t * 1.6) * 0.04;

      if (F.t > 2.9) { scene.remove(F.group); this.falling = null; }
    }
  }

  pegasusFalls() {
    const P = this.pegasus;
    if (P.group.parent !== this.root) return;
    scene.attach(P.group);   // leave it in the world where it was hit
    this.falling = { group: P.group, wings: P.wings, t: 0, y0: P.group.position.y };
    effects.play({ type: "poof", color: 0xffffff }, this, null);           // a burst of white feathers
    effects.play({ type: "nova", color: 0x9fe7ff, radius: 6 }, this, null);
    if (fancy) particles.burst(P.group.position.clone().setY(P.group.position.y + 1.5), 0xffffff, 40, 4);
  }

  updatePlate(width, height) {
    const p = this.root.position;
    const v = new THREE.Vector3(p.x, p.y + this.height + 0.35, p.z).project(camera);
    const show = this.root.visible && v.z < 1 && !(this.dead && this.kind === "e") && this.kind !== "m";
    this.plate.style.display = show ? "" : "none";
    if (!show) return;
    this.plate.style.left = ((v.x + 1) / 2 * width) + "px";
    this.plate.style.top = ((1 - v.y) / 2 * height) + "px";
    this.plate.classList.toggle("dead", this.dead);
    this.plateFill.style.width = Math.round(this.hp * 100) + "%";
  }

  dispose() {
    this.disposed = true;
    scene.remove(this.root);
    this.plate.remove();
  }
}

//  GROUND ZONES (fire, soul eruptions, Holy Grounds)

const zoneMeshes = [];

  if (/Soul|Shadow|Doom|Hollow|Death|Grave/i.test(name)) return 0x9b5cff;

  return 0xff5a14;
}

  const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 40), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  const edge = new THREE.Mesh(new THREE.RingGeometry(0.93, 1, 48), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  const inner = new THREE.Mesh(new THREE.CircleGeometry(0.55, 24), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  [disc, edge, inner].forEach((m, i) => { m.rotation.x = -Math.PI / 2; m.position.y = 0.04 + i * 0.005; g.add(m); });
  g.userData = { disc, edge, inner };

}

function syncZones(all = []) {
  zoneState = all;
  syncHolyGrounds(all.filter(isHolyGround));
  syncHazards(all.filter(z => !isHolyGround(z)));
  const list = [];   // (the old flat circles — every zone now has its own look above)
  for (let i = 0; i < list.length; i++) {
    const [x, y, r, age, hostile, nameId, warn] = list[i];
    const g = zoneMeshes[i] || (zoneMeshes[i] = makeZone());
    g.visible = true;
    g.position.set(x, 0, y);
    g.scale.setScalar(r);
    const color = zoneColor(data?.zoneNames?.[nameId] || "", hostile);
    const { disc, edge, inner } = g.userData;
    disc.material.color.setHex(color); edge.material.color.setHex(color); inner.material.color.setHex(0xffffff);
    g.userData.age = age; g.userData.warn = hostile ? (warn ?? 1.5) : 0; g.userData.hostile = hostile;
  }
  for (let i = list.length; i < zoneMeshes.length; i++) zoneMeshes[i].visible = false;
}
function animateZones(t) {
  for (const g of zoneMeshes) {
    if (!g.visible) continue;
    const { disc, edge, inner, age, warn, hostile } = g.userData;
    if (age < warn) {   // warning: a pulsing outline — MOVE!
      const k = age / warn;
      edge.material.opacity = 0.5 + Math.sin(t * 18) * 0.4;
      disc.material.opacity = 0.08 + k * 0.2;
      inner.material.opacity = 0;
    } else {            // it's live: burning

      edge.material.opacity = 0.9;
      disc.material.opacity = (hostile ? 0.55 : 0.28) * f;
      inner.material.opacity = hostile ? 0.18 * f : 0.05;
    }
  }
}

// =====================================================================
//  HOLY GROUNDS — the Knight consecrates the ground under him:
//   · a pillar of light slams down from the sky and a shockwave rolls out
//   · a circle of glowing runes burns into the floor (two rings turning opposite ways)
//   · a shimmering curtain of light rises around the edge, shafts of light fall from above

//     scorches the enemies standing in it

  ring(500, 10); ring(480, 3); ring(372, 3); ring(354, 8);

  const N = 40;

    g.lineWidth = 5; g.beginPath();
    g.moveTo(0, -27); g.lineTo(0, 27);                       // each rune: a stave...
    const strokes = 2 + Math.floor(rnd() * 2);

      const y1 = (rnd() - 0.5) * 48, y2 = y1 + (rnd() - 0.5) * 36, x = (rnd() < 0.5 ? -1 : 1) * (9 + rnd() * 10);
      g.moveTo(0, y1); g.lineTo(x, y2);

    g.restore();

    g.save(); g.rotate(i / 8 * Math.PI * 2 + Math.PI / 8); g.translate(0, -490);
    g.beginPath(); g.moveTo(0, -18); g.lineTo(11, 0); g.lineTo(0, 18); g.lineTo(-11, 0); g.closePath(); g.fill();
    g.restore();

});
// Inner seal: an eight-pointed sun with rays and a cross in the middle
const HOLY_SEAL = holyCanvas(1024, (g, S) => {

// The ground glow: soft in the middle, brighter toward the edge
const HOLY_GLOW = holyCanvas(256, (g, S) => {
